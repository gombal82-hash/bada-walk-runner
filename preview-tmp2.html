<body>
<script>
var SIZES = { L844: [844, 390], L932: [932, 430], L667: [667, 375], P390: [390, 844], P320: [320, 568], D1280: [1280, 720] };

var f = document.createElement('iframe');
f.id = 'f';
f.width = size[0]; f.height = size[1];
f.style.width = size[0] + 'px'; f.style.height = size[1] + 'px';
f.src = './index.html?r=' + Date.now();
document.body.appendChild(f);

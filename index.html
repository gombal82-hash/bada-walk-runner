<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8fd0f2">
<title>바다 산책길 점프 러너</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;height:100dvh;overflow:hidden;background:#8fd0f2;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;touch-action:none;
  }
  #stage{position:fixed;inset:0;overflow:hidden;--gw:100vw;--gh:100vh;
    --st:env(safe-area-inset-top);--sr:env(safe-area-inset-right);
    --sb:env(safe-area-inset-bottom);--sl:env(safe-area-inset-left);}
  /* portrait viewport (phone upright, rotation lock on): the whole stage is
     turned 90° so the game is always played in landscape */
  #stage.rot{
    left:50%;top:50%;right:auto;bottom:auto;
    transform-origin:50% 50%;transform:translate(-50%,-50%) rotate(90deg);
  }
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:calc(12px + var(--st)) calc(14px + var(--sr)) calc(12px + var(--sb)) calc(14px + var(--sl));
    background:radial-gradient(120% 90% at 50% 38%,rgba(255,247,225,.26),rgba(38,42,30,.58));
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    transition:opacity .28s ease, transform .28s ease;z-index:5;
  }
  .overlay.hidden{opacity:0;pointer-events:none;transform:scale(1.02);}
  .card{
    width:min(94%,384px);max-height:100%;overflow:auto;
    background:linear-gradient(180deg,rgba(255,252,242,.975),rgba(255,241,216,.96));
    border-radius:28px;padding:20px 20px 18px;text-align:center;
    box-shadow:0 26px 60px -18px rgba(35,30,12,.55),0 0 0 1px rgba(255,255,255,.7) inset;
    border:1px solid rgba(255,255,255,.8);
    display:flex;flex-direction:column;align-items:center;
  }
  #titleCard .head{order:1;width:100%;}
  #titleCard .art{order:2;display:flex;justify-content:center;align-items:center;width:100%;}
  #titleCard .rest{order:3;width:100%;}
  .rotateHint{display:block;margin-top:8px;font-size:11.5px;font-weight:700;color:#a2946f;letter-spacing:-.01em;}
  #safeProbe{
    position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#ab8942;margin-bottom:7px;}
  h1{margin:0 0 2px;font-size:clamp(25px,calc(var(--gw) * 0.078),33px);line-height:1.12;font-weight:900;color:#2f2a1c;letter-spacing:-.025em;}
  h1 span{background:linear-gradient(100deg,#e0703a,#e8a33a 62%,#c2512f);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #heroImg{
    display:block;height:clamp(128px,calc(var(--gw) * 0.36),186px);width:auto;margin:4px auto 0;
    filter:drop-shadow(0 12px 16px rgba(70,55,25,.26));
    animation:bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-8px) rotate(1.2deg)}}
  .hint{margin:2px 0 15px;font-size:12.5px;line-height:1.75;color:#7d7156;font-weight:700;word-break:keep-all;}
  .hint b{color:#c2512f;}
  .hint i{font-style:normal;color:#b9a97f;}
  button{font-family:inherit;border:0;cursor:pointer;font-weight:800;-webkit-appearance:none;appearance:none;}
  .primary{
    display:block;width:100%;padding:15px 18px;border-radius:18px;font-size:17px;letter-spacing:-.01em;
    color:#fff8ef;background:linear-gradient(180deg,#f08a45,#d75f2e 70%,#c8512a);
    box-shadow:0 10px 20px -8px rgba(200,81,42,.85),0 1px 0 rgba(255,255,255,.45) inset;
    transition:transform .09s ease, box-shadow .12s ease;
  }
  .primary:active{transform:translateY(2px) scale(.988);box-shadow:0 4px 10px -6px rgba(200,81,42,.9);}
  .best{margin-top:12px;font-size:12.5px;color:#8a7c5d;font-weight:700;}
  .best b{color:#3a3324;font-size:14.5px;}
  .scoreBig{
    font-size:clamp(50px,calc(var(--gw) * 0.15),70px);font-weight:900;line-height:1;color:#2f2a1c;letter-spacing:-.045em;
    margin:2px 0 8px;text-shadow:0 3px 0 rgba(255,255,255,.6);
  }
  .scoreRow{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:#8a7c5d;font-weight:700;margin-bottom:16px;}
  .scoreRow b{color:#3a3324;}
  .newbest{
    background:linear-gradient(180deg,#ffd58a,#f0a63c);color:#6a3c12;border-radius:999px;
    padding:4px 10px;font-size:11px;font-weight:900;
    box-shadow:0 4px 10px -5px rgba(190,120,20,.9);
  }
  .hidden{display:none !important;}
  #muteBtn{
    position:absolute;z-index:6;top:calc(8px + var(--st));right:calc(8px + var(--sr));
    width:40px;height:40px;border-radius:50%;font-size:18px;line-height:1;
    color:#3d3521;background:rgba(255,252,240,.72);
    box-shadow:0 6px 14px -6px rgba(40,30,10,.5),0 0 0 1px rgba(255,255,255,.7) inset;
    display:flex;align-items:center;justify-content:center;
  }
  #muteBtn:active{transform:scale(.94);}

  /* ---------- landscape: two-column title card, compact over card ---------- */
  /* ---------- landscape (wide) framing: two-column title card ---------- */
  body.wide #titleCard{
    width:min(92%,600px);
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    grid-template-areas:"art head" "art rest";
    column-gap:clamp(14px,calc(var(--gw) * 0.026),28px);
    align-items:center;text-align:left;
    padding:clamp(12px,calc(var(--gh) * 0.034),20px) clamp(16px,calc(var(--gw) * 0.03),28px);
    border-radius:22px;
  }
  body.wide #titleCard .head{grid-area:head;align-self:end;order:0;}
  body.wide #titleCard .art{grid-area:art;align-self:center;order:0;width:auto;}
  body.wide #titleCard .rest{grid-area:rest;align-self:start;order:0;}
  body.wide #titleCard .eyebrow{font-size:10px;margin-bottom:4px;letter-spacing:.14em;}
  body.wide #titleCard h1{font-size:clamp(20px,calc(var(--gh) * 0.058),34px);margin-bottom:0;}
  body.wide #titleCard h1 br{display:none;}
  body.wide #titleCard #heroImg{height:clamp(110px,calc(var(--gh) * 0.46),182px);margin:0;}
  body.wide #titleCard .hint{font-size:clamp(11px,calc(var(--gh) * 0.0305),14px);line-height:1.55;margin:6px 0 11px;}
  body.wide #titleCard .hint i{display:block;margin-top:2px;}
  body.wide #titleCard .primary{display:block;width:100%;min-width:0;padding:clamp(10px,calc(var(--gh) * 0.029),14px) 22px;font-size:clamp(14px,calc(var(--gh) * 0.035),17px);border-radius:14px;}
  body.wide #titleCard .best{margin-top:7px;font-size:11.5px;}
  body.wide #titleCard .rotateHint{display:none;}
  body.wide #overCard{width:min(72%,430px);padding:clamp(10px,calc(var(--gh) * 0.03),18px) 22px;border-radius:22px;}
  body.wide #overCard .eyebrow{margin-bottom:3px;}
  body.wide #overCard .scoreBig{font-size:clamp(34px,calc(var(--gh) * 0.13),62px);margin:0 0 4px;}
  body.wide #overCard .scoreRow{margin-bottom:clamp(8px,calc(var(--gh) * 0.024),14px);font-size:12.5px;}
  body.wide #overCard .primary{padding:clamp(9px,calc(var(--gh) * 0.026),13px) 20px;font-size:clamp(13px,calc(var(--gh) * 0.032),16px);border-radius:14px;}
  body.wide.short #titleCard .eyebrow{display:none;}
  body.wide.short #titleCard .hint i{display:none;}
  body.short:not(.wide) .card{width:min(88%,420px);padding:14px 18px 13px;}
  body.short:not(.wide) #heroImg{height:120px;}
  body.short:not(.wide) h1{font-size:25px;}
  body.short:not(.wide) .hint{font-size:11.5px;margin:2px 0 11px;}

  /* ---------- stage picker (title card) ---------- */
  .stages{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%;margin:0 0 10px;}
  body.wide #titleCard .stages{justify-content:flex-start;margin:0 0 8px;}
  .chip{
    font-size:11.5px;font-weight:800;letter-spacing:-.01em;padding:7px 10px;border-radius:11px;
    color:#7a6c4d;background:rgba(255,255,255,.66);
    box-shadow:0 0 0 1px rgba(190,170,130,.55) inset;
    transition:transform .1s ease, background .16s ease, color .16s ease;
  }
  .chip.on{color:#fff8ef;background:linear-gradient(180deg,#f0a04a,#dd6a30);box-shadow:0 6px 12px -6px rgba(200,81,42,.8);}
  .chip.lock{color:#bcae90;background:rgba(255,255,255,.34);box-shadow:0 0 0 1px rgba(190,170,130,.3) inset;}
  .chip:active{transform:scale(.95);}
  body.wide.short .chip{font-size:10.5px;padding:5px 8px;}

  /* ---------- stage clear card ---------- */
  #clearCard{
    width:min(94%,382px);padding:16px 18px 15px;
    background:linear-gradient(180deg,rgba(255,253,246,.985),rgba(255,243,220,.97));
  }
  #clearCard .c-head{order:1;width:100%;}
  #clearCard .c-photo{order:2;width:100%;}
  #clearCard .c-rest{order:3;width:100%;}
  .clearEyebrow{
    font-size:11px;font-weight:900;letter-spacing:.16em;color:#c2512f;margin-bottom:5px;
  }
  .bigTitle{margin:0 0 3px;font-size:clamp(19px,calc(var(--gw) * 0.058),25px);font-weight:900;
    color:#2f2a1c;letter-spacing:-.03em;line-height:1.15;word-break:keep-all;}
  .subTitle{margin:0 0 6px;font-size:11.5px;font-weight:800;color:#a2946f;letter-spacing:-.01em;}
  .polaroid{
    position:relative;background:#fffdf7;padding:7px 7px 0;border-radius:7px;
    box-shadow:0 16px 30px -14px rgba(45,32,10,.65),0 0 0 1px rgba(255,255,255,.9) inset;
    transform:rotate(-2.4deg);width:100%;max-width:236px;margin:8px auto 10px;
  }
  .polaroid img{display:block;width:100%;height:auto;max-height:clamp(104px,25vh,188px);
    object-fit:cover;border-radius:3px;background:#dceaf2;}
  .polaroid .cap{font-size:11px;font-weight:800;color:#7c6c4c;padding:6px 2px 8px;text-align:center;letter-spacing:-.01em;}
  .polaroid .tape{position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(1.5deg);
    width:64px;height:16px;background:rgba(255,228,150,.72);border-radius:2px;
    box-shadow:0 2px 4px rgba(120,90,30,.18);}
  #clearCard .stats{display:flex;gap:14px;justify-content:center;font-size:12px;font-weight:800;color:#8a7c5d;margin:0 0 11px;}
  #clearCard .stats b{color:#3a3324;font-size:13.5px;}
  #clearCard .primary{margin-top:2px;}
  .ghost{
    display:block;width:100%;margin-top:7px;padding:10px 14px;border-radius:14px;font-size:13px;
    color:#8b7a56;background:rgba(255,255,255,.68);box-shadow:0 0 0 1px rgba(190,170,130,.6) inset;
    transition:transform .09s ease;
  }
  .ghost:active{transform:scale(.985);}
  .fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:26px;}
  .fx i{position:absolute;font-style:normal;font-size:15px;opacity:0;animation:spark 1.9s ease-in-out infinite;}
  .fx i:nth-child(1){left:7%;top:12%;animation-delay:.1s;}
  .fx i:nth-child(2){right:8%;top:20%;animation-delay:.55s;}
  .fx i:nth-child(3){left:13%;bottom:26%;animation-delay:1.05s;}
  .fx i:nth-child(4){right:12%;bottom:16%;animation-delay:1.5s;}
  .fx i:nth-child(5){left:48%;top:5%;animation-delay:.8s;}
  @keyframes spark{0%,100%{opacity:0;transform:scale(.6) rotate(0)}40%{opacity:.95;transform:scale(1.1) rotate(18deg)}70%{opacity:.2;transform:scale(.9) rotate(-10deg)}}
  @keyframes cardPop{0%{opacity:0;transform:scale(.9) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
  #clearCard.pop{animation:cardPop .42s cubic-bezier(.2,1.3,.4,1) both;}
  body.wide #clearCard{
    width:min(88%,540px);display:grid;align-items:center;text-align:left;
    grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);
    grid-template-areas:"chd cph" "crs cph";
    column-gap:clamp(12px,calc(var(--gw) * 0.022),22px);
    padding:clamp(10px,calc(var(--gh) * 0.03),16px) clamp(14px,calc(var(--gw) * 0.026),22px);
  }
  body.wide #clearCard .c-head{grid-area:chd;align-self:end;order:0;}
  body.wide #clearCard .c-photo{grid-area:cph;align-self:center;order:0;}
  body.wide #clearCard .c-rest{grid-area:crs;align-self:start;order:0;}
  body.wide #clearCard .clearEyebrow{font-size:10px;letter-spacing:.14em;margin-bottom:3px;}
  body.wide #clearCard .bigTitle{font-size:clamp(16px,calc(var(--gh) * 0.052),26px);}
  body.wide #clearCard .subTitle{font-size:10.5px;margin-bottom:2px;}
  body.wide #clearCard .polaroid{max-width:none;margin:2px auto;transform:rotate(-1.8deg);}
  body.wide #clearCard .polaroid img{max-height:clamp(96px,calc(var(--gh) * 0.42),170px);}
  body.wide #clearCard .polaroid .cap{font-size:10px;padding:4px 2px 6px;}
  body.wide #clearCard .stats{justify-content:flex-start;gap:12px;font-size:11px;margin:0 0 7px;}
  body.wide #clearCard .stats b{font-size:12.5px;}
  body.wide #clearCard .primary{padding:clamp(8px,calc(var(--gh) * 0.026),12px) 18px;font-size:clamp(12.5px,calc(var(--gh) * 0.032),15.5px);border-radius:13px;}
  body.wide #clearCard .ghost{padding:7px 14px;font-size:11.5px;border-radius:12px;margin-top:5px;}
  body.wide.short #clearCard .subTitle{display:none;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="safeProbe" aria-hidden="true"></div>

  <button id="muteBtn" aria-label="소리 켜기/끄기">🔊</button>

  <div class="overlay" id="startScreen">
    <div class="card" id="titleCard">
      <div class="head">
        <div class="eyebrow">산책길에서 만난 꼬마 영웅</div>
        <h1>바다 산책길 <br><span>점프 러너</span></h1>
      </div>
      <div class="art"><img id="heroImg" alt="바다"></div>
      <div class="rest">
        <p class="hint">
          <b>오른쪽 화면 톡</b> = 점프 · 한 번 더 톡 = 2단 점프<br>
          <b>왼쪽 화면 꾹</b> = 슬라이드 (배를 깔고 쭉 미끄러져요)<br>
          <i>스테이지를 완주하면 바다 사진이 짠! 📸</i>
        </p>
        <div class="stages" id="stagePick"></div>
        <button id="startBtn" class="primary">달리기 시작</button>
        <div class="best">최고 점수 <b id="startBest">0</b></div>
        <span class="rotateHint">📱 가로로 돌리면 더 넓게 달릴 수 있어요</span>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="overScreen">
    <div class="card" id="overCard">
      <div class="eyebrow" id="overStage">산책 끝!</div>
      <div class="scoreBig" id="overScore">0</div>
      <div class="scoreRow">
        <span>최고 <b id="overBest">0</b></span>
        <span id="newBestTag" class="newbest hidden">새 기록!</span>
      </div>
      <button id="againBtn" class="primary">다시 도전</button>
      <button id="pickBtn" class="ghost">스테이지 선택</button>
    </div>
  </div>

  <div class="overlay hidden" id="clearScreen">
    <div class="card" id="clearCard">
      <div class="fx" aria-hidden="true"><i>✨</i><i>🎉</i><i>⭐</i><i>✨</i><i>🐾</i></div>
      <div class="c-head">
        <div class="clearEyebrow" id="clearEyebrow">STAGE 1 CLEAR!</div>
        <h2 class="bigTitle" id="clearTitle">햇살 공원 산책길</h2>
        <p class="subTitle" id="clearSub">한 판 완주! 바다가 사진을 한 장 남겼어요</p>
      </div>
      <div class="c-photo">
        <div class="polaroid">
          <span class="tape" aria-hidden="true"></span>
          <img id="clearPhoto" alt="바다 사진">
          <div class="cap" id="clearCap">오늘도 완주 성공! 🐾</div>
        </div>
      </div>
      <div class="c-rest">
        <div class="stats">
          <span>스테이지 점수 <b id="clearScore">0</b></span>
          <span>최고 콤보 <b id="clearCombo">0</b></span>
          <span>누적 <b id="clearTotal">0</b></span>
        </div>
        <button id="nextBtn" class="primary">다음 스테이지 도전 →</button>
        <button id="retryBtn" class="ghost">이 스테이지 다시 달리기</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* =================================================================

/* ---------- obstacles ---------- */
function drawObstacle(o){
  var x = o.x;
  if (o.air) { drawAirObstacle(o); return; }
  if (o.kind === 'wall') { drawWallObstacle(o); return; }
  if (o.kind === 'cone') { drawConeObstacle(o); return; }
  if (o.kind === 'rock') { drawRockObstacle(o); return; }
  if (o.kind === 'crab') { drawCrabObstacle(o); return; }
  if (o.kind === 'ball') { drawBallObstacle(o); return; }
  if (o.kind === 'puddle') {
    var w = o.w, h = o.h;
    ctx.save();
    ctx.fillStyle = 'rgba(120,95,55,0.18)';
    ctx.beginPath(); ctx.ellipse(x, groundY + h * 0.24, w * 0.62, h * 0.6, 0, 0, TAU); ctx.fill();
    var g = ctx.createRadialGradient(x, groundY + h * 0.1, h * 0.1, x, groundY + h * 0.1, w * 0.62);
    g.addColorStop(0, 'rgba(176,228,255,0.96)');
    g.addColorStop(0.55, 'rgba(116,192,238,0.94)');
    g.addColorStop(1, 'rgba(84,152,200,0.55)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, groundY + h * 0.12, w * 0.6, h * 0.7, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = Math.max(1.4, sH * 0.011);
    ctx.beginPath();
    ctx.ellipse(x - w * 0.1, groundY + h * 0.02, w * 0.2, h * 0.10, -0.2, Math.PI * 1.05, Math.PI * 1.8);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x + w * 0.2, groundY + h * 0.1, w * 0.1, h * 0.05, 0.2, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
    ctx.restore();
    return;
  }

  if (o.kind === 'leaf') {
    var lw = o.w, lh = o.h;
    ctx.save();
    ctx.fillStyle = 'rgba(110,70,25,0.2)';
    ctx.beginPath(); ctx.ellipse(x, groundY + 1, lw * 0.55, lh * 0.16, 0, 0, TAU); ctx.fill();
    var leafCols = ['#d98b32', '#c8721f', '#e8a94a', '#b7631f', '#e3b04b'];
    for (var i = 0; i < 11; i++) {
      var a = (i / 10) * Math.PI;
      var lx = x + Math.cos(a + Math.PI) * lw * (0.44 - Math.abs(Math.sin(a)) * 0.12) + Math.sin(o.seed + i) * lw * 0.06;
      var ly = groundY - Math.abs(Math.sin(a)) * lh * 0.9 - lh * 0.04;
      var lr = lw * (0.15 + ((i * 7) % 4) / 44);
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(Math.sin(i * 2.1 + o.seed) * 1.1);
      ctx.fillStyle = leafCols[i % leafCols.length];
      ctx.beginPath();
      ctx.moveTo(-lr, 0);
      ctx.quadraticCurveTo(-lr * 0.2, -lr * 0.85, lr, 0);
      ctx.quadraticCurveTo(-lr * 0.2, lr * 0.85, -lr, 0);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(110,60,15,0.3)';
      ctx.lineWidth = Math.max(0.8, lr * 0.1);
      ctx.beginPath(); ctx.moveTo(-lr * 0.8, 0); ctx.lineTo(lr * 0.85, 0); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    return;
  }

  if (o.kind === 'hydrant') {
    var hw = o.w, hh = o.h, top = groundY - hh;
    ctx.save();
    ctx.fillStyle = 'rgba(120,95,55,0.22)';
    ctx.beginPath(); ctx.ellipse(x, groundY + 2, hw * 0.66, hh * 0.09, 0, 0, TAU); ctx.fill();
    var bg = ctx.createLinearGradient(x - hw / 2, 0, x + hw / 2, 0);
    bg.addColorStop(0, '#b83527');
    bg.addColorStop(0.4, '#ef5c3f');
    bg.addColorStop(1, '#9c271b');
    ctx.fillStyle = bg;
    roundRect(x - hw * 0.34, top + hh * 0.22, hw * 0.68, hh * 0.70, hw * 0.2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x, top + hh * 0.24, hw * 0.31, hh * 0.19, 0, Math.PI, TAU);
    ctx.fill();
    ctx.fillStyle = '#e14a34';
    roundRect(x - hw * 0.53, top + hh * 0.40, hw * 0.22, hh * 0.15, hw * 0.08); ctx.fill();
    roundRect(x + hw * 0.31, top + hh * 0.40, hw * 0.22, hh * 0.15, hw * 0.08); ctx.fill();
    ctx.fillStyle = '#ffd9a0';
    ctx.beginPath(); ctx.ellipse(x, top + hh * 0.05, hw * 0.10, hh * 0.06, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    roundRect(x - hw * 0.22, top + hh * 0.30, hw * 0.10, hh * 0.44, hw * 0.05); ctx.fill();
    ctx.fillStyle = '#8a2317';
    roundRect(x - hw * 0.4, groundY - hh * 0.1, hw * 0.8, hh * 0.11, hw * 0.05); ctx.fill();
    ctx.restore();
    return;
  }

  var bw = o.w, bh = o.h;
  ctx.save();
  ctx.fillStyle = 'rgba(55,105,48,0.22)';
  ctx.beginPath(); ctx.ellipse(x, groundY + 2, bw * 0.56, bh * 0.12, 0, 0, TAU); ctx.fill();
  var blobs = [[-0.28, 0.28, 0.34], [0, 0.42, 0.4], [0.28, 0.26, 0.32], [0.12, 0.2, 0.26], [-0.14, 0.18, 0.24]];
  for (var b = 0; b < blobs.length; b++) {
    var bx = x + bw * blobs[b][0], by = groundY - bh * blobs[b][1], br = bw * blobs[b][2];
    var gg2 = ctx.createRadialGradient(bx - br * 0.3, by - br * 0.4, br * 0.15, bx, by, br);
    gg2.addColorStop(0, '#82c66d');
    gg2.addColorStop(0.7, '#4b8f3e');
    gg2.addColorStop(1, '#2f6a2a');
    ctx.fillStyle = gg2;
    ctx.beginPath(); ctx.arc(bx, by, br, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#ffe066';
  for (var f = 0; f < 4; f++) {
    ctx.beginPath();
    ctx.arc(x + Math.sin(o.seed + f * 2.7) * bw * 0.34, groundY - bh * (0.42 + (f % 3) * 0.16), Math.max(1.6, sH * 0.016), 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawAirObstacle(o){
  var x = o.x, y = o.y, w = o.w, h = o.h;
  var flap = Math.sin(world.time * 15 + o.seed);
  ctx.save();
  ctx.fillStyle = 'rgba(70,60,40,0.13)';
  ctx.beginPath(); ctx.ellipse(x, groundY + 2, w * 0.32, sH * 0.028, 0, 0, TAU); ctx.fill();

  if (o.kind === 'crow') {
    ctx.fillStyle = '#3a3d48';
    ctx.beginPath();
    ctx.ellipse(x - w * 0.04, y - h * 0.12 - flap * h * 0.26, w * 0.40, h * 0.19, -0.20 + flap * 0.1, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#2b2d36';
    ctx.beginPath();
    ctx.ellipse(x - w * 0.02, y + h * 0.13 + flap * h * 0.20, w * 0.34, h * 0.16, 0.18 - flap * 0.1, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#20222a';
    ctx.beginPath(); ctx.ellipse(x, y, w * 0.30, h * 0.25, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w * 0.27, y - h * 0.11, w * 0.12, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f2a13c';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.36, y - h * 0.14);
    ctx.lineTo(x + w * 0.50, y - h * 0.05);
    ctx.lineTo(x + w * 0.36, y + h * 0.01);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x + w * 0.30, y - h * 0.16, w * 0.032, 0, TAU); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(x + w * 0.305, y - h * 0.16, w * 0.016, 0, TAU); ctx.fill();
  } else if (o.kind === 'gull') {
    drawGullShape(x, y, w, h, flap);
  } else {
    var spin = Math.abs(Math.sin(world.time * 22 + o.seed));
    ctx.strokeStyle = '#5a626b';
    ctx.lineWidth = Math.max(2, sH * 0.02);
    ctx.beginPath();
    ctx.moveTo(x - w * 0.46, y - h * 0.20);
    ctx.lineTo(x + w * 0.46, y - h * 0.20);
    ctx.stroke();
    ctx.fillStyle = 'rgba(205,224,238,0.62)';
    for (var s = -1; s <= 1; s += 2){
      ctx.beginPath();
      ctx.ellipse(x + s * w * 0.44, y - h * 0.20, w * 0.20, h * 0.055 * (0.35 + spin * 0.65), 0, 0, TAU);
      ctx.fill();
    }
    var dg = ctx.createLinearGradient(x, y - h * 0.20, x, y + h * 0.34);
    dg.addColorStop(0, '#e3ebf2');
    dg.addColorStop(1, '#93a0ab');
    ctx.fillStyle = dg;
    roundRect(x - w * 0.26, y - h * 0.16, w * 0.52, h * 0.42, h * 0.16); ctx.fill();
    ctx.fillStyle = '#2f3944';
    ctx.beginPath(); ctx.arc(x + w * 0.05, y + h * 0.02, h * 0.11, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,86,64,' + (0.45 + spin * 0.5).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(x - w * 0.15, y + h * 0.28, h * 0.07, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#6f7a85';
    ctx.lineWidth = Math.max(1.5, sH * 0.014);
    for (var l = -1; l <= 1; l += 2){
      ctx.beginPath();
      ctx.moveTo(x + l * w * 0.18, y + h * 0.24);
      ctx.lineTo(x + l * w * 0.24, y + h * 0.38);
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* ---------- new obstacles (v0.5) ---------- */
function drawWallObstacle(o){
  var x = o.x, w = o.w, h = o.h, top = groundY - h;
  ctx.save();
  ctx.fillStyle = 'rgba(45,32,18,0.22)';
  ctx.beginPath(); ctx.ellipse(x, groundY + 2, w * 0.56, sH * 0.036, 0, 0, TAU); ctx.fill();

  if (world.theme === 'beach'){
    /* 비치 파라솔 — 높아서 2단 점프로 넘는다 */
    ctx.strokeStyle = '#9a8368'; ctx.lineWidth = Math.max(2.4, w * 0.055);
    ctx.beginPath(); ctx.moveTo(x, groundY); ctx.lineTo(x, top + h * 0.34); ctx.stroke();
    var cw = w * 0.82, cy = top + h * 0.34;
    ctx.save();
    ctx.beginPath(); ctx.arc(x, cy, cw, Math.PI, TAU); ctx.closePath(); ctx.clip();
    for (var i = 0; i < 5; i++){
      ctx.fillStyle = i % 2 ? 'rgba(255,246,234,0.97)' : 'rgba(228,96,84,0.97)';
      ctx.fillRect(x - cw + i * (cw * 2 / 5), cy - cw, cw * 2 / 5 + 1, cw);
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(228,96,84,0.9)';
    ctx.lineWidth = Math.max(1.6, w * 0.03);
    ctx.beginPath(); ctx.arc(x, cy, cw, Math.PI, TAU); ctx.stroke();
    ctx.fillStyle = '#f7e9d2';
    ctx.beginPath(); ctx.arc(x, cy - cw * 0.92, Math.max(2, w * 0.05), 0, TAU); ctx.fill();
  } else if (world.theme === 'night'){
    /* 야간 바리케이드 */
    ctx.fillStyle = '#8b929c';
    roundRect(x - w * 0.44, top + h * 0.30, w * 0.10, h * 0.70, w * 0.03); ctx.fill();
    roundRect(x + w * 0.34, top + h * 0.30, w * 0.10, h * 0.70, w * 0.03); ctx.fill();
    ctx.save();
    roundRect(x - w * 0.56, top + h * 0.14, w * 1.12, h * 0.30, w * 0.05); ctx.clip();
    ctx.fillStyle = '#f0a33a'; ctx.fillRect(x - w * 0.6, top, w * 1.2, h);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    for (var s = -3; s <= 3; s++){
      ctx.save();
      ctx.translate(x + s * w * 0.20, top + h * 0.14); ctx.rotate(-0.5);
      ctx.fillRect(0, 0, w * 0.09, h * 0.30);
      ctx.restore();
    }
    ctx.restore();
    var blink = 0.45 + 0.55 * Math.abs(Math.sin(world.time * 4 + o.seed));
    ctx.fillStyle = 'rgba(255,96,64,' + blink.toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(x + w * 0.40, top + h * 0.10, Math.max(2.4, w * 0.07), 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(x - w * 0.44, top + h * 0.60, Math.max(1.6, w * 0.035), 0, TAU); ctx.fill();
  } else if (world.theme === 'sky'){
    /* 사탕 구름 기둥 */
    ctx.save();
    roundRect(x - w * 0.34, top + h * 0.12, w * 0.68, h * 0.88, w * 0.16); ctx.clip();
    for (var k = 0; k < 6; k++){
      ctx.fillStyle = k % 2 ? 'rgba(255,214,238,0.98)' : 'rgba(206,178,242,0.98)';
      ctx.fillRect(x - w * 0.4, top + h * 0.12 + k * (h * 0.88 / 6), w * 0.8, h * 0.88 / 6);
    }
    ctx.restore();
    drawCloudTint(x, top + h * 0.10, w * 0.40, 'rgba(255,255,255,0.96)', 0.96);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(x + w * 0.28, top + h * 0.30, Math.max(1.5, w * 0.045), 0, TAU); ctx.fill();
  } else {
    /* 햇살 공원: 키 큰 덤불 + 나무 울타리 */
    ctx.strokeStyle = '#b08a5c'; ctx.lineWidth = Math.max(2.4, w * 0.06);
    ctx.beginPath();
    ctx.moveTo(x - w * 0.58, top + h * 0.28); ctx.lineTo(x - w * 0.58, groundY);
    ctx.moveTo(x + w * 0.58, top + h * 0.28); ctx.lineTo(x + w * 0.58, groundY);
    ctx.moveTo(x - w * 0.58, top + h * 0.34); ctx.lineTo(x + w * 0.58, top + h * 0.34);
    ctx.stroke();
    var blobs = [[-0.26, 0.42, 0.40], [0.02, 0.62, 0.46], [0.28, 0.40, 0.36], [0.0, 0.30, 0.32]];
    for (var b = 0; b < blobs.length; b++){
      var bx = x + w * blobs[b][0], by = groundY - h * blobs[b][1], br = w * blobs[b][2];
      var gg = ctx.createRadialGradient(bx - br * 0.3, by - br * 0.4, br * 0.15, bx, by, br);
      gg.addColorStop(0, '#7cc168');
      gg.addColorStop(0.7, '#468c3c');
      gg.addColorStop(1, '#2c6428');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = '#ffe066';
    for (var f = 0; f < 3; f++){
      ctx.beginPath();
      ctx.arc(x + Math.sin(o.seed + f * 2.1) * w * 0.34, groundY - h * (0.62 + (f % 2) * 0.16), Math.max(1.6, sH * 0.015), 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawConeObstacle(o){
  var x = o.x, w = o.w, h = o.h, top = groundY - h;
  ctx.save();
  ctx.fillStyle = 'rgba(30,30,30,0.24)';
  ctx.beginPath(); ctx.ellipse(x, groundY + 2, w * 0.7, sH * 0.03, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#3a3f46';
  roundRect(x - w * 0.62, groundY - h * 0.10, w * 1.24, h * 0.10, h * 0.03); ctx.fill();
  var g = ctx.createLinearGradient(x - w * 0.4, 0, x + w * 0.4, 0);
  g.addColorStop(0, '#e2622c');
  g.addColorStop(0.45, '#ff8a3d');
  g.addColorStop(1, '#c94a1e');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - w * 0.40, groundY - h * 0.10);
  ctx.lineTo(x - w * 0.09, top + h * 0.06);
  ctx.quadraticCurveTo(x, top, x + w * 0.09, top + h * 0.06);
  ctx.lineTo(x + w * 0.40, groundY - h * 0.10);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,252,242,0.92)';
  ctx.beginPath();
  ctx.moveTo(x - w * 0.31, groundY - h * 0.36); ctx.lineTo(x + w * 0.31, groundY - h * 0.36);
  ctx.lineTo(x + w * 0.345, groundY - h * 0.24); ctx.lineTo(x - w * 0.345, groundY - h * 0.24);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.32)';
  ctx.beginPath();
  ctx.moveTo(x - w * 0.16, top + h * 0.14); ctx.lineTo(x - w * 0.06, top + h * 0.10);
  ctx.lineTo(x - w * 0.12, groundY - h * 0.14); ctx.lineTo(x - w * 0.22, groundY - h * 0.14);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawRockObstacle(o){
  var x = o.x, w = o.w, h = o.h;
  ctx.save();
  ctx.fillStyle = 'rgba(40,45,50,0.22)';
  ctx.beginPath(); ctx.ellipse(x, groundY + 2, w * 0.55, sH * 0.032, 0, 0, TAU); ctx.fill();
  var rocks = [[-0.18, 0.34, 0.30], [0.14, 0.42, 0.36], [0.0, 0.24, 0.24]];
  for (var i = 0; i < rocks.length; i++){
    var bx = x + w * rocks[i][0], by = groundY - h * rocks[i][1], br = w * rocks[i][2];
    var g = ctx.createRadialGradient(bx - br * 0.3, by - br * 0.45, br * 0.15, bx, by, br);
    g.addColorStop(0, '#c3bcae');
    g.addColorStop(0.6, '#938b7e');
    g.addColorStop(1, '#635c54');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(bx, by, br, br * 0.82, 0, 0, TAU); ctx.fill();
  }
  ctx.save();
  ctx.translate(x + w * 0.22, groundY - h * 0.78);
  ctx.rotate(-0.3);
  ctx.fillStyle = '#f08a5d';
  ctx.beginPath();
  for (var s = 0; s < 10; s++){
    var a = -Math.PI / 2 + s * TAU / 10, rr = (s % 2 ? w * 0.05 : w * 0.11);
    var px = Math.cos(a) * rr, py = Math.sin(a) * rr * 0.8;
    if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,180,0.7)';
  ctx.beginPath(); ctx.arc(0, -w * 0.02, Math.max(1, w * 0.02), 0, TAU); ctx.fill();
  ctx.restore();
  ctx.restore();
}

function drawCrabObstacle(o){
  var x = o.x, w = o.w, h = o.h;
  var bob = Math.sin(world.time * 6 + o.seed) * h * 0.08;
  ctx.save();
  ctx.fillStyle = 'rgba(30,25,20,0.2)';
  ctx.beginPath(); ctx.ellipse(x, groundY + 2, w * 0.46, sH * 0.028, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#b8402c';
  ctx.lineWidth = Math.max(1.8, w * 0.05);
  ctx.lineCap = 'round';
  for (var s = -1; s <= 1; s += 2){
    for (var i = 0; i < 3; i++){
      var lx = x + s * w * (0.16 + i * 0.10);
      ctx.beginPath();
      ctx.moveTo(lx, groundY - h * 0.30 + bob);
      ctx.quadraticCurveTo(lx + s * w * 0.06, groundY - h * 0.12, lx + s * w * 0.14, groundY - h * 0.02);
      ctx.stroke();
    }
  }
  var g = ctx.createRadialGradient(x - w * 0.10, groundY - h * 0.56 + bob, w * 0.05, x, groundY - h * 0.44 + bob, w * 0.44);
  g.addColorStop(0, '#ff8a6a');
  g.addColorStop(0.6, '#e3543a');
  g.addColorStop(1, '#b03a26');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(x, groundY - h * 0.44 + bob, w * 0.36, h * 0.44, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#c9462f';
  ctx.lineWidth = Math.max(1.6, w * 0.035);
  for (var e = -1; e <= 1; e += 2){
    var ex = x + e * w * 0.12, ey = groundY - h * 0.80 + bob;
    ctx.beginPath(); ctx.moveTo(x + e * w * 0.07, groundY - h * 0.60 + bob); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.fillStyle = '#fff8ef'; ctx.beginPath(); ctx.arc(ex, ey, Math.max(2, w * 0.055), 0, TAU); ctx.fill();
    ctx.fillStyle = '#2a1a14';
    ctx.beginPath(); ctx.arc(ex + e * Math.max(0.7, w * 0.018), ey, Math.max(1, w * 0.026), 0, TAU); ctx.fill();
  }
  for (var c = -1; c <= 1; c += 2){
    var cx = x + c * w * 0.46, cy = groundY - h * 0.52 + bob;
    ctx.fillStyle = '#ef6a4a';
    ctx.beginPath(); ctx.ellipse(cx, cy, w * 0.14, h * 0.20, c * 0.3, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,200,180,0.55)';
    ctx.beginPath(); ctx.ellipse(cx, cy - h * 0.06, w * 0.05, h * 0.08, 0, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawBallObstacle(o){
  var x = o.x, r = o.h * 0.5, cy = groundY - r + Math.sin(world.time * 9 + o.seed) * o.h * 0.03;
  ctx.save();
  ctx.fillStyle = 'rgba(40,30,20,0.22)';
  ctx.beginPath(); ctx.ellipse(x, groundY + 2, r * 0.95, sH * 0.03, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.38)';
  ctx.lineWidth = Math.max(1.4, sH * 0.012);
  for (var i = 0; i < 2; i++){
    ctx.beginPath();
    ctx.moveTo(x + r * 1.10, cy - r * 0.30 + i * r * 0.55);
    ctx.lineTo(x + r * 1.85, cy - r * 0.30 + i * r * 0.55);
    ctx.stroke();
  }
  ctx.translate(x, cy);
  ctx.rotate(o.rot || 0);
  var cols = ['#ff7a6a', '#ffd166', '#7ec8f0', '#a6e3a1', '#c9a6f0', '#ffb3d9'];
  ctx.fillStyle = '#fffaf0';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  for (var s = 0; s < 6; s++){
    ctx.fillStyle = cols[s];
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, s * TAU / 6, s * TAU / 6 + TAU / 12);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#fffdf6';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.20, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(90,70,40,0.28)';
  ctx.lineWidth = Math.max(1.2, r * 0.06);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath(); ctx.ellipse(-r * 0.32, -r * 0.38, r * 0.26, r * 0.14, -0.6, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawGullShape(x, y, w, h, flap){
  ctx.save();
  ctx.fillStyle = '#fbfaf4';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x - w * 0.30, y - h * (0.55 + flap * 0.35), x - w * 0.56, y - h * (0.05 + flap * 0.22));
  ctx.quadraticCurveTo(x - w * 0.28, y + h * 0.10, x, y + h * 0.05);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + w * 0.04, y);
  ctx.quadraticCurveTo(x + w * 0.34, y - h * (0.55 + flap * 0.35), x + w * 0.60, y - h * (0.05 + flap * 0.22));
  ctx.quadraticCurveTo(x + w * 0.32, y + h * 0.10, x + w * 0.04, y + h * 0.05);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(x, y + h * 0.04, w * 0.22, h * 0.17, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(x + w * 0.20, y - h * 0.14, w * 0.085, 0, TAU); ctx.fill();
  ctx.fillStyle = '#f0a63c';
  ctx.beginPath();
  ctx.moveTo(x + w * 0.27, y - h * 0.16);
  ctx.lineTo(x + w * 0.40, y - h * 0.10);
  ctx.lineTo(x + w * 0.27, y - h * 0.05);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath(); ctx.arc(x + w * 0.215, y - h * 0.17, Math.max(0.8, w * 0.014), 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(120,130,145,0.55)';
  ctx.lineWidth = Math.max(1.2, w * 0.02);
  ctx.beginPath();
  ctx.moveTo(x - w * 0.52, y - h * (0.05 + flap * 0.22));
  ctx.lineTo(x - w * 0.38, y - h * (0.02 + flap * 0.16));
  ctx.stroke();
  ctx.restore();
}

function roundRect(x, y, w, h, r){
  var rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

/* ---------- items ---------- */
function itemBob(o){ return Math.sin(world.time * 3 + o.seed) * sH * 0.032; }

function drawItemShadow(o){
  var alt = clamp((groundY - o.y) / (sH * 1.8), 0, 1);
  ctx.fillStyle = 'rgba(120,95,55,' + (0.14 * (1 - alt) + 0.03).toFixed(3) + ')';
  ctx.beginPath();
  ctx.ellipse(o.x, groundY + 2, o.w * 0.5 * (1 - alt * 0.45), o.h * 0.16, 0, 0, TAU);
  ctx.fill();
}

function drawItem(o){
  var x = o.x, y = o.y + itemBob(o);

  if (o.kind === 'bone') {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(o.seed + world.time * 2) * 0.14);
    var s = o.w * 0.5;
    var bg = ctx.createLinearGradient(0, -s * 0.6, 0, s * 0.6);
    bg.addColorStop(0, '#fffdf3');
    bg.addColorStop(0.55, '#f4e5c6');
    bg.addColorStop(1, '#d9bf92');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(-s * 0.62, -s * 0.3, s * 0.3, 0, TAU);
    ctx.arc(-s * 0.62, s * 0.3, s * 0.3, 0, TAU);
    ctx.arc(s * 0.62, -s * 0.3, s * 0.3, 0, TAU);
    ctx.arc(s * 0.62, s * 0.3, s * 0.3, 0, TAU);
    ctx.fill();
    roundRect(-s * 0.66, -s * 0.28, s * 1.32, s * 0.56, s * 0.2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    ctx.beginPath(); ctx.ellipse(-s * 0.3, -s * 0.12, s * 0.26, s * 0.085, -0.2, 0, TAU); ctx.fill();
    ctx.restore();
    return;
  }

  if (o.kind === 'gold') {
    var pulse = 1 + Math.sin(world.time * 4 + o.seed) * 0.06;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(pulse, pulse);
    var r = o.w * 0.5;
    var gl = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 2.2);
    gl.addColorStop(0, 'rgba(255,232,140,0.5)');
    gl.addColorStop(1, 'rgba(255,220,100,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(0, 0, r * 2.2, 0, TAU); ctx.fill();
    var g2 = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
    g2.addColorStop(0, '#fff8d6');
    g2.addColorStop(0.45, '#ffd354');
    g2.addColorStop(1, '#dd9610');
    ctx.fillStyle = g2;
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var ang = (i / 10) * TAU - Math.PI / 2, rr = (i % 2 === 0) ? r : r * 0.56;
      var px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(150,90,10,0.3)';
    ctx.lineWidth = Math.max(1, sH * 0.008);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.ellipse(-r * 0.22, -r * 0.3, r * 0.2, r * 0.11, -0.5, 0, TAU); ctx.fill();
    ctx.restore();
    return;
  }

  // magnet treat: 7초 동안 간식을 빨아들인다
  if (o.kind === 'magnet') {
    ctx.save();
    ctx.translate(x, y);
    var mg = o.w * 0.5;
    var aura2 = 0.30 + Math.sin(world.time * 5 + o.seed) * 0.08;
    var gl2 = ctx.createRadialGradient(0, 0, mg * 0.2, 0, 0, mg * 2.0);
    gl2.addColorStop(0, 'rgba(140,215,255,' + aura2.toFixed(2) + ')');
    gl2.addColorStop(1, 'rgba(90,170,255,0)');
    ctx.fillStyle = gl2;
    ctx.beginPath(); ctx.arc(0, 0, mg * 2.0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#d94a3d';
    ctx.lineWidth = Math.max(4, mg * 0.30);
    ctx.beginPath(); ctx.arc(0, mg * 0.02, mg * 0.62, Math.PI, TAU); ctx.stroke();
    ctx.lineWidth = Math.max(3, mg * 0.28);
    ctx.beginPath();
    ctx.moveTo(-mg * 0.62, mg * 0.02); ctx.lineTo(-mg * 0.62, mg * 0.52);
    ctx.moveTo(mg * 0.62, mg * 0.02); ctx.lineTo(mg * 0.62, mg * 0.52);
    ctx.stroke();
    ctx.strokeStyle = '#dfe7ee';
    ctx.lineWidth = Math.max(3, mg * 0.24);
    ctx.beginPath();
    ctx.moveTo(-mg * 0.62, mg * 0.44); ctx.lineTo(-mg * 0.62, mg * 0.56);
    ctx.moveTo(mg * 0.62, mg * 0.44); ctx.lineTo(mg * 0.62, mg * 0.56);
    ctx.stroke();
    ctx.restore();
    return;
  }

  // devil trident treat
  ctx.save();
  ctx.translate(x, y);
  var s2 = o.w * 0.5;
  var aura = 0.42 + Math.sin(world.time * 6 + o.seed) * 0.12;
  var ag = ctx.createRadialGradient(0, 0, s2 * 0.2, 0, 0, s2 * 2.1);
  ag.addColorStop(0, 'rgba(255,90,60,' + aura.toFixed(2) + ')');
  ag.addColorStop(0.45, 'rgba(215,45,25,' + (aura * 0.4).toFixed(2) + ')');
  ag.addColorStop(1, 'rgba(200,30,20,0)');
  ctx.fillStyle = ag;
  ctx.beginPath(); ctx.arc(0, 0, s2 * 2.1, 0, TAU); ctx.fill();

  ctx.rotate(Math.sin(world.time * 2.2 + o.seed) * 0.1);
  ctx.strokeStyle = '#d8341f';
  ctx.lineWidth = Math.max(2, s2 * 0.24);
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, s2 * 0.9); ctx.lineTo(0, -s2 * 0.3); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-s2 * 0.72, -s2 * 0.02);
  ctx.quadraticCurveTo(-s2 * 0.68, -s2 * 0.9, 0, -s2 * 0.32);
  ctx.quadraticCurveTo(s2 * 0.68, -s2 * 0.9, s2 * 0.72, -s2 * 0.02);
  ctx.stroke();
  ctx.fillStyle = '#ff6a4a';
  [[-s2 * 0.72, -s2 * 0.02], [0, -s2 * 0.86], [s2 * 0.72, -s2 * 0.02]].forEach(function(pt){
    ctx.beginPath();
    ctx.moveTo(pt[0], pt[1] - s2 * 0.2);
    ctx.lineTo(pt[0] + s2 * 0.15, pt[1] + s2 * 0.1);
    ctx.lineTo(pt[0] - s2 * 0.15, pt[1] + s2 * 0.1);
    ctx.closePath(); ctx.fill();
  });
  ctx.restore();
}

/* ---------- player ---------- */
/* every sprite is sized from its measured body box: the tallest normal frame is
   exactly sH tall, the tallest little-devil frame exactly sH × 1.2 */
var lastDraw = null;
function playerSet(){
  var p = world.player;
  /* 슬라이드는 납작하게 찌그러뜨리지 않고 전용 슬라이드 포즈로 그린다 */
  var sliding = world.slideAmt > 0.34 && p.onGround;
  if (world.fever > 0) {
    if (sliding && sprites.dslide && POSE.dslide) return { frames: [sprites.dslide], poses: [POSE.dslide], rate: 1.15, fever: true, slide: true };
    if (!p.onGround && sprites.devilJump && POSE.devilJump) return { frames: [sprites.devilJump], poses: [POSE.devilJump], rate: 1.15, fever: true };
    return { frames: sprites.devil, poses: POSE.devil, rate: 1.15, fever: true };
  }
  if (sliding && sprites.slide && POSE.slide) return { frames: [sprites.slide], poses: [POSE.slide], rate: 1, fever: false, slide: true };
  if (!p.onGround && sprites.jump) return { frames: [sprites.jump], poses: [POSE.jump], rate: 1, fever: false };
  return { frames: sprites.run, poses: POSE.run, rate: 1, fever: false };
}

function drawPlayer(){
  var p = world.player;
  var alt = groundY - p.y;
  var sl0 = world.slideAmt;

  var fade = clamp(1 - alt / (sH * 2.1), 0, 1);
  ctx.fillStyle = 'rgba(105,80,40,' + (0.22 * fade + 0.02).toFixed(3) + ')';
  ctx.beginPath();
  ctx.ellipse(p.x + sH * 0.03, groundY + sH * 0.014,
    sH * 0.44 * (0.62 + fade * 0.38) * (1 + 0.26 * sl0), sH * 0.075 * (1 - 0.25 * sl0), 0, 0, TAU);
  ctx.fill();

  var set = playerSet();
  var frames = set.frames || [];
  var poses = set.poses || [];
  var n = frames.length;
  var ready = n > 0;
  for (var q = 0; q < n; q++) {
    if (!frames[q] || !frames[q].complete || !frames[q].naturalWidth) ready = false;
  }
  if (!ready) {
    ctx.fillStyle = '#2c2a24';
    ctx.beginPath(); ctx.arc(p.x, p.y - sH * 0.4, sH * 0.26, 0, TAU); ctx.fill();
    return;
  }

  /* gallop cycle: one stride every ~0.3 body heights of travel */
  var sl = world.slideAmt;
  var phase = world.dist / (sH * 0.30 * set.rate);
  var fi = n > 1 ? (Math.floor(phase) % n) : 0;
  var img = frames[fi], pose = poses[fi];

  var k;
  if (set.slide) {
    /* 슬라이드 포즈는 실루엣 높이만 0.56×sH로 맞춘다 (몸을 눌러 찌그러뜨리지 않는다) */
    k = (sH * SLIDE_H * (set.fever ? FEVER_SCALE : 1)) /
        (set.fever ? REF_DSLIDE_BODY_H : REF_SLIDE_BODY_H);
  } else {
    k = set.fever ? (sH * FEVER_SCALE / REF_DEVIL_BODY_H) : (sH / REF_BODY_H);
  }
  var dw = pose.w * k, dh = pose.h * k;
  var dx = -pose.cx * k, dy = -pose.by * k;   // body centre at p.x, paws/belly on the ground line
  var bodyH = pose.bh * k;

  var bob = (p.onGround && !set.slide) ? Math.abs(Math.sin(phase * Math.PI)) * sH * 0.012 : 0;
  var tilt = p.onGround
    ? Math.sin(phase * Math.PI) * 0.018
    : clamp(p.vy / (sH * 11), -0.16, 0.20);
  tilt += set.slide ? 0.028 : 0.04 * sl;
  var sq = world.squash;
  /* scaleY 찌그러뜨리기 없음: 착지 스쿼시만 살짝, 슬라이드는 전용 포즈가 대신한다 */
  var sx = 1 + sq * 0.26;
  var sy = 1 - sq * 0.26;
  var cy = -bodyH * (set.slide ? 0.46 : 0.45);   // body centre, measured up from the feet line

  var glow = ctx.createRadialGradient(p.x, p.y + cy, bodyH * 0.2, p.x, p.y + cy, bodyH * 0.95);
  glow.addColorStop(0, 'rgba(255,250,225,0.13)');
  glow.addColorStop(1, 'rgba(255,250,225,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(p.x, p.y + cy, bodyH * 0.95, 0, TAU); ctx.fill();

  if (world.fever > 0) {
    var pl = 0.7 + Math.sin(world.time * 12) * 0.22;
    var hh = bodyH * 1.15;
    var ag = ctx.createRadialGradient(p.x, p.y + cy, bodyH * 0.05, p.x, p.y + cy, hh);
    ag.addColorStop(0, 'rgba(255,110,60,' + (0.4 * pl).toFixed(2) + ')');
    ag.addColorStop(0.55, 'rgba(220,45,25,' + (0.2 * pl).toFixed(2) + ')');
    ag.addColorStop(1, 'rgba(180,20,10,0)');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(p.x, p.y + cy, hh, 0, TAU); ctx.fill();
  }

  if (world.magnet > 0) {
    var mA = 0.32 + Math.sin(world.time * 8) * 0.08;
    ctx.strokeStyle = 'rgba(120,200,255,' + mA.toFixed(2) + ')';
    ctx.lineWidth = Math.max(2, sH * 0.016);
    ctx.beginPath(); ctx.arc(p.x, p.y + cy, bodyH * 0.88, 0, TAU); ctx.stroke();
  }

  ctx.save();
  if (world.invuln > 0 && Math.floor(world.invuln * 12) % 2 === 0) ctx.globalAlpha = 0.45;
  if (p.dead) ctx.globalAlpha = 0.9;
  ctx.translate(p.x, p.y + cy * sy - bob);
  ctx.rotate(tilt);
  ctx.scale(sx, sy);
  ctx.drawImage(img, dx, dy - cy, dw, dh);
  ctx.restore();
  lastDraw = { kind: set.slide ? 'slide' : (set.fever ? 'fever' : (p.onGround ? 'run' : 'jump')),
    bodyH: bodyH, h: dh, w: dw, sx: sx, sy: sy, slide: !!set.slide };
}

/* ---------- particles ---------- */
function drawParticles(front){
  for (var i = 0; i < world.parts.length; i++) {
    var q = world.parts[i];
    if ((q.kind === 'dot') !== front) continue;
    var a = clamp(q.life / q.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = a * (q.kind === 'smoke' ? 0.5 : 0.95);
    ctx.fillStyle = q.c;
    if (q.kind === 'smoke') {
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (1.5 - a * 0.4), 0, TAU); ctx.fill();
    } else {
      ctx.translate(q.x, q.y);
      ctx.rotate(q.rot);
      ctx.beginPath(); ctx.ellipse(0, 0, q.r, q.r * 0.6, 0, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

function drawPops(){
  for (var i = 0; i < world.pops.length; i++) {
    var q = world.pops[i];
    var a = clamp(q.life / q.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = Math.min(1, a * 1.6);
    ctx.font = '900 ' + Math.round(sH * 0.17) + 'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = Math.max(3, sH * 0.03);
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.strokeText(q.text, q.x, q.y);
    ctx.fillStyle = q.c;
    ctx.fillText(q.text, q.x, q.y);
    ctx.restore();
  }
}

/* ---------- hud ---------- */
/* 스테이지 표시 + 진행률 깃발 바 */
function drawStageBar(){
  var unit = Math.min(W, H);
  var labelSize = Math.round(clamp(unit * 0.036, 10, 15));
  var barW = Math.min(W * 0.40, 300);
  var barH = Math.max(6, unit * 0.019);
  var cx = W / 2;
  var yTop = Math.max(SAFE.t, 0) + Math.max(4, H * 0.016);
  var label = world.endless ? 'BONUS · 무한 런'
    : 'STAGE ' + world.stage + ' · ' + STAGES[world.stage - 1].short;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '900 ' + labelSize + 'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  var tw = ctx.measureText(label).width;
  ctx.fillStyle = 'rgba(255,252,240,0.74)';
  roundRect(cx - tw / 2 - 10, yTop - 2, tw + 20, labelSize + 8, (labelSize + 8) / 2);
  ctx.fill();
  ctx.fillStyle = '#4a4130';
  ctx.fillText(label, cx, yTop + labelSize + 1);

  var bx = cx - barW / 2, by = yTop + labelSize + 8;
  ctx.fillStyle = 'rgba(46,38,22,0.20)';
  roundRect(bx, by, barW, barH, barH / 2); ctx.fill();
  var p = world.endless ? 1 : clamp(world.progress, 0, 1);
  var fg = ctx.createLinearGradient(bx, 0, bx + barW, 0);
  fg.addColorStop(0, world.theme === 'night' ? '#7ea7ff' : '#ffd166');
  fg.addColorStop(1, world.theme === 'night' ? '#b98bff' : '#ff8a5c');
  ctx.fillStyle = fg;
  if (p > 0.002){
    roundRect(bx, by, Math.max(barH, barW * p), barH, barH / 2);
    ctx.fill();
  }
  /* 결승 깃발 */
  var fx = bx + barW + 2;
  ctx.strokeStyle = 'rgba(60,52,36,0.75)';
  ctx.lineWidth = Math.max(1.4, barH * 0.22);
  ctx.beginPath(); ctx.moveTo(fx, by - barH * 0.7); ctx.lineTo(fx, by + barH * 1.4); ctx.stroke();
  ctx.fillStyle = '#e35b3a';
  ctx.beginPath();
  ctx.moveTo(fx, by - barH * 0.7);
  ctx.lineTo(fx + barH * 1.15, by - barH * 0.25);
  ctx.lineTo(fx, by + barH * 0.2);
  ctx.closePath(); ctx.fill();
  if (!world.endless){
    var mx = bx + Math.max(barH, barW * p);
    ctx.font = '900 ' + Math.round(barH * 1.5) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
    ctx.fillStyle = '#7a5f28';
    ctx.fillText('🐾', mx, by + barH * 1.5);
    var remM = Math.max(0, Math.round((world.goalDist - world.dist) / sH * M_PER_SH));
    ctx.textAlign = 'right';
    ctx.font = '800 ' + Math.round(clamp(unit * 0.030, 9, 12)) + 'px -apple-system,"Apple SD Gothic Neo",sans-serif';
    ctx.fillStyle = 'rgba(58,51,36,0.62)';
    ctx.fillText(remM + 'm 남음', bx + barW, by + barH + 12);
  }
  ctx.restore();
}

function drawHud(){
  if (world.mode === 'ready') return;
  drawStageBar();
  var unit = Math.min(W, H);
  var padL = Math.max(14, W * 0.032) + SAFE.l;
  var padR = Math.max(14, W * 0.032) + SAFE.r;
  var top = Math.max(SAFE.t, 0) + Math.max(6, H * 0.022);
  var scoreSize = Math.round(clamp(unit * 0.088, 22, 60));
  var smallSize = Math.round(clamp(unit * 0.036, 10, 18));
  var topY = top + scoreSize;
  var mute = 40;

  ctx.save();
  ctx.textAlign = 'left';

  // score
  ctx.font = '900 ' + scoreSize + 'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText(fmt(world.score), padL + 2, topY + 2.5);
  ctx.fillStyle = '#3a3324';
  ctx.fillText(fmt(world.score), padL, topY);

  // best
  var bestY = topY + Math.round(scoreSize * 0.55) + smallSize * 0.4;
  ctx.font = '700 ' + smallSize + 'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  ctx.fillStyle = 'rgba(58,51,36,0.6)';
  ctx.fillText('최고 ' + fmt(world.best), padL, bestY);

  var stackY = bestY + 3;

  // combo
  if (world.combo > 1 && world.comboT > 0) {
    var combSize = Math.round(clamp(unit * 0.048, 13, 20));
    ctx.globalAlpha = clamp(world.comboT / 1.1, 0, 1);
    ctx.font = '900 ' + combSize + 'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    ctx.fillStyle = '#d95f2e';
    ctx.fillText('콤보 ' + world.combo + (comboMult() > 1 ? '  x' + comboMult() : ''), padL, stackY + combSize);
    ctx.globalAlpha = 1;
    stackY += combSize + 6;
  }

  // fever gauge
  if (world.fever > 0) {
    var bw = Math.min(W * 0.3, 220), bh = Math.max(8, unit * 0.028);
    var by = stackY + 10;
    ctx.fillStyle = 'rgba(60,40,20,0.2)';
    roundRect(padL, by, bw, bh, bh / 2); ctx.fill();
    var fg = ctx.createLinearGradient(padL, 0, padL + bw, 0);
    fg.addColorStop(0, '#ffc23d');
    fg.addColorStop(0.6, '#ff6b35');
    fg.addColorStop(1, '#d63a22');
    ctx.fillStyle = fg;
    roundRect(padL, by, Math.max(bh, bw * clamp(world.fever / world.feverMax, 0, 1)), bh, bh / 2); ctx.fill();
    ctx.font = '900 ' + Math.round(clamp(unit * 0.032, 10, 13)) + 'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    ctx.fillStyle = '#b83a1e';
    ctx.fillText('꼬마 악마 피버!', padL, by + bh + smallSize + 1);
  }

  // hearts, in line with the mute button at the top right
  var hs = clamp(unit * 0.05, 12, 26);
  var hy = Math.max(SAFE.t, 0) + 8 + mute / 2;
  var hx = W - SAFE.r - 8 - mute - 12 - hs * 0.55;
  for (var i = 0; i < 3; i++) {
    drawHeart(hx - i * (hs * 1.32), hy, hs * 0.48, i < world.lives);
  }

  // first-run hint: 두 조작을 한 줄로 + 좌/우 구역 라벨
  if (world.mode === 'playing' && world.hint > 0) {
    var hA = clamp(world.hint / 1.2, 0, 1) * 0.92;
    ctx.globalAlpha = hA;
    ctx.textAlign = 'center';
    ctx.font = '800 ' + Math.round(clamp(unit * 0.040, 11, 16)) + 'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    var txt = '오른쪽 톡 = 점프 · 두 번 톡 = 2단 점프        왼쪽 꾹 = 슬라이드';
    var tw = ctx.measureText(txt).width;
    var hy2 = Math.max(H * 0.26, SAFE.t + 58);
    ctx.fillStyle = 'rgba(255,252,240,0.90)';
    roundRect(W / 2 - tw / 2 - 14, hy2 - 17, tw + 28, 33, 16);
    ctx.fill();
    ctx.fillStyle = '#6b5f42';
    ctx.fillText(txt, W / 2, hy2 + 5);

    var zA = clamp((world.hint - 1.2) / 1.2, 0, 1) * 0.45;
    if (zA > 0.01) {
      var zy = H - Math.max(10, H * 0.05);
      ctx.globalAlpha = zA;
      ctx.font = '900 ' + Math.round(clamp(unit * 0.036, 10, 15)) + 'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
      ctx.fillStyle = '#7a5326';
      ctx.textAlign = 'left';
      ctx.fillText('◀ 왼쪽 꾹: 슬라이드', Math.max(14, W * 0.035), zy);
      ctx.textAlign = 'right';
      ctx.fillText('점프 · 2단 점프 ▶', W - Math.max(14, W * 0.035), zy);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }
  ctx.restore();
}

function drawHeart(cx, cy, r, filled){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();
  ctx.moveTo(0, r * 0.78);
  ctx.bezierCurveTo(-r * 1.55, -r * 0.34, -r * 0.66, -r * 1.4, 0, -r * 0.44);
  ctx.bezierCurveTo(r * 0.66, -r * 1.4, r * 1.55, -r * 0.34, 0, r * 0.78);
  ctx.closePath();
  if (filled) {
    var g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, '#ff8f74');
    g.addColorStop(1, '#df4128');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,75,45,0.3)';
  }
  ctx.lineWidth = Math.max(1.1, r * 0.16);
  ctx.stroke();
  ctx.restore();
}

function drawVignette(){
  if (world.fever > 0) {
    var a = 0.26 + Math.sin(world.time * 9) * 0.05;
    var g = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.3, W / 2, H * 0.45, Math.max(W, H) * 0.78);
    g.addColorStop(0, 'rgba(200,20,10,0)');
    g.addColorStop(1, 'rgba(190,20,10,' + a.toFixed(2) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  if (world.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,240,' + (world.flash * 0.3).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- loop ---------- */
var last = 0, fps = 60, fpsN = 0, fpsT = 0;
function frame(ts){
  if (!last) last = ts;
  var dt = (ts - last) / 1000;
  last = ts;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.05) dt = 0.05;          /* 탭 전환·프레임 스파이크 클램핑 */
  /* 긴 프레임이 와도 물리를 1/120초 단위로 나눠 돌려 장애물을 통과하지 않는다 */
  var steps = Math.max(1, Math.ceil(dt / (1 / 120)));
  var sdt = dt / steps;
  for (var s = 0; s < steps; s++) update(sdt);
  render();
  if (probeOn) {
    probeFrames.push({ d: world.dist, t: probeBuf.slice(0) });
    probeBuf.length = 0;
    if (probeFrames.length > 1500) probeFrames.shift();
  }
  fpsN++;
  if (ts - fpsT > 500) { fps = Math.round(fpsN * 1000 / (ts - fpsT)); fpsN = 0; fpsT = ts; }
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', function(){ if (!document.hidden) last = 0; });

/* ---------- dev hook ---------- */
window.__bada = {
  world: world,
  stages: STAGES,
  photos: PHOTOS,
  startFever: startFever,
  addItem: addItem,
  addObs: spawnObs,
  jump: jump,
  start: startGame,
  startStage: startStage,
  showTitle: showTitle,
  stageClear: stageClear,
  spawnBeat: spawnBeat,
  spawnFleet: spawnAirFleet,
  spawnCombo: spawnComboBeat,
  spawnWall: spawnWallBeat,
  spawnDouble: spawnDoubleGround,
  spawnBall: spawnBallBeat,
  spawnGlass: function(){
    var r = {};
    for (var i = 0; i < world.objects.length; i++){
      var o = world.objects[i];
      if (o.type !== 'obs') continue;
      r[o.kind] = (r[o.kind] || 0) + 1;
    }
    return r;
  },
  clearNow: function(){ world.dist = world.goalDist - 1; },
  layout: layout,
  sprites: sprites,
  pose: POSE,
  state: function(){
    return { W: W, H: H, sH: sH, groundY: groundY, horizonY: horizonY, rot: ROT, dpr: DPR,
      fps: fps, slide: world.player.slide, slideAmt: world.slideAmt,
      py: world.player.y, vy: world.player.vy, onGround: world.player.onGround,
      jumps: world.player.jumps, lives: world.lives, mode: world.mode, dist: world.dist,
      fever: world.fever, magnet: world.magnet, draw: lastDraw,
      stage: world.stage, theme: world.theme, endless: world.endless,
      goalM: world.goalM, goalDist: world.goalDist, progress: world.progress,
      score: world.score, stageScore: world.score - world.stageBase,
      unlocked: world.unlocked, endlessUnlocked: world.endlessUnlocked, pickStage: world.pickStage,
      objs: world.objects.length, maxCombo: world.maxCombo };
  },
  photoInfo: function(){
    var img = document.getElementById('clearPhoto');
    var r = img ? img.getBoundingClientRect() : null;
    return { count: (PHOTOS || []).length, naturalWidth: img ? img.naturalWidth : 0,
      naturalHeight: img ? img.naturalHeight : 0, srcLen: img ? String(img.src || '').length : 0,
      head: img ? String(img.src || '').slice(0, 48) : '', idx: world.lastPhotoIdx,
      box: r ? { w: Math.round(r.width), h: Math.round(r.height) } : null,
      cap: document.getElementById('clearCap') ? document.getElementById('clearCap').textContent : '' };
  },
  cardInfo: function(){
    var ids = ['startScreen', 'overScreen', 'clearScreen'];
    var o = {};
    for (var i = 0; i < ids.length; i++){
      var el = document.getElementById(ids[i]);
      o[ids[i]] = el ? !el.classList.contains('hidden') : null;
    }
    o.eyebrow = document.getElementById('clearEyebrow').textContent;
    o.title = document.getElementById('clearTitle').textContent;
    o.nextLabel = document.getElementById('nextBtn').textContent;
    o.retryLabel = document.getElementById('retryBtn').textContent;
    var c = document.getElementById('clearCard').getBoundingClientRect();
    o.card = { top: Math.round(c.top), bottom: Math.round(c.bottom), h: Math.round(c.height), w: Math.round(c.width) };
    return o;
  },
  setStage: function(n, endless){ startStage(n, !!endless, 0); },
  zoneOf: function(x, y){ return toGameX(x, y) < 0 ? 'left' : 'right'; },
  probeStart: function(){ probeFrames.length = 0; probeOn = true; return true; },
  probeStop: function(){ probeOn = false; return probeFrames.length; },
  probeFrames: function(){ return probeFrames; }
};

/* ---------- boot ---------- */
layout();
resetGame();
loadSprites(function(){
  var hero = document.getElementById('heroImg');
  if (SPR.hero) hero.src = SPR.hero;
  else hero.style.display = 'none';
  requestAnimationFrame(frame);
});

})();
</script>
</body>
</html>

function irand(a, b){ return Math.floor(rand(a, b + 1)); }
function lerp(a, b, t){ return a + (b - a) * t; }
function pick(a){ return a[(Math.random() * a.length) | 0]; }
function fmt(n){ return Math.round(n).toLocaleString('ko-KR'); }

/* ---------- seamless parallax ------------------------------------------
   배경의 모든 가로 반복 요소는 "슬롯"의 연속이다. 슬롯의 내용은 화면 좌표가
   아니라 *전역 슬롯 번호*의 순수 해시로만 정해지므로, 한 슬롯은 태어나서
   화면을 떠날 때까지 모양이 변하지 않는다. 스크롤 오프셋이 한 주기만큼
   되감겨도 그림이 픽셀 단위로 같아서 경계에서 튀는 곳이 없다. */
function h01(n){
  var s = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function hR(n, salt, a, b){ return a + (b - a) * h01(n * 1.7 + salt * 13.31); }

/* 슬롯 하나의 화면 x = (전역 번호 × 간격) - 누적 스크롤. 화면 양옆으로 한
   슬롯씩 더 그려서 어떤 위치에서도 빈틈이 없다. */
function eachSlot(spacing, factor, draw){
  var D = world.dist * factor;
  var n0 = Math.floor((D - spacing) / spacing) + 1;
  var n1 = Math.ceil((D + W + spacing) / spacing);
  for (var n = n0; n <= n1; n++) draw(n * spacing - D, n);
}

/* 배경 끊김 자동 검증용 기록 (테스트에서만 켠다) */
var probeOn = false, probeBuf = [], probeFrames = [];
function rec(layer, key, x, factor, sig){
  if (!probeOn) return;
  probeBuf.push([layer, key, Math.round(x * 100) / 100, factor, sig]);
}

/* ---------- canvas & layout ---------- */
var canvas = document.getElementById('game');
var stageEl = document.getElementById('stage');
var ctx = canvas.getContext('2d', { alpha: false });
var W = 360, H = 640, DPR = 1;
var horizonY = 330, groundY = 490, sH = 130;
var LAND = true, ROT = 0;
var SAFE = { t: 0, r: 0, b: 0, l: 0 };

/* world speed is tied to the character size, so the game feels the same on a
   phone in landscape and on a big desktop window. 스테이지마다 배율이 붙는다. */
function baseSpeed(){ return sH * 2.55 * (world.speedMul || 1); }
function liveSpeed(t){ return sH * (2.55 + Math.min(t, 60) * 0.008) * (world.speedMul || 1); }
function goalDistOf(m){ return m * sH / M_PER_SH; }

/* the phone gives us physical safe-area insets; when the stage is turned 90°
   clockwise, physical top becomes screen right, right becomes bottom, and so on */
function readSafeAreas(){
  var d = document.getElementById('safeProbe');
  if (!d) return;
  var cs = getComputedStyle(d);
  var t = parseFloat(cs.paddingTop) || 0;
  var r = parseFloat(cs.paddingRight) || 0;
  var b = parseFloat(cs.paddingBottom) || 0;
  var l = parseFloat(cs.paddingLeft) || 0;
  if (ROT) { SAFE.t = l; SAFE.r = t; SAFE.b = r; SAFE.l = b; }
  else { SAFE.t = t; SAFE.r = r; SAFE.b = b; SAFE.l = l; }
  stageEl.style.setProperty('--st', SAFE.t + 'px');
  stageEl.style.setProperty('--sr', SAFE.r + 'px');
  stageEl.style.setProperty('--sb', SAFE.b + 'px');
  stageEl.style.setProperty('--sl', SAFE.l + 'px');
}

function spawnX(){ return Math.round(clamp(W * (LAND ? 0.215 : 0.245), sH * 0.95, W * 0.42)); }

function layout(){
  var vv = window.visualViewport;
  var vw = Math.max(240, Math.round(vv && vv.width ? vv.width : window.innerWidth));
  var vh = Math.max(240, Math.round(vv && vv.height ? vv.height : window.innerHeight));
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);

  /* upright viewport (rotation lock on): turn the whole stage 90° and play the
     game in the landscape frame it was designed for */
  ROT = vh > vw ? 90 : 0;
  if (ROT) {
    stageEl.classList.add('rot');
    stageEl.style.width = vh + 'px';
    stageEl.style.height = vw + 'px';
    W = vh; H = vw;
  } else {
    stageEl.classList.remove('rot');
    stageEl.style.width = '';
    stageEl.style.height = '';
    W = vw; H = vh;
  }

  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  stageEl.style.setProperty('--gw', W + 'px');
  stageEl.style.setProperty('--gh', H + 'px');
  readSafeAreas();

  /* landscape is the reference framing: Bada's body is a little over a fifth
     of the screen height, the horizon sits a touch above the middle and the
     running lane below it. Portrait (only reachable if the 90° turn cannot be
     used) keeps its own proportion so it never breaks, just smaller. */
  LAND = W > H * 1.08;
  document.body.classList.toggle('wide', LAND);
  document.body.classList.toggle('short', H <= 420);

  if (LAND) {
    /* 0.215 → 0.183: 바다를 지금보다 15% 더 작게 */
    sH = clamp(H * 0.183, 40, 230);
    groundY = Math.round(H * 0.845);
    horizonY = Math.round(H * 0.595);
  } else {
    /* portrait fallback: the side-view dog is wide, so size it from the width */
    sH = clamp(Math.min(H * 0.183, W * 0.255), 48, 178);
    groundY = Math.round(H * 0.78);
    horizonY = Math.round(H * 0.46);
  }
  world.speed = baseSpeed();
  if (world.goalM && isFinite(world.goalM)) world.goalDist = goalDistOf(world.goalM);

  var p = world.player;
  p.x = spawnX();
  if (p.onGround) p.y = groundY;
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', function(){ setTimeout(layout, 120); setTimeout(layout, 420); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', function(){ setTimeout(layout, 60); });

/* ---------- sprites ---------- */
var sprites = {};
function loadSprites(cb){
  var jobs = [];
  Object.keys(SPR).forEach(function(k){
    var v = SPR[k];
    if (Object.prototype.toString.call(v) === '[object Array]') {
      sprites[k] = [];
      v.forEach(function(src, i){ jobs.push([k, i, src]); });
    } else {
      jobs.push([k, null, v]);
    }
  });
  var n = 0;
  var done = function(){ if (++n === jobs.length) cb(); };
  jobs.forEach(function(j){
    var im = new Image();
    im.onload = done;
    im.onerror = done;
    if (j[1] === null) sprites[j[0]] = im; else sprites[j[0]][j[1]] = im;
    im.src = j[2];
  });
  if (!jobs.length) cb();
}

/* ---------- sound ---------- */
var Sound = (function(){
  var ac = null, master = null, noise = null, muted = false;
  try { muted = localStorage.getItem('badaRunnerMuted') === '1'; } catch(e){}

  function ensure(){
    if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.7;
      master.connect(ac.destination);
      var len = Math.floor(ac.sampleRate * 0.4);
      noise = ac.createBuffer(1, len, ac.sampleRate);
      var d = noise.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch(e){ ac = null; }
    return ac;
  }

  function tone(o){
    var c = ensure(); if (!c || muted) return;
    var t0 = c.currentTime + (o.delay || 0), dur = o.dur || 0.15;
    var g = c.createGain(), osc = c.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, t0);
    if (o.f1 && osc.frequency.exponentialRampToValueAtTime){
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t0 + dur);
    }
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.18, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }

  function hiss(o){
    var c = ensure(); if (!c || muted) return;
    var t0 = c.currentTime + (o.delay || 0), dur = o.dur || 0.25;
    var src = c.createBufferSource(); src.buffer = noise;
    var f = c.createBiquadFilter();
    f.type = o.filter || 'bandpass';
    f.frequency.setValueAtTime(o.f0 || 900, t0);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.f1), t0 + dur);
    f.Q.value = o.q || 1.1;
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.16, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  }

  return {
    unlock: function(){ ensure(); },
    isMuted: function(){ return muted; },
    toggle: function(){
      muted = !muted;
      try { localStorage.setItem('badaRunnerMuted', muted ? '1' : '0'); } catch(e){}
      if (!muted) ensure();
      return muted;
    },
    jump: function(){
      tone({ type: 'square', f0: 380, f1: 720, dur: 0.12, gain: 0.085 });
      hiss({ f0: 1500, f1: 2800, dur: 0.07, gain: 0.045, filter: 'highpass' });
    },
    dbljump: function(){
      tone({ type: 'triangle', f0: 620, f1: 1180, dur: 0.16, gain: 0.12 });
      tone({ type: 'sine', f0: 1240, f1: 1720, dur: 0.14, gain: 0.06, delay: 0.04 });
    },
    pickup: function(step){
      var base = 880 * Math.pow(1.0595, Math.min(step || 0, 10));
      tone({ type: 'sine', f0: base, dur: 0.075, gain: 0.13 });
      tone({ type: 'sine', f0: base * 1.5, dur: 0.10, gain: 0.09, delay: 0.055 });
    },
    golden: function(){
      tone({ type: 'triangle', f0: 784, dur: 0.11, gain: 0.13 });
      tone({ type: 'triangle', f0: 1046, dur: 0.12, gain: 0.12, delay: 0.07 });
      tone({ type: 'sine', f0: 1568, dur: 0.22, gain: 0.10, delay: 0.14 });
    },
    fever: function(){
      tone({ type: 'sawtooth', f0: 420, f1: 92, dur: 0.55, gain: 0.14 });
      tone({ type: 'square', f0: 210, f1: 60, dur: 0.6, gain: 0.07, delay: 0.04 });
      hiss({ f0: 2600, f1: 400, dur: 0.5, gain: 0.09 });
    },
    smash: function(){
      hiss({ f0: 1800, f1: 320, dur: 0.18, gain: 0.12 });
      tone({ type: 'square', f0: 260, f1: 120, dur: 0.12, gain: 0.06 });
    },
    hit: function(){
      hiss({ f0: 700, f1: 120, dur: 0.32, gain: 0.19, filter: 'lowpass', q: 0.7 });
      tone({ type: 'sine', f0: 180, f1: 62, dur: 0.30, gain: 0.18 });
    },
    over: function(){
      tone({ type: 'triangle', f0: 523, dur: 0.16, gain: 0.12 });
      tone({ type: 'triangle', f0: 392, dur: 0.18, gain: 0.12, delay: 0.15 });
      tone({ type: 'triangle', f0: 262, dur: 0.36, gain: 0.14, delay: 0.32 });
    },
    stageClear: function(){
      tone({ type: 'triangle', f0: 523, dur: 0.13, gain: 0.13 });
      tone({ type: 'triangle', f0: 659, dur: 0.13, gain: 0.13, delay: 0.11 });
      tone({ type: 'triangle', f0: 784, dur: 0.15, gain: 0.13, delay: 0.22 });
      tone({ type: 'sine', f0: 1046, dur: 0.42, gain: 0.12, delay: 0.35 });
      tone({ type: 'sine', f0: 1568, dur: 0.45, gain: 0.07, delay: 0.40 });
      hiss({ f0: 3200, f1: 1600, dur: 0.30, gain: 0.05, filter: 'highpass' });
    }
  };
})();

/* ---------- world ---------- */
var world = {
  mode: 'ready',
  time: 0,
  score: 0,
  best: 0,
  stage: 1,
  endless: false,
  theme: 'park',
  speedMul: 1,
  goalM: 1000,
  goalDist: 0,
  progress: 0,
  stageBase: 0,
  maxCombo: 0,
  clears: [0, 0, 0, 0],
  unlocked: 1,
  endlessUnlocked: false,
  pickStage: 1,
  lives: 3,
  combo: 0,
  comboT: 0,
  fever: 0,
  feverMax: 6,
  invuln: 0,
  shake: 0,
  dist: 0,
  speed: 340,
  devilT: 14,
  squash: 0,
  flash: 0,
  god: false,
  hint: 0,
  magnet: 0,
  slideAmt: 0,
  beatDist: 0,
  prints: [],
  hitLog: [],
  objects: [],
  parts: [],
  pops: [],
  player: { x: 90, y: 0, vy: 0, onGround: true, jumps: 0, dead: false, slide: false }
};
try {
  world.best = parseInt(localStorage.getItem('badaRunnerBest') || '0', 10) || 0;
  world.unlocked = clamp(parseInt(localStorage.getItem('badaRunnerUnlocked') || '1', 10) || 1, 1, 4);
  world.endlessUnlocked = localStorage.getItem('badaRunnerEndless') === '1';
  var pick0 = parseInt(localStorage.getItem('badaRunnerPick') || '0', 10);
  world.pickStage = clamp(pick0 || world.unlocked, 1, 4);
} catch(e){}

/* 한 판의 상태만 깨끗하게 (스테이지·테마·목표는 applyStage가 정한다) */
function resetStage(){
  world.time = 0;
  world.lives = 3;
  world.combo = 0;
  world.comboT = 0;
  world.fever = 0;
  world.invuln = 0;
  world.shake = 0;
  world.dist = 0;
  world.speed = baseSpeed();
  world.devilT = 12;
  world.squash = 0;
  world.flash = 0;
  world.hint = 4.5;
  world.magnet = 0;
  world.slideAmt = 0;
  world.beatDist = sH * 2.6;
  world.progress = 0;
  world.maxCombo = 0;
  world.prints.length = 0;
  world.hitLog.length = 0;
  world.objects.length = 0;
  world.parts.length = 0;
  world.pops.length = 0;
  var p = world.player;
  p.y = groundY; p.vy = 0; p.onGround = true; p.jumps = 0; p.dead = false; p.slide = false;
  p.x = spawnX();
}

function applyStage(idx, endless){
  var st = STAGES[clamp(idx, 1, 4) - 1];
  world.stage = st.n;
  world.endless = !!endless;
  world.theme = st.theme;
  world.speedMul = st.speed;
  world.goalM = endless ? Infinity : st.goal;
  world.goalDist = endless ? Infinity : goalDistOf(st.goal);
}

function resetGame(){
  world.score = 0;
  world.stageBase = 0;
  applyStage(1, false);
  resetStage();
}

/* ---------- input ----------
   쿠키런식 두 손가락 체계: 화면 오른쪽 = 점프 / 2단 점프, 화면 왼쪽 = 꾹 누르면
   슬라이드. 세로 잠금으로 스테이지를 90° 돌려 놓아도 포인터의 화면 좌표를
   게임 좌표로 되돌려 판정하므로 좌/우가 절대 뒤집히지 않는다. */
var slideHeld = false, slideHeldKey = false;
var activePointers = {};

function toGameX(clientX, clientY){
  var r = canvas.getBoundingClientRect();
  var dx = clientX - (r.left + r.width / 2);
  var dy = clientY - (r.top + r.height / 2);
  return ROT ? dy : dx;      /* 90° 시계 회전: 게임의 +x 는 화면의 +y */
}

function jump(){
  var p = world.player;
  if (p.dead || world.mode !== 'playing') return;
  if (p.jumps < 2) {
    if (p.jumps === 0) {
      p.vy = -5.0 * sH;
      Sound.jump();
      dust(p.x, p.y, 6, 0.55);
      world.squash = -0.5;
      p.slide = false;
    } else {
      p.vy = -4.4 * sH;
      Sound.dbljump();
      world.squash = -0.65;
      burst(p.x, p.y - sH * 0.5, 12, ['#fff3c4', '#ffd166', '#ffb703']);
    }
    p.jumps++;
    p.onGround = false;
  }
}

function refreshSlideHold(){
  var any = slideHeldKey;
  for (var k in activePointers) if (activePointers[k] === 'slide') any = true;
  slideHeld = any;
}

function onDown(e){
  if (e.target && e.target.closest && e.target.closest('button')) return;
  if (e.cancelable) e.preventDefault();
  Sound.unlock();
  if (world.mode !== 'playing') {
    if (world.mode === 'clear') return;
    if (world.mode === 'over' && world.time <= 0.6) return;
    startGame();
    return;
  }
  var left = toGameX(e.clientX, e.clientY) < 0;
  if (e.pointerId !== undefined) activePointers[e.pointerId] = left ? 'slide' : 'jump';
  if (left) { slideHeld = true; }
  else jump();
}

function onUp(e){
  if (e.pointerId !== undefined) delete activePointers[e.pointerId];
  refreshSlideHold();
}

window.addEventListener('pointerdown', onDown, { passive: false });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
window.addEventListener('blur', function(){
  activePointers = {}; slideHeld = false; slideHeldKey = false;
});
if (!window.PointerEvent) {
  window.addEventListener('touchstart', function(e){
    if (!e.touches || !e.touches.length) return;
    var t = e.changedTouches[0];
    onDown({ pointerId: t.identifier, clientX: t.clientX, clientY: t.clientY,
             target: e.target, cancelable: true, preventDefault: function(){} });
  }, { passive: false });
  window.addEventListener('touchend', function(e){
    var t = e.changedTouches[0];
    onUp({ pointerId: t.identifier });
  });
  window.addEventListener('touchcancel', function(e){
    var t = e.changedTouches[0];
    onUp({ pointerId: t.identifier });
  });
  window.addEventListener('mousedown', onDown, { passive: false });
  window.addEventListener('mouseup', onUp);
}

window.addEventListener('keydown', function(e){
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (!e.repeat) {
      if (world.mode === 'playing') jump();
      else if (world.mode === 'ready' || (world.mode === 'over' && world.time > 0.6)) { Sound.unlock(); startGame(); }
    }
  }
  if (e.code === 'ArrowDown' || e.code === 'KeyS') {
    e.preventDefault();
    slideHeldKey = true; refreshSlideHold();
  }
});
window.addEventListener('keyup', function(e){
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { slideHeldKey = false; refreshSlideHold(); }
});
document.addEventListener('contextmenu', function(e){
  if (e.target && e.target.id === 'game') e.preventDefault();
});

/* ---------- particles ---------- */
function addPart(o){ if (world.parts.length < 340) world.parts.push(o); }

function burst(x, y, n, colors){
  for (var i = 0; i < n; i++){
    var a = rand(0, TAU), sp = rand(0.6, 2.4) * sH;
    addPart({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - sH * 0.6,
      life: rand(0.35, 0.72), max: 0.75, r: rand(2, 4.6) * (sH / 150),
      c: pick(colors), grav: 1.7, kind: 'dot', rot: rand(0, TAU), vr: rand(-9, 9)
    });
  }
}

function dust(x, y, n, power){
  for (var i = 0; i < n; i++){
    addPart({
      x: x + rand(-sH * 0.15, sH * 0.12), y: y - rand(0, sH * 0.04),
      vx: rand(-1.3, -0.1) * sH * power, vy: rand(-0.75, -0.05) * sH * power,
      life: rand(0.3, 0.55), max: 0.55, r: rand(2.4, 5) * (sH / 150),
      c: 'rgba(236,220,188,0.75)', grav: 0.7, kind: 'smoke', rot: 0, vr: 0
    });
  }
}

function flame(x, y){
  addPart({
    x: x + rand(-sH * 0.22, sH * 0.12), y: y - rand(0, sH * 0.85),
    vx: rand(-1.4, -0.6) * sH, vy: rand(-0.9, -0.2) * sH,
    life: rand(0.2, 0.42), max: 0.42, r: rand(2.5, 5.5) * (sH / 150),
    c: pick(['rgba(255,150,60,0.75)', 'rgba(255,196,90,0.7)', 'rgba(232,70,40,0.7)']),
    grav: -0.25, kind: 'smoke', rot: 0, vr: 0
  });
}

function pop(x, y, text, color){
  world.pops.push({ x: x, y: y, text: text, c: color || '#3a3324', life: 0.85, max: 0.85, vy: -1.05 * sH });
}

/* ---------- spawning: 쿠키런식 "박자" ----------
   일정 거리마다 한 마디(beat)를 놓는다. 한 마디 안에서 간식은 점프 포물선,
   2단 점프 높은 아치, 슬라이드 일직선 중 하나로 규칙적으로 이어져서 몸이
   저절로 점프/슬라이드를 하게 만든다. */
function addItem(kind, x, y){
  var s = kind === 'gold' ? 0.30 : kind === 'devil' ? 0.38 : kind === 'magnet' ? 0.34 : 0.29;
  world.objects.push({
    type: 'item', kind: kind, x: x, y: y,
    w: sH * s,
    h: sH * (kind === 'gold' ? 0.30 : kind === 'devil' ? 0.38 : kind === 'magnet' ? 0.34 : 0.24),
    seed: Math.random() * 100, dead: false
  });
}

function spawnObs(kind, x, air){
  var w, h, cy = 0, hw = 0.42, vx = 0;
  switch (kind){
    case 'puddle': w = sH * (0.58 + rand(0, 0.2)); h = sH * 0.17; hw = 0.36; break;
    case 'leaf': w = sH * 0.64; h = sH * 0.30; break;
    case 'hydrant': w = sH * 0.38; h = sH * 0.50; break;
    case 'bush': w = sH * 0.74; h = sH * 0.52; break;
    /* 키가 커서 2단 점프로만 넘는 높은 장애물 (테마별 모양) */
    case 'wall': w = sH * 0.62; h = sH * 1.12; hw = 0.40; break;
    case 'cone': w = sH * 0.34; h = sH * 0.48; hw = 0.38; break;
    case 'rock': w = sH * 0.80; h = sH * 0.44; hw = 0.44; break;
    case 'crab': w = sH * 0.72; h = sH * 0.26; hw = 0.40; break;
    /* 스스로 오른쪽에서 왼쪽으로 굴러오는 움직이는 장애물 */
    case 'ball': w = sH * 0.46; h = sH * 0.46; hw = 0.40; vx = sH * (0.75 + Math.random() * 0.35); break;
    case 'gull': w = sH * 0.66; h = sH * 0.30; cy = groundY - sH * rand(0.56, 0.63); air = true; break;
    case 'crow': w = sH * 0.64; h = sH * 0.34; cy = groundY - sH * rand(0.58, 0.65); air = true; break;
    case 'drone': w = sH * 0.56; h = sH * 0.30; cy = groundY - sH * rand(0.58, 0.65); air = true; break;
    default: w = sH * 0.56; h = sH * 0.30; cy = groundY - sH * rand(0.58, 0.65); air = true; break;
  }
  var o = { type: 'obs', kind: kind, x: x, w: w, h: h, y: cy, air: !!air, hw: hw,
    vx: vx, rot: 0, seed: Math.random() * 100, dead: false };
  world.objects.push(o);
  return o;
}

/* 점프 포물선을 따라 늘어선 간식 */
function arcItems(cx, span, hLow, hHigh, n){
  for (var i = 0; i < n; i++){
    var u = n === 1 ? 0.5 : i / (n - 1);
    var hgt = hLow + Math.sin(u * Math.PI) * (hHigh - hLow);
    addItem(hHigh > 2 && i === Math.floor(n / 2) ? 'gold' : 'bone',
      cx - span / 2 + span * u, groundY - sH * hgt);
  }
}

/* 스테이지별 지상/공중 장애물 풀 */
function groundKinds(){
  if (world.stage === 1){
    var k = ['puddle', 'leaf'];
    if (world.time > 6) k.push('hydrant');
    if (world.time > 13) k.push('bush');
    return k;
  }
  if (world.stage === 2) return ['rock', 'crab', 'puddle', 'rock'];
  if (world.stage === 3) return ['cone', 'hydrant', 'bush', 'cone'];
  return ['crab', 'cone', 'leaf', 'rock'];
}
function airKind(){
  if (world.stage === 2) return Math.random() < 0.55 ? 'gull' : 'drone';
  if (world.stage === 3) return Math.random() < 0.60 ? 'drone' : 'crow';
  if (world.stage === 4) return Math.random() < 0.50 ? 'gull' : 'crow';
  return Math.random() < 0.55 ? 'crow' : 'drone';
}

function spawnGroundBeat(x, kinds, opts){
  var ch = kinds || ['puddle', 'leaf'];
  var o = spawnObs(pick(ch), x, false);
  /* 한 번의 점프로 넘으며 먹는 포물선 아치 */
  arcItems(x, o.w + sH * 1.9, 0.52, 1.18, 6);
  if (Math.random() < 0.2) addItem('gold', x, groundY - sH * 1.55);
  var extra = 0;
  var pEx = opts && opts.extra ? opts.extra : 0;
  if (Math.random() < pEx){
    var x2 = x + sH * (2.9 + Math.random() * 0.5);
    spawnObs(pick(ch), x2, false);
    arcItems(x2, sH * 2.0, 0.50, 1.05, 4);
    extra = sH * 0.9;
  }
  /* 가끔 2단 점프로만 닿는 높은 아치 */
  if (Math.random() < 0.22) arcItems(x + sH * 2.3, sH * 2.4, 1.35, 2.35, 5);
  return extra;
}

/* 짧은 간격으로 2개 연속 — 리듬 점프 */
function spawnDoubleGround(x, tight){
  var gap = sH * (tight ? 1.55 : 2.35);
  var ch = groundKinds();
  spawnObs(pick(ch), x, false);
  spawnObs(pick(ch), x + gap, false);
  arcItems(x + gap / 2, gap + sH * 1.7, 0.52, 1.05, 5);
  return Math.max(0, gap - sH * 2.0);
}

/* 높은 장애물 + 2단 점프 아치 */
function spawnWallBeat(x){
  spawnObs('wall', x, false);
  arcItems(x, sH * 2.6, 1.25, 2.25, 6);
  addItem('gold', x + sH * 0.35, groundY - sH * 2.45);
  return sH * 0.7;
}

/* 굴러오는 공 */
function spawnBallBeat(x){
  spawnObs('ball', x + sH * 0.8, false);
  arcItems(x, sH * 2.2, 0.55, 1.15, 4);
  return sH * 1.3;
}

function spawnAirBeat(x, n, kind){
  n = n || 1;
  var k = kind || airKind();
  var gap = sH * 2.15;
  for (var i = 0; i < n; i++) spawnObs(k, x + i * gap, true);
  /* 날아오는 장애물 아래로 낮게 깔린 슬라이드 줄 */
  var cnt = Math.round((n * gap + sH * 0.6) / (sH * 0.42));
  for (var j = 0; j < cnt; j++){
    addItem(j % 4 === 3 ? 'gold' : 'bone',
      x - sH * 0.45 + j * sH * 0.42, groundY - sH * 0.40);
  }
  return n > 1 ? sH * 0.8 : 0;
}

/* 2~3연속 공중 편대 — 슬라이드를 길게 꾹 유지해야 통과 */
function spawnAirFleet(x, n){
  n = n || 2;
  var gap = sH * 1.02;
  for (var i = 0; i < n; i++) spawnObs(airKind(), x + i * gap, true);
  var cnt = Math.round((n * gap + sH * 0.8) / (sH * 0.40));
  for (var j = 0; j < cnt; j++){
    addItem(j % 4 === 3 ? 'gold' : 'bone',
      x - sH * 0.40 + j * sH * 0.40, groundY - sH * 0.38);
  }
  return n * gap * 0.5;
}

/* 점프 → 착지하자마자 슬라이드 콤보 */
function spawnComboBeat(x){
  spawnObs(pick(groundKinds()), x, false);
  arcItems(x, sH * 1.9, 0.50, 1.10, 4);
  spawnObs(airKind(), x + sH * 2.35, true);
  for (var j = 0; j < 4; j++) addItem('bone', x + sH * (1.55 + j * 0.38), groundY - sH * 0.40);
  return sH * 0.9;
}

function spawnRushBeat(x){
  var n = irand(6, 9);
  var shape = Math.random();
  for (var i = 0; i < n; i++){
    var u = i / (n - 1);
    var hgt = shape < 0.34 ? (0.58 + u * 0.85)
      : shape < 0.68 ? (1.45 - u * 0.85)
      : (0.72 + Math.sin(u * Math.PI * 2) * 0.28);
    addItem(i % 3 === 2 ? 'gold' : 'bone', x + i * sH * 0.46, groundY - sH * hgt);
  }
  if (Math.random() < 0.18) addItem('magnet', x + n * sH * 0.5 + sH * 0.4, groundY - sH * 1.0);
  return 0;
}

function nextBeat(){
  var base = [6.2, 5.7, 5.1, 4.6][clamp(world.stage, 1, 4) - 1] || 4.8;
  var prog = world.endless ? clamp(world.time / 110, 0, 1) : (world.progress || 0);
  return sH * lerp(base, base * 0.74, prog);
}

function spawnBeat(x){
  var st = world.endless ? 4 : world.stage;
  var r = Math.random(), t = world.time;
  if (st === 1){
    if (t > 15 && r < 0.14) return spawnWallBeat(x);
    if (t > 22 && r < 0.30) return spawnDoubleGround(x, false);
    if (r < 0.74) return spawnGroundBeat(x, groundKinds(), { extra: t > 12 ? 0.30 : 0 });
    if (r < 0.92) return spawnAirBeat(x, Math.random() < 0.35 ? 2 : 1);
    return spawnRushBeat(x);
  }
  if (st === 2){
    if (r < 0.26) return spawnGroundBeat(x, groundKinds(), { extra: 0.35 });
    if (r < 0.40) return spawnBallBeat(x);
    if (r < 0.54) return spawnDoubleGround(x, false);
    if (r < 0.66) return spawnWallBeat(x);
    if (r < 0.84) return Math.random() < 0.4 ? spawnAirFleet(x, 2) : spawnAirBeat(x, Math.random() < 0.5 ? 2 : 1);
    return spawnRushBeat(x);
  }
  if (st === 3){
    if (r < 0.22) return spawnGroundBeat(x, groundKinds(), { extra: 0.30 });
    if (r < 0.38) return spawnDoubleGround(x, true);
    if (r < 0.52) return spawnWallBeat(x);
    if (r < 0.64) return spawnBallBeat(x);
    if (r < 0.80) return spawnAirFleet(x, Math.random() < 0.45 ? 3 : 2);
    if (r < 0.92) return spawnComboBeat(x);
    return spawnRushBeat(x);
  }
  if (r < 0.20) return spawnGroundBeat(x, groundKinds(), { extra: 0.35 });
  if (r < 0.34) return spawnDoubleGround(x, true);
  if (r < 0.46) return spawnWallBeat(x);
  if (r < 0.58) return spawnBallBeat(x);
  if (r < 0.72) return spawnAirFleet(x, irand(2, 3));
  if (r < 0.86) return spawnComboBeat(x);
  if (r < 0.94) return spawnRushBeat(x);
  return spawnAirBeat(x, 2);
}

/* ---------- flow ---------- */
var CLEAR_CAPS = ['오늘도 완주 성공! 🐾', '노을빛 바다, 같이 걸었어요 🌅',
  '별빛 아래에서도 신나게! ✨', '구름 위를 달렸어요 ☁️'];

function startStage(idx, endless, keepScore){
  applyStage(idx, endless);
  resetStage();
  world.score = keepScore || 0;
  world.stageBase = world.score;
  world.mode = 'playing';
  hide(startScreen); hide(overScreen); hide(clearScreen);
  Sound.unlock();
}

function startGame(){
  var pick = world.pickStage || 1;
  if (pick >= 5) startStage(4, true, 0);
  else startStage(pick, false, 0);
}

function showTitle(){
  world.mode = 'ready';
  hide(overScreen); hide(clearScreen);
  document.getElementById('startBest').textContent = fmt(world.best);
  refreshStagePick();
  updateStartBtn();
  show(startScreen);
}

/* 클리어 사진: 스테이지 1~4는 서로 다른 사진, 다시 클리어하면 다음 사진으로 순환 */
function photoFor(stage){
  if (!PHOTOS || !PHOTOS.length) return null;
  var rep = Math.max(0, (world.clears[stage - 1] || 0) - 1);
  var idx = ((stage - 1) + rep * 4) % PHOTOS.length;
  world.lastPhotoIdx = idx;
  return PHOTOS[idx];
}

function saveProgress(){
  try {
    localStorage.setItem('badaRunnerBest', String(world.best));
    localStorage.setItem('badaRunnerUnlocked', String(world.unlocked));
    localStorage.setItem('badaRunnerEndless', world.endlessUnlocked ? '1' : '0');
  } catch(e){}
}

function stageClear(){
  var p = world.player;
  var st = STAGES[world.stage - 1];
  world.mode = 'clear';
  world.time = 0;
  p.slide = false;
  world.clears[world.stage - 1] = (world.clears[world.stage - 1] || 0) + 1;
  var stageScore = Math.round(world.score - world.stageBase);
  var isNew = world.score > world.best;
  if (isNew) world.best = Math.round(world.score);
  if (world.stage < 4) world.unlocked = Math.max(world.unlocked, world.stage + 1);
  else world.endlessUnlocked = true;
  saveProgress();

  var ph = photoFor(world.stage);
  var img = document.getElementById('clearPhoto');
  if (ph && ph.src){
    img.src = ph.src;
    img.alt = '바다 사진';
  }
  document.getElementById('clearEyebrow').textContent =
    (world.stage === 4 ? 'ALL STAGES CLEAR! · STAGE 4 CLEAR!' : 'STAGE ' + world.stage + ' CLEAR!');
  document.getElementById('clearTitle').textContent =
    world.stage === 4 ? '🏆 네 스테이지 모두 완주!' : st.name;
  document.getElementById('clearSub').textContent =
    world.stage === 4 ? '바다가 마지막 사진을 선물했어요 — 보너스 무한 런에 도전해 보세요'
      : '한 판 완주! 바다가 사진을 한 장 남겼어요';
  document.getElementById('clearCap').textContent =
    (ph && ph.cap) ? ph.cap : (CLEAR_CAPS[world.stage - 1] || '오늘도 완주 성공! 🐾');
  document.getElementById('clearScore').textContent = fmt(stageScore);
  document.getElementById('clearCombo').textContent = String(Math.max(world.maxCombo, world.combo));
  document.getElementById('clearTotal').textContent = fmt(world.score);
  var nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = world.stage < 4 ? '다음 스테이지 도전 →' : '보너스 무한 런 시작 →';
  document.getElementById('retryBtn').textContent =
    world.stage < 4 ? '이 스테이지 다시 달리기' : '스테이지 골라서 다시 달리기';
  world.flash = 0.9;
  world.shake = 12;
  Sound.stageClear();
  burst(p.x, p.y - sH * 0.7, 26, ['#ffd166', '#ff8a5c', '#7ee0a1', '#8fd3ff', '#fff3c4']);
  var card = document.getElementById('clearCard');
  card.classList.remove('pop');
  void card.offsetWidth;
  card.classList.add('pop');
  show(clearScreen);
}

function gameOver(){
  var p = world.player;
  p.dead = true;
  world.mode = 'over';
  world.time = 0;
  Sound.over();
  var isNew = world.score > world.best;
  if (isNew){
    world.best = Math.round(world.score);
    saveProgress();
  }
  document.getElementById('overStage').textContent =
    (world.endless ? 'BONUS 무한 런' : 'STAGE ' + world.stage) + ' · 산책 끝!';
  document.getElementById('overScore').textContent = fmt(world.score);
  document.getElementById('overBest').textContent = fmt(world.best);
  document.getElementById('newBestTag').classList.toggle('hidden', !isNew);
  document.getElementById('overScore').style.color = isNew ? '#c2512f' : '#2f2a1c';
  show(overScreen);
  burst(p.x, p.y - sH * 0.5, 16, ['#ffd166', '#ff8a5c', '#fff1c9']);
  world.shake = 15;
}

function updateStartBtn(){
  var b = document.getElementById('startBtn');
  if (!b) return;
  if (world.pickStage >= 5) b.textContent = '보너스 무한 런 시작';
  else b.textContent = 'Stage ' + world.pickStage + ' 시작';
}

function refreshStagePick(){
  var wrap = document.getElementById('stagePick');
  if (!wrap) return;
  var html = '';
  for (var i = 0; i < STAGES.length; i++){
    var n = i + 1, locked = n > world.unlocked;
    html += '<button class="chip' + (n === world.pickStage ? ' on' : '') + (locked ? ' lock' : '') +
      '" data-stage="' + n + '"' + (locked ? ' disabled' : '') + '>' +
      n + ' · ' + STAGES[i].short + (locked ? ' 🔒' : '') + '</button>';
  }
  if (world.endlessUnlocked){
    html += '<button class="chip' + (world.pickStage === 5 ? ' on' : '') + '" data-stage="5">∞ 무한 런</button>';
  }
  wrap.innerHTML = html;
}

var startScreen, overScreen, clearScreen;
function show(el){ el.classList.remove('hidden'); }
function hide(el){ el.classList.add('hidden'); }

/* ---------- update ---------- */
function update(dt){
  var p = world.player;

  var playing = world.mode === 'playing';
  var spdMul = (playing && world.fever > 0) ? FEVER_SPEED : 1;
  world.dist += (playing ? world.speed : sH * 0.92) * spdMul * dt;

  if (world.mode === 'playing') {
    world.time += dt;
    world.speed = liveSpeed(world.time);
    world.score += dt * world.speed * 0.055 * (world.fever > 0 ? 2 : 1);
    /* 스테이지 진행률과 클리어 판정 (보너스 무한 런은 목표 없음) */
    if (!world.endless) {
      world.progress = clamp(world.dist / world.goalDist, 0, 1);
      if (world.dist >= world.goalDist) { stageClear(); return; }
    } else {
      world.progress = 0;
    }

    if (world.fever > 0) {
      world.fever -= dt;
      if (Math.random() < 0.8) flame(p.x - sH * 0.1, p.y);
      if (world.fever <= 0) {
        world.fever = 0;
        burst(p.x, p.y - sH * 0.5, 14, ['#ffb703', '#ff6b35', '#fff3c4']);
        Sound.pickup(3);
      }
    }
    if (world.invuln > 0) world.invuln -= dt;
    if (world.comboT > 0) { world.comboT -= dt; if (world.comboT <= 0) world.combo = 0; }
    if (world.hint > 0) world.hint -= dt;

    // physics (슬라이드를 꾹 누른 채 공중이면 급강하)
    var held = slideHeld || slideHeldKey;
    p.slide = p.onGround && held && !p.dead;
    var g = 11.6 * sH;
    if (held && !p.onGround && p.vy > -sH * 0.45) g *= 2.2;
    if (!p.onGround) {
      p.vy += g * dt;
      p.y += p.vy * dt;
      if (p.y >= groundY) {
        p.y = groundY; p.vy = 0; p.onGround = true; p.jumps = 0;
        world.squash = 0.5;
        dust(p.x, groundY, 5, 0.45);
      }
    }
    world.squash *= Math.pow(0.0016, dt);

    // running dust / 슬라이드 먼지·반짝이는 발밑에서 옆으로 흐른다
    if (p.onGround && !p.slide && Math.random() < dt * 14) dust(p.x - sH * 0.2, p.y, 1, 0.32);
    if (p.slide && Math.random() < dt * 30) dust(p.x - sH * 0.36, groundY - sH * 0.02, 1, 0.62);
    if (p.slide && Math.random() < dt * 16){
      addPart({ x: p.x - sH * 0.12, y: p.y - sH * 0.03,
        vx: rand(-1.7, -0.5) * sH, vy: rand(-0.75, -0.12) * sH,
        life: rand(0.20, 0.38), max: 0.38, r: rand(1.5, 3.0) * (sH / 150),
        c: 'rgba(255,240,176,0.92)', grav: 0.85, kind: 'dot', rot: 0, vr: 0 });
    }

    // paw prints on the path
    if (Math.random() < dt * 4) {
      world.prints.push({ x: W + sH * 0.2, y: groundY + sH * rand(0.1, 0.3), s: sH * rand(0.05, 0.07), side: Math.random() < 0.5 ? -1 : 1, a: 0.16 });
      if (world.prints.length > 26) world.prints.shift();
    }
    for (var pi = world.prints.length - 1; pi >= 0; pi--) {
      var pr = world.prints[pi];
      pr.x -= world.speed * dt;
      if (pr.x < -sH * 0.3) world.prints.splice(pi, 1);
    }

    // spawning: 거리 기반 박자 — 어떤 속도에서도 마디 간격이 일정하다
    if (world.dist >= world.beatDist) {
      world.beatDist = world.dist + nextBeat() + spawnBeat(W + sH * 0.9);
    }

    world.devilT -= dt;
    if (world.devilT <= 0 && world.fever <= 0) {
      addItem('devil', W + sH * 0.9, groundY - sH * rand(0.95, 1.35));
      world.devilT = rand(16, 23);
    }

    // objects
    var move = world.speed * dt * (world.fever > 0 ? FEVER_SPEED : 1);
    var i, o;
    for (i = 0; i < world.objects.length; i++) {
      o = world.objects[i];
      var ox = move + (o.vx || 0) * dt * (world.fever > 0 ? FEVER_SPEED : 1);
      o.x -= ox;
      if (o.kind === 'ball') o.rot = (o.rot || 0) + ox / Math.max(1, o.w * 0.5);
      if (o.x < -sH * 2.2) o.dead = true;
    }

    // 자석: 가까운 간식이 바다 쪽으로 빨려온다
    if (world.magnet > 0) {
      world.magnet -= dt;
      var mr = sH * 3.6;
      for (i = 0; i < world.objects.length; i++) {
        o = world.objects[i];
        if (o.type !== 'item' || o.dead || o.kind === 'devil') continue;
        var mdx = (p.x + sH * 0.05) - o.x, mdy = (p.y - sH * 0.42) - o.y;
        var md = Math.sqrt(mdx * mdx + mdy * mdy);
        if (md < mr && md > 0.5) {
          var pull = (1 - md / mr) * sH * 10 * dt;
          o.x += mdx / md * pull;
          o.y += mdy / md * pull;
        }
      }
      if (world.magnet <= 0) { world.magnet = 0; burst(p.x, p.y - sH * 0.4, 8, ['#bfe6ff', '#8fd3ff']); }
    }

    // collisions (side-view dog: body sits to the right of the anchor point)
    var pb = p.slide
      ? { l: p.x - sH * 0.18, r: p.x + sH * 0.44, t: p.y - sH * 0.30, b: p.y - sH * 0.03 }
      : { l: p.x - sH * 0.16, r: p.x + sH * 0.34, t: p.y - sH * 0.78, b: p.y - sH * 0.05 };

    for (i = 0; i < world.objects.length; i++) {
      o = world.objects[i];
      if (o.dead) continue;

      if (o.type === 'item') {
        var reach = sH * (world.magnet > 0 ? 0.62 : 0.40) + Math.max(o.w, o.h) * 0.35;
        if (Math.abs(o.x - p.x) < reach && o.y > pb.t - reach * 0.9 && o.y < pb.b + reach * 0.6) {
          collect(o);
        }
        continue;
      }

      var hw2 = o.hw || 0.42;
      var ol = o.x - o.w * hw2, orr = o.x + o.w * hw2;
      var ot, ob;
      if (o.air) { ot = o.y - o.h * 0.42; ob = o.y + o.h * 0.42; }
      else { ot = groundY - o.h; ob = groundY + sH * 0.03; }
      if (pb.r > ol && pb.l < orr && pb.b > ot && pb.t < ob) {
        if (world.fever > 0) smash(o);
        else if (world.invuln <= 0) hurt(o);
      }
    }
    var wkeep = 0;
    for (i = 0; i < world.objects.length; i++) {
      if (!world.objects[i].dead) world.objects[wkeep++] = world.objects[i];
    }
    world.objects.length = wkeep;
    updateParts(dt);
  } else {
    updateParts(dt);
    p.y = groundY;
    p.slide = false;
    world.squash *= Math.pow(0.0016, dt);
    if (world.mode === 'over') world.time += dt;
  }

  if (world.shake > 0) world.shake = Math.max(0, world.shake - dt * 46);
  if (world.flash > 0) world.flash = Math.max(0, world.flash - dt * 2.4);
  var slTarget = (world.mode === 'playing' && p.slide) ? 1 : 0;
  world.slideAmt += (slTarget - world.slideAmt) * Math.min(1, dt * 18);
}

function updateParts(dt){
  var i, q;
  for (i = world.parts.length - 1; i >= 0; i--) {
    q = world.parts[i];
    q.life -= dt;
    if (q.life <= 0) { world.parts.splice(i, 1); continue; }
    q.vy += q.grav * sH * dt;
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    q.rot += q.vr * dt;
    if (q.kind === 'smoke') q.r += dt * sH * 0.07;
  }
  for (i = world.pops.length - 1; i >= 0; i--) {
    q = world.pops[i];
    q.life -= dt;
    if (q.life <= 0) { world.pops.splice(i, 1); continue; }
    q.y += q.vy * dt;
    q.vy *= 0.94;
  }
}

function comboMult(){ return Math.min(5, 1 + Math.floor(world.combo / 4)); }

function collect(o){
  o.dead = true;
  if (o.kind === 'devil') { startFever(o.x, o.y); return; }
  if (o.kind === 'magnet') {
    world.magnet = 7;
    world.score += 15;
    Sound.golden();
    burst(o.x, o.y, 16, ['#bfe6ff', '#8fd3ff', '#ffffff']);
    pop(o.x, o.y - sH * 0.1, '자석!', '#2f6d9e');
    return;
  }
  world.combo++;
  world.comboT = 3.6;
  if (world.combo > world.maxCombo) world.maxCombo = world.combo;
  var mult = comboMult();
  var gain = (o.kind === 'gold' ? 50 : 10) * mult;
  world.score += gain;
  if (o.kind === 'gold') {
    Sound.golden();
    burst(o.x, o.y, 14, ['#ffe89a', '#ffc93c', '#fff8dc']);
    pop(o.x, o.y - sH * 0.1, '+' + gain, '#c98a12');
    world.flash = 0.5;
  } else {
    Sound.pickup(world.combo);
    burst(o.x, o.y, 6, ['#fff4d6', '#ffd9a0', '#f7c873']);
    pop(o.x, o.y - sH * 0.08, '+' + gain, '#8a6a2a');
  }
  if (mult > 1) pop(o.x + sH * 0.24, o.y - sH * 0.3, 'x' + mult, '#e0703a');
}

function startFever(x, y){
  world.fever = world.feverMax;
  world.invuln = 0;
  world.score += 20;
  world.shake = 13;
  world.flash = 0.85;
  Sound.fever();
  burst(x, y, 24, ['#ff4d3d', '#ff8a3d', '#ffd166', '#7a1f1f']);
  pop(x, y - sH * 0.18, '피버!', '#d63a22');
}

function smash(o){
  o.dead = true;
  world.score += 25;
  world.shake = Math.max(world.shake, 7);
  Sound.smash();
  var colors = o.kind === 'puddle' ? ['#8fd3ff', '#c9ecff', '#5fa8d3']
    : o.kind === 'hydrant' ? ['#e8563f', '#f0a08a', '#c9c2b6']
    : o.kind === 'bush' ? ['#4f8a3d', '#7cb342', '#2f5e28']
    : o.kind === 'crow' ? ['#3a3d48', '#6b6f7c', '#f2a13c']
    : o.kind === 'drone' ? ['#dfe7ee', '#9aa7b3', '#ff6a4a']
    : ['#d98324', '#e8b04b', '#a85a1f'];
  var by = o.air ? o.y : groundY - o.h * 0.5;
  burst(o.x, by, 15, colors);
  pop(o.x, by - sH * 0.18, '+25', '#d63a22');
}

function hurt(o){
  var p = world.player;
  if (world.god) return;
  world.hitLog.push({ t: +world.time.toFixed(2), kind: o.kind, w: Math.round(o.w), h: Math.round(o.h),
    px: Math.round(p.x), ox: Math.round(o.x), py: Math.round(p.y), ground: Math.round(groundY) });
  world.lives--;
  world.combo = 0;
  world.invuln = 1.5;
  world.shake = 20;
  world.flash = 0.65;
  Sound.hit();
  dust(p.x, groundY, 9, 0.85);
  burst(p.x, p.y - sH * 0.45, 11, ['#ffd166', '#ff8a5c', '#ffffff']);
  if (world.lives <= 0) gameOver();
  else pop(p.x, p.y - sH * 0.92, '앗!', '#c2512f');
  void o;
}

/* =================================================================
   RENDER
   ================================================================= */
function render(){
  var shakeX = 0, shakeY = 0;
  if (world.shake > 0.2) {
    shakeX = rand(-world.shake, world.shake) * 0.45;
    shakeY = rand(-world.shake, world.shake) * 0.45;
  }
  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawSky();
  drawHills();
  drawGrassField();
  drawFar();
  drawPath();
  drawPrints();
  drawParticles(false);

  var i;
  for (i = 0; i < world.objects.length; i++) {
    if (world.objects[i].type === 'obs') drawObstacle(world.objects[i]);
  }
  for (i = 0; i < world.objects.length; i++) {
    if (world.objects[i].type === 'item' && !world.objects[i].dead) drawItemShadow(world.objects[i]);
  }

  drawPlayer();

  for (i = 0; i < world.objects.length; i++) {
    if (world.objects[i].type === 'item' && !world.objects[i].dead) drawItem(world.objects[i]);
  }

  drawParticles(true);
  drawPops();
  ctx.restore();

  drawHud();
  drawVignette();
}

/* ---------- sky ---------- */
function drawSkyPark(){
  var g = ctx.createLinearGradient(0, 0, 0, horizonY + H * 0.18);
  g.addColorStop(0, '#6fc2ec');
  g.addColorStop(0.35, '#a9ddf5');
  g.addColorStop(0.68, '#ffeacb');
  g.addColorStop(1, '#ffe4c0');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, horizonY + H * 0.2);

  var sx = W * 0.77, sy = H * 0.155, sr = Math.min(W, H) * 0.085;
  var sg = ctx.createRadialGradient(sx, sy, sr * 0.2, sx, sy, sr * 3.4);
  sg.addColorStop(0, 'rgba(255,248,214,0.95)');
  sg.addColorStop(0.34, 'rgba(255,238,180,0.38)');
  sg.addColorStop(1, 'rgba(255,238,180,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, sr * 3.4, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,253,238,0.95)';
  ctx.beginPath(); ctx.arc(sx, sy, sr * 0.6, 0, TAU); ctx.fill();

  /* 구름도 슬롯 반복: 한 구름은 자기 번호의 모양 그대로 화면을 가로질러
     나가고 다음 구름이 오른쪽에서 들어온다 — 되감기는 지점이 없다. */
  var cs = clamp(W * 0.36, 220, 460);
  eachSlot(cs, 0.045, function(x, n){
    var cr = Math.min(W, H) * hR(n, 3, 0.062, 0.115);
    var cyy = H * hR(n, 5, 0.045, 0.165) + Math.sin(world.time * 0.25 + n) * 3;
    rec('cloud', n, x, 0.045, cr);
    drawCloud(x, cyy, cr);
  });

  // kite
  var kt = (world.dist * 0.012 + W * 0.12) % (W + 260) - 130;
  var ky = H * 0.30 + Math.sin(world.time * 0.9) * 10;
  ctx.save();
  ctx.translate(kt, ky);
  ctx.rotate(Math.sin(world.time * 0.7) * 0.12);
  ctx.fillStyle = '#f2a03d';
  ctx.beginPath();
  ctx.moveTo(0, -18); ctx.lineTo(13, 0); ctx.lineTo(0, 20); ctx.lineTo(-13, 0);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e4663a';
  ctx.beginPath();
  ctx.moveTo(0, -18); ctx.lineTo(13, 0); ctx.lineTo(0, 0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(90,70,40,0.45)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, 20);
  ctx.quadraticCurveTo(6 + Math.sin(world.time * 3) * 6, 44, -4 + Math.sin(world.time * 3) * 8, 70);
  ctx.stroke();
  ctx.restore();

  // birds
  for (var b = 0; b < 3; b++) {
    var t = world.time * 0.25 + b * 1.7;
    var bxp = ((W * 0.2 + t * 26 - world.dist * 0.02) % (W + 160) + W + 160) % (W + 160) - 80;
    var byp = H * (0.17 + b * 0.035) + Math.sin(t * 2) * 6;
    ctx.strokeStyle = 'rgba(70,86,96,0.42)';
    ctx.lineWidth = Math.max(1.4, sH * 0.014);
    ctx.beginPath();
    ctx.moveTo(bxp - 7, byp);
    ctx.quadraticCurveTo(bxp - 3, byp - 5, bxp, byp);
    ctx.quadraticCurveTo(bxp + 3, byp - 5, bxp + 7, byp);
    ctx.stroke();
  }
}

function drawCloud(x, y, r){
  ctx.save();
  ctx.globalAlpha = 0.84;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.arc(x + r * 0.95, y + r * 0.14, r * 0.76, 0, TAU);
  ctx.arc(x - r * 0.92, y + r * 0.18, r * 0.64, 0, TAU);
  ctx.arc(x + r * 0.28, y - r * 0.46, r * 0.68, 0, TAU);
  ctx.fill();
  ctx.restore();
}

/* ---------- distance ---------- */
function drawHillsPark(){
  drawHillLayer(horizonY + H * 0.012, H * 0.075, '#b6dfc0', 0.07);
  drawHillLayer(horizonY + H * 0.05, H * 0.055, '#9bd39c', 0.14);
}

function drawFarPark(){
  var base = groundY - sH * 0.02;

  // ---- back row of soft trees (atmospheric, light) ----
  var bs = Math.max(150, sH * 1.3);
  ctx.save();
  ctx.globalAlpha = 0.82;
  eachSlot(bs * 1.5, 0.18, function(x, n){
    var th = sH * hR(n, 11, 0.85, 1.12);
    var tx = x + bs * hR(n, 13, 0.10, 0.62);
    rec('farBack', n, tx, 0.18, th);
    drawFarTree(tx, base - sH * 0.04, th, false);
  });
  ctx.restore();

  // ---- mid row: trees and lamp posts standing on the verge ----
  var spacing = Math.max(210, sH * 2.0);
  eachSlot(spacing, 0.42, function(x, n){
    var slot = ((n % 5) + 5) % 5;
    var fx = x + spacing * hR(n, 17, 0.12, 0.58);
    var deep = base - sH * hR(n, 19, 0.02, 0.09);
    rec('farMid', n, fx, 0.42, slot);
    if (slot === 0) drawLamp(fx, base, sH * 0.95);
    else if (slot === 2) drawBushPatch(fx, base, sH * 0.5);
    else drawFarTree(fx, deep, sH * hR(n, 23, 0.95, 1.20), true);
  });

  // ---- hedge along the path edge (kept low so a smaller Bada still reads
  //      against the lighter trees behind it instead of the dark hedge) ----
  var hs = Math.max(28, sH * 0.30);
  var hy = groundY - sH * 0.02;
  eachSlot(hs, 0.92, function(x, n){
    var hr = hs * hR(n, 29, 0.34, 0.72);
    rec('hedge', n, x, 0.92, hr);
    ctx.fillStyle = '#3a7439';
    ctx.beginPath(); ctx.arc(x, hy - hr * 0.55, hr, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4b8b45';
    ctx.beginPath(); ctx.arc(x - hr * 0.18, hy - hr * 0.85, hr * 0.72, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(126,186,110,0.55)';
    ctx.beginPath(); ctx.arc(x - hr * 0.34, hy - hr * 1.05, hr * 0.30, 0, TAU); ctx.fill();
  });
}

function drawFarTree(x, baseY, h, dark){
  var trunkW = Math.max(3, h * 0.055);
  ctx.fillStyle = dark ? '#7d6145' : '#a2866a';
  ctx.fillRect(x - trunkW / 2, baseY - h * 0.5, trunkW, h * 0.5);
  var r = h * 0.31, cy = baseY - h * 0.64;
  ctx.save();
  var blobs = [[x, cy, r], [x - r * 0.78, cy + r * 0.38, r * 0.72], [x + r * 0.78, cy + r * 0.32, r * 0.68]];
  ctx.fillStyle = dark ? '#4b8c4b' : '#8cc98c';
  ctx.strokeStyle = dark ? 'rgba(28,66,34,0.3)' : 'rgba(60,110,70,0.16)';
  ctx.lineWidth = Math.max(1.4, h * 0.011);
  for (var bi2 = 0; bi2 < blobs.length; bi2++) {
    ctx.beginPath();
    ctx.arc(blobs[bi2][0], blobs[bi2][1], blobs[bi2][2], 0, TAU);
    ctx.fill();
    ctx.stroke();
  }
  ctx.fillStyle = dark ? '#65a95f' : '#a9dca6';
  ctx.beginPath(); ctx.arc(x - r * 0.30, cy - r * 0.32, r * 0.60, 0, TAU); ctx.fill();
  ctx.fillStyle = dark ? '#79bb6f' : '#bfe7ba';
  ctx.beginPath(); ctx.arc(x - r * 0.48, cy - r * 0.5, r * 0.28, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawBushPatch(x, baseY, h){
  for (var i = 0; i < 3; i++){
    var bx = x + (i - 1) * h * 0.5;
    var r = h * (0.34 + (i % 2) * 0.1);
    ctx.fillStyle = i === 1 ? '#4d9243' : '#428040';
    ctx.beginPath(); ctx.arc(bx, baseY - h * 0.4, r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(121,189,108,0.75)';
    ctx.beginPath(); ctx.arc(bx - r * 0.28, baseY - h * 0.4 - r * 0.42, r * 0.42, 0, TAU); ctx.fill();
  }
}

function drawLamp(x, baseY, h){
  var poleW = Math.max(2, h * 0.045);
  ctx.fillStyle = '#6f7a72';
  ctx.fillRect(x - poleW / 2, baseY - h, poleW, h);
  ctx.fillStyle = '#7f8a81';
  ctx.beginPath();
  ctx.ellipse(x, baseY, poleW * 2.4, poleW * 1.1, 0, 0, TAU);
  ctx.fill();
  // lamp head: small lantern with a warm glow
  var lw2 = h * 0.085, lh2 = h * 0.10;
  var lg = ctx.createRadialGradient(x, baseY - h - lh2 * 1.1, 1, x, baseY - h - lh2 * 1.1, h * 0.42);
  lg.addColorStop(0, 'rgba(255,231,155,0.55)');
  lg.addColorStop(1, 'rgba(255,231,155,0)');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.arc(x, baseY - h - lh2 * 1.1, h * 0.42, 0, TAU); ctx.fill();
  ctx.fillStyle = '#4d574f';
  ctx.beginPath();
  ctx.moveTo(x - lw2, baseY - h - lh2 * 2);
  ctx.lineTo(x, baseY - h - lh2 * 2.9);
  ctx.lineTo(x + lw2, baseY - h - lh2 * 2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5c665e';
  roundRect(x - lw2, baseY - h - lh2 * 2, lw2 * 2, lh2 * 1.5, lw2 * 0.5);
  ctx.fill();
  ctx.fillStyle = '#fff4c9';
  ctx.beginPath(); ctx.arc(x, baseY - h - lh2 * 1.25, lw2 * 0.72, 0, TAU); ctx.fill();
}

function drawHillLayer(baseY, amp, color, par){
  /* 파장을 화면 폭과 정확히 같게 두고 배음을 정수배만 쓰면, 오프셋이 한
     주기 되감기는 순간에도 실루엣이 픽셀 단위로 같다. (예전 2.3배 배음은
     주기의 약수·배수가 아니라서 되감길 때마다 능선이 튀었다.) */
  var period = W;
  var off = (world.dist * par) % period;
  var step = Math.max(5, Math.round(W / 120));
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (var x = 0; x <= W + step; x += step) {
    var t = (x + off) / period * TAU;
    var y = baseY - Math.sin(t) * amp - Math.sin(t * 2 + 1.1) * amp * 0.32 - Math.sin(t * 3 + 0.4) * amp * 0.13;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}

/* ---------- ground ---------- */
function drawFieldPark(){
  var gg = ctx.createLinearGradient(0, horizonY, 0, groundY);
  gg.addColorStop(0, '#86c47c');
  gg.addColorStop(0.35, '#74b96c');
  gg.addColorStop(1, '#5aa257');
  ctx.fillStyle = gg;
  ctx.fillRect(0, horizonY, W, groundY - horizonY + 2);

  // mown stripes
  var sw = Math.max(70, sH * 0.8);
  var soff = (world.dist * 0.55) % (sw * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.055)';
  for (var sx2 = -soff; sx2 < W + sw * 2; sx2 += sw * 2) {
    ctx.fillRect(sx2, horizonY, sw, groundY - horizonY);
  }

  var hz = ctx.createLinearGradient(0, horizonY, 0, horizonY + H * 0.10);
  hz.addColorStop(0, 'rgba(255,247,224,0.34)');
  hz.addColorStop(1, 'rgba(255,247,224,0)');
  ctx.fillStyle = hz;
  ctx.fillRect(0, horizonY, W, H * 0.10);

  // grass tufts in the verge — 한 번의 stroke로, 슬롯 번호로 모양 고정
  var gs = Math.max(42, sH * 0.42);
  var bands = 4;
  ctx.strokeStyle = 'rgba(46,110,52,0.22)';
  ctx.lineWidth = Math.max(1.5, sH * 0.012);
  ctx.beginPath();
  eachSlot(gs, 0.9, function(x, n){
    for (var j = 0; j < bands; j++){
      var gy = horizonY + sH * (0.17 + j * 0.185) + hR(n, j + 3, -0.03, 0.03) * sH;
      var gx = x + hR(n, j + 7, -gs * 0.34, gs * 0.34);
      rec('tuft', n * 10 + j, gx, 0.9, j);
      ctx.moveTo(gx, gy);
      ctx.quadraticCurveTo(gx + 3, gy - sH * 0.05, gx + 6, gy - sH * 0.08);
    }
  });
  ctx.stroke();
}

function drawPathPark(){
  // path — its edge sits a little above the running line so the paws land on sand
  var pathTop = groundY - sH * 0.09;
  var pg = ctx.createLinearGradient(0, pathTop, 0, H);
  pg.addColorStop(0, '#f2ddb4');
  pg.addColorStop(0.3, '#e9cd9c');
  pg.addColorStop(1, '#d3b07c');
  ctx.fillStyle = pg;
  ctx.fillRect(0, pathTop, W, H - pathTop);

  // grass lip over the path
  ctx.fillStyle = '#5ea85a';
  ctx.fillRect(0, pathTop - sH * 0.05, W, sH * 0.05);
  ctx.fillStyle = '#79c06e';
  ctx.fillRect(0, pathTop - sH * 0.05, W, sH * 0.018);

  // edge tufts
  var es = Math.max(24, sH * 0.24);
  ctx.strokeStyle = 'rgba(64,140,64,0.85)';
  ctx.lineWidth = Math.max(1.6, sH * 0.014);
  ctx.beginPath();
  eachSlot(es, 1.02, function(ex, n){
    var eh = sH * hR(n, 31, 0.06, 0.19);
    rec('edgeTuft', n, ex, 1.02, eh);
    ctx.moveTo(ex, pathTop + 1);
    ctx.quadraticCurveTo(ex - 2, pathTop - eh * 0.7, ex - 5, pathTop - eh);
    ctx.moveTo(ex + 4, pathTop + 1);
    ctx.quadraticCurveTo(ex + 6, pathTop - eh * 0.6, ex + 10, pathTop - eh * 0.75);
  });
  ctx.stroke();

  // path texture: soft stones (자갈도 슬롯 번호로만 모양이 정해진다)
  var ps2 = Math.max(60, sH * 0.62);
  eachSlot(ps2, 1.0, function(px2, n){
    var yy = groundY + sH * hR(n, 37, 0.16, 0.50);
    rec('stones', n, px2, 1.0, yy);
    ctx.fillStyle = 'rgba(255,248,228,0.34)';
    ctx.beginPath();
    ctx.ellipse(px2 + sH * 0.1, yy, sH * 0.055, sH * 0.016, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(168,136,92,0.28)';
    ctx.beginPath();
    ctx.ellipse(px2 + sH * 0.32, yy + sH * 0.09, sH * 0.04, sH * 0.013, 0, 0, TAU);
    ctx.fill();
  });

  // foreground grass
  var fgs = Math.max(30, sH * 0.26);
  ctx.strokeStyle = 'rgba(52,120,58,0.78)';
  ctx.lineWidth = Math.max(2, sH * 0.018);
  ctx.beginPath();
  eachSlot(fgs, 1.25, function(gx2, n){
    var hh = sH * hR(n, 41, 0.09, 0.20);
    rec('fgGrass', n, gx2, 1.25, hh);
    ctx.moveTo(gx2, H + 6);
    ctx.quadraticCurveTo(gx2 - 3, H - hh * 0.6, gx2 - 8, H - hh);
    ctx.moveTo(gx2 + 7, H + 6);
    ctx.quadraticCurveTo(gx2 + 10, H - hh * 0.55, gx2 + 16, H - hh * 0.8);
  });
  ctx.stroke();
}

function drawPrints(){
  ctx.save();
  for (var i = 0; i < world.prints.length; i++) {
    var p = world.prints[i];
    var s = p.s;
    var a = p.a * clamp(p.x / (sH * 2), 0, 1) * clamp((W - p.x) / (sH * 2), 0, 1);
    var themePrint = world.theme === 'night' ? 'rgba(20,26,34,'
      : world.theme === 'sky' ? 'rgba(168,138,196,'
      : world.theme === 'beach' ? 'rgba(176,142,96,' : 'rgba(150,118,74,';
    ctx.fillStyle = themePrint + a.toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, s * 0.62, s * 0.48, 0, 0, TAU);
    ctx.fill();
    for (var t = 0; t < 4; t++) {
      var ang = -Math.PI * 0.5 + (t - 1.5) * 0.42;
      ctx.beginPath();
      ctx.ellipse(p.x + Math.cos(ang) * s * 0.95 + p.side * s * 0.1,
                  p.y + Math.sin(ang) * s * 0.95, s * 0.22, s * 0.28, ang, 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();
}

/* =================================================================
   STAGE THEMES — 햇살 공원 / 노을 해변 / 별빛 도심 / 무지개 구름
   모든 가로 반복 요소는 eachSlot(전역 슬롯 해시)로만 모양이 정해지므로
   스크롤·스테이지 전환에서도 이음매가 없다.
   ================================================================= */
function drawSky(){
  if (world.theme === 'beach') return drawSkyBeach();
  if (world.theme === 'night') return drawSkyNight();
  if (world.theme === 'sky') return drawSkySky();
  return drawSkyPark();
}
function drawHills(){
  if (world.theme === 'beach'){
    drawHillLayer(horizonY + H * 0.020, H * 0.050, 'rgba(104,80,124,0.55)', 0.05);
    drawHillLayer(horizonY + H * 0.046, H * 0.030, 'rgba(74,60,100,0.55)', 0.09);
    return;
  }
  if (world.theme === 'night'){
    drawHillLayer(horizonY + H * 0.014, H * 0.042, 'rgba(13,19,40,0.92)', 0.04);
    return;
  }
  if (world.theme === 'sky'){
    drawCloudBank(0.09, 'rgba(255,255,255,0.62)', Math.max(120, sH * 1.25), 'A');
    drawCloudBank(0.16, 'rgba(255,236,250,0.75)', Math.max(90, sH * 0.95), 'B');
    return;
  }
  drawHillsPark();
}
function drawGrassField(){
  if (world.theme === 'beach') return drawFieldBeach();
  if (world.theme === 'night') return drawFieldNight();
  if (world.theme === 'sky') return drawFieldSky();
  return drawFieldPark();
}
function drawFar(){
  if (world.theme === 'beach') return drawFarBeach();
  if (world.theme === 'night') return drawFarNight();
  if (world.theme === 'sky') return drawFarSky();
  return drawFarPark();
}
function drawPath(){
  if (world.theme === 'beach') return drawPathBeach();
  if (world.theme === 'night') return drawPathNight();
  if (world.theme === 'sky') return drawPathSky();
  return drawPathPark();
}

/* ---------- shared theme helpers ---------- */
function drawCloudTint(x, y, r, color, alpha){
  ctx.save();
  ctx.globalAlpha = alpha == null ? 0.86 : alpha;
  ctx.fillStyle = color || '#ffffff';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.arc(x + r * 0.95, y + r * 0.14, r * 0.76, 0, TAU);
  ctx.arc(x - r * 0.92, y + r * 0.18, r * 0.64, 0, TAU);
  ctx.arc(x + r * 0.28, y - r * 0.46, r * 0.68, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawCloudBank(par, color, spacing, tag){
  var rad = Math.max(30, sH * 0.42);
  var key = 'cloudBank' + (tag || '');
  var baseY = horizonY + H * 0.028;
  ctx.save();
  ctx.fillStyle = color;
  eachSlot(spacing, par, function(x, n){
    var r = rad * hR(n, 91, 0.62, 1.18);
    var y = baseY + hR(n, 93, -0.45, 0.30) * rad * 0.4;
    rec(key, n, x, par, r);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.arc(x + r * 0.92, y + r * 0.20, r * 0.74, 0, TAU);
    ctx.arc(x - r * 0.90, y + r * 0.24, r * 0.66, 0, TAU);
    ctx.arc(x + r * 0.10, y - r * 0.48, r * 0.66, 0, TAU);
    ctx.fill();
  });
  ctx.restore();
}

function drawGullSil(x, y, s){
  s = s || 1;
  ctx.save();
  var f = Math.sin(world.time * 7 + x * 0.05) * 0.5 + 0.5;
  ctx.strokeStyle = 'rgba(58,52,74,0.62)';
  ctx.lineWidth = Math.max(1.3, sH * 0.013);
  ctx.beginPath();
  ctx.moveTo(x - sH * 0.075 * s, y);
  ctx.quadraticCurveTo(x - sH * 0.035 * s, y - sH * (0.045 + f * 0.02), x, y);
  ctx.quadraticCurveTo(x + sH * 0.035 * s, y - sH * (0.045 + f * 0.02), x + sH * 0.075 * s, y);
  ctx.stroke();
  ctx.restore();
}

function drawPalm(x, baseY, h, n){
  var lean = hR(n, 101, -0.20, 0.24);
  var tipX = x + lean * h, tipY = baseY - h;
  ctx.save();
  ctx.strokeStyle = 'rgba(52,40,62,0.95)';
  ctx.lineWidth = Math.max(2.4, h * 0.042);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, baseY);
  ctx.quadraticCurveTo(x + lean * h * 0.42, baseY - h * 0.58, tipX, tipY);
  ctx.stroke();
  for (var i = 0; i < 7; i++){
    var a = -Math.PI * 0.92 + i * (Math.PI * 1.84 / 6) + hR(n, i + 5, -0.12, 0.12);
    var fl = h * (0.40 + hR(n, i + 11, 0.0, 0.18));
    var ex = tipX + Math.cos(a) * fl, ey = tipY + Math.sin(a) * fl * 0.66;
    ctx.strokeStyle = i % 2 ? 'rgba(58,46,72,0.94)' : 'rgba(78,62,94,0.94)';
    ctx.lineWidth = Math.max(3.4, h * 0.068);
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.quadraticCurveTo((tipX + ex) / 2, tipY + Math.sin(a) * fl * 0.10 - h * 0.03, ex, ey);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(48,36,52,0.95)';
  ctx.beginPath(); ctx.arc(tipX + h * 0.03, tipY + h * 0.05, Math.max(2, h * 0.048), 0, TAU); ctx.fill();
  ctx.restore();
}

function drawBuilding(x, baseY, w, h, n){
  var g = ctx.createLinearGradient(x, baseY - h, x + w, baseY);
  g.addColorStop(0, '#243055');
  g.addColorStop(1, '#131a31');
  ctx.save();
  ctx.fillStyle = g;
  ctx.fillRect(x, baseY - h, w, h);
  if (h01(n * 2.7) > 0.55){
    ctx.fillStyle = '#2b3760';
    ctx.fillRect(x + w * 0.18, baseY - h - sH * 0.035, w * 0.26, sH * 0.035);
  }
  var cols = Math.max(2, Math.round(w / Math.max(9, sH * 0.15)));
  var rows = Math.max(3, Math.round(h / Math.max(12, sH * 0.19)));
  for (var r = 0; r < rows; r++){
    for (var c = 0; c < cols; c++){
      var lit = h01(n * 3.1 + r * 5.3 + c * 7.7);
      if (lit < 0.42) continue;
      ctx.fillStyle = lit > 0.72 ? 'rgba(255,228,150,0.90)' : 'rgba(176,214,255,0.55)';
      ctx.fillRect(x + w * 0.10 + c * (w * 0.80 / cols),
        baseY - h + h * 0.10 + r * (h * 0.82 / rows),
        Math.max(1.4, w * 0.32 / cols), Math.max(1.6, h * 0.26 / rows));
    }
  }
  ctx.restore();
}

/* ---------- SKY: 노을 해변 ---------- */
function drawSkyBeach(){
  var g = ctx.createLinearGradient(0, 0, 0, horizonY + H * 0.2);
  g.addColorStop(0, '#465b98');
  g.addColorStop(0.28, '#8a6fae');
  g.addColorStop(0.56, '#e98d6a');
  g.addColorStop(0.80, '#ffbe8a');
  g.addColorStop(1, '#ffe3ba');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, horizonY + H * 0.2);

  var sx = W * 0.66, sy = horizonY - H * 0.085, sr = Math.min(W, H) * 0.070;
  var sg = ctx.createRadialGradient(sx, sy, sr * 0.2, sx, sy, sr * 4.4);
  sg.addColorStop(0, 'rgba(255,240,196,0.92)');
  sg.addColorStop(0.30, 'rgba(255,182,120,0.48)');
  sg.addColorStop(1, 'rgba(255,132,86,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, sr * 4.4, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,247,218,0.96)';
  ctx.beginPath(); ctx.arc(sx, sy, sr * 0.82, 0, TAU); ctx.fill();

  eachSlot(clamp(W * 0.34, 200, 420), 0.05, function(x, n){
    var cr = Math.min(W, H) * hR(n, 53, 0.050, 0.100);
    var cy2 = H * hR(n, 57, 0.055, 0.205) + Math.sin(world.time * 0.22 + n) * 2;
    rec('cloud', n, x, 0.05, cr);
    drawCloudTint(x, cy2, cr, 'rgba(255,208,198,0.78)', 0.9);
  });
  eachSlot(clamp(W * 0.5, 260, 520), 0.03, function(x, n){
    var cr = Math.min(W, H) * hR(n, 151, 0.055, 0.095);
    var cy2 = H * hR(n, 153, 0.16, 0.34) + Math.sin(world.time * 0.18 + n * 2) * 3;
    rec('cloud2', n, x, 0.03, cr);
    drawCloudTint(x, cy2, cr, 'rgba(196,168,214,0.55)', 0.8);
  });

  for (var b = 0; b < 4; b++){
    var t = world.time * 0.22 + b * 1.9;
    var bxp = ((W * 0.15 + t * 24 - world.dist * 0.03) % (W + 180) + W + 180) % (W + 180) - 90;
    var byp = H * (0.13 + b * 0.042) + Math.sin(t * 2) * 7;
    drawGullSil(bxp, byp, 0.9 + (b % 2) * 0.25);
  }
}

/* ---------- SKY: 별빛 야간 도심 ---------- */
function drawSkyNight(){
  var g = ctx.createLinearGradient(0, 0, 0, horizonY + H * 0.2);
  g.addColorStop(0, '#060a1e');
  g.addColorStop(0.42, '#101a3c');
  g.addColorStop(0.76, '#243058');
  g.addColorStop(1, '#3b3a63');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, horizonY + H * 0.2);

  /* stars: 슬롯 번호로만 자리가 정해지고 반짝임만 시간에 따라 변한다 */
  var sp1 = Math.max(44, sH * 0.40);
  eachSlot(sp1, 0, function(x, n){
    var y = H * hR(n, 71, 0.02, 0.40);
    var r = Math.max(0.7, sH * hR(n, 73, 0.0055, 0.017));
    var tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(world.time * 1.9 + n * 1.7));
    rec('star', n, x, 0, r);
    ctx.fillStyle = 'rgba(255,247,222,' + tw.toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    if (n % 7 === 0){
      ctx.strokeStyle = 'rgba(255,247,222,' + (tw * 0.55).toFixed(2) + ')';
      ctx.lineWidth = Math.max(0.8, r * 0.7);
      ctx.beginPath();
      ctx.moveTo(x - r * 3, y); ctx.lineTo(x + r * 3, y);
      ctx.moveTo(x, y - r * 3); ctx.lineTo(x, y + r * 3);
      ctx.stroke();
    }
  });

  /* 초승달 */
  var mx = W * 0.78, my = H * 0.15, mr = Math.min(W, H) * 0.052;
  var mg = ctx.createRadialGradient(mx, my, mr * 0.2, mx, my, mr * 3.4);
  mg.addColorStop(0, 'rgba(255,246,206,0.35)');
  mg.addColorStop(1, 'rgba(255,246,206,0)');
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx, my, mr * 3.4, 0, TAU); ctx.fill();
  ctx.save();
  ctx.fillStyle = 'rgba(255,250,224,0.97)';
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.arc(mx + mr * 0.52, my - mr * 0.26, mr * 0.92, 0, TAU); ctx.fill();
  ctx.restore();

  /* 도시 불빛 헤이즈 */
  var hz = ctx.createLinearGradient(0, horizonY - H * 0.16, 0, horizonY + H * 0.02);
  hz.addColorStop(0, 'rgba(255,186,110,0)');
  hz.addColorStop(1, 'rgba(255,170,96,0.20)');
  ctx.fillStyle = hz;
  ctx.fillRect(0, horizonY - H * 0.16, W, H * 0.18);
}

/* ---------- SKY: 무지개 구름 ---------- */
function drawSkySky(){
  var g = ctx.createLinearGradient(0, 0, 0, horizonY + H * 0.22);
  g.addColorStop(0, '#bfa9ea');
  g.addColorStop(0.32, '#e3c2ee');
  g.addColorStop(0.66, '#ffd6ea');
  g.addColorStop(1, '#fff0f7');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, horizonY + H * 0.22);

  /* 무지개 아치 (화면 고정, 이음매 없음) */
  var rcx = W * 0.5, rcy = groundY + sH * 0.35, R0 = Math.max(W * 0.44, sH * 2.7);
  var cols = ['rgba(255,128,128,0.34)', 'rgba(255,190,124,0.32)', 'rgba(255,242,150,0.30)',
    'rgba(142,226,168,0.30)', 'rgba(138,188,255,0.30)', 'rgba(198,146,255,0.28)'];
  var lw = Math.max(7, sH * 0.105);
  ctx.save();
  ctx.lineWidth = lw;
  for (var i = 0; i < cols.length; i++){
    ctx.strokeStyle = cols[i];
    ctx.beginPath();
    ctx.arc(rcx, rcy, R0 - i * lw * 0.94, Math.PI * 1.04, Math.PI * 1.96);
    ctx.stroke();
  }
  ctx.restore();

  eachSlot(clamp(W * 0.30, 190, 380), 0.04, function(x, n){
    var cr = Math.min(W, H) * hR(n, 61, 0.045, 0.095);
    var cy2 = H * hR(n, 63, 0.05, 0.24) + Math.sin(world.time * 0.24 + n) * 3;
    rec('cloud', n, x, 0.04, cr);
    drawCloudTint(x, cy2, cr, 'rgba(255,255,255,0.88)', 0.92);
  });
  eachSlot(clamp(W * 0.4, 220, 460), 0.07, function(x, n){
    var cr = Math.min(W, H) * hR(n, 161, 0.05, 0.10);
    var cy2 = H * hR(n, 163, 0.18, 0.36) + Math.sin(world.time * 0.2 + n * 1.5) * 2;
    rec('cloud2', n, x, 0.07, cr);
    drawCloudTint(x, cy2, cr, 'rgba(255,226,246,0.82)', 0.9);
  });

  /* 반짝이는 별빛 */
  var sp = Math.max(60, sH * 0.55);
  eachSlot(sp, 0, function(x, n){
    var y = H * hR(n, 167, 0.04, 0.30);
    var r = Math.max(0.9, sH * hR(n, 169, 0.006, 0.014));
    var tw = 0.34 + 0.66 * Math.abs(Math.sin(world.time * 1.6 + n * 2.3));
    rec('spark', n, x, 0, r);
    ctx.strokeStyle = 'rgba(255,255,236,' + tw.toFixed(2) + ')';
    ctx.lineWidth = Math.max(0.9, r * 0.8);
    ctx.beginPath();
    ctx.moveTo(x - r * 2.6, y); ctx.lineTo(x + r * 2.6, y);
    ctx.moveTo(x, y - r * 2.6); ctx.lineTo(x, y + r * 2.6);
    ctx.stroke();
  });
}

/* ---------- FIELD: 노을 해변 (바다 + 모래) ---------- */
function drawFieldBeach(){
  var seaBot = groundY - sH * 0.60;
  var sg = ctx.createLinearGradient(0, horizonY, 0, seaBot);
  sg.addColorStop(0, '#7d6b98');
  sg.addColorStop(0.30, '#5b7099');
  sg.addColorStop(0.70, '#48759a');
  sg.addColorStop(1, '#3f7396');
  ctx.fillStyle = sg;
  ctx.fillRect(0, horizonY, W, seaBot - horizonY + 1);

  /* 노을 반사 */
  var rx = W * 0.66;
  var rg = ctx.createLinearGradient(rx - sH * 0.9, 0, rx + sH * 0.9, 0);
  rg.addColorStop(0, 'rgba(255,214,150,0)');
  rg.addColorStop(0.5, 'rgba(255,214,150,0.35)');
  rg.addColorStop(1, 'rgba(255,214,150,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(rx - sH * 0.9, horizonY, sH * 1.8, seaBot - horizonY);

  /* 잔잔한 파도 결 */
  var ws = Math.max(48, sH * 0.50);
  eachSlot(ws, 0.16, function(x, n){
    var yy = horizonY + (seaBot - horizonY) * hR(n, 81, 0.18, 0.94);
    var ww = ws * hR(n, 83, 0.30, 0.64);
    var a = 0.12 + 0.20 * h01(n * 3.1 + 5);
    rec('wave', n, x, 0.16, yy);
    ctx.strokeStyle = 'rgba(255,240,222,' + a.toFixed(2) + ')';
    ctx.lineWidth = Math.max(1.1, sH * 0.011);
    ctx.beginPath();
    ctx.moveTo(x - ww * 0.5, yy);
    ctx.quadraticCurveTo(x, yy - sH * 0.022, x + ww * 0.5, yy);
    ctx.stroke();
  });

  /* 젖은 모래 + 거품 */
  var bg2 = ctx.createLinearGradient(0, seaBot, 0, groundY);
  bg2.addColorStop(0, '#f7e6c4');
  bg2.addColorStop(0.45, '#f2dcb2');
  bg2.addColorStop(1, '#ecd2a2');
  ctx.fillStyle = bg2;
  ctx.fillRect(0, seaBot, W, groundY - seaBot + 2);
  var fs = Math.max(34, sH * 0.36);
  eachSlot(fs, 1.06, function(x, n){
    var r = fs * hR(n, 87, 0.28, 0.62);
    rec('foam', n, x, 1.06, r);
    ctx.fillStyle = 'rgba(255,252,244,0.55)';
    ctx.beginPath(); ctx.ellipse(x, seaBot + 2, r, Math.max(1.4, sH * 0.022), 0, 0, TAU); ctx.fill();
  });
  var ds = Math.max(30, sH * 0.30);
  ctx.strokeStyle = 'rgba(120,140,96,0.55)';
  ctx.lineWidth = Math.max(1.4, sH * 0.012);
  ctx.beginPath();
  eachSlot(ds, 0.9, function(x, n){
    var hh = sH * hR(n, 89, 0.045, 0.13);
    rec('dune', n, x, 0.9, hh);
    ctx.moveTo(x, groundY - sH * 0.02);
    ctx.quadraticCurveTo(x - 2, groundY - hh * 0.8, x - 4, groundY - hh);
    ctx.moveTo(x + 3, groundY - sH * 0.02);
    ctx.quadraticCurveTo(x + 5, groundY - hh * 0.7, x + 8, groundY - hh * 0.85);
  });
  ctx.stroke();
}

/* ---------- FIELD: 별빛 야간 도심 ---------- */
function drawFieldNight(){
  var gg = ctx.createLinearGradient(0, horizonY, 0, groundY);
  gg.addColorStop(0, '#202a3a');
  gg.addColorStop(0.5, '#1a2432');
  gg.addColorStop(1, '#141c28');
  ctx.fillStyle = gg;
  ctx.fillRect(0, horizonY, W, groundY - horizonY + 2);

  /* 은은한 가로등 불빛 웅덩이 */
  var ls = Math.max(180, sH * 1.6);
  eachSlot(ls, 0.5, function(x, n){
    var g2 = ctx.createRadialGradient(x, groundY - sH * 0.02, sH * 0.05, x, groundY - sH * 0.02, sH * 0.85);
    g2.addColorStop(0, 'rgba(255,206,132,0.16)');
    g2.addColorStop(1, 'rgba(255,206,132,0)');
    rec('lampGlow', n, x, 0.5, 1);
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.ellipse(x, groundY - sH * 0.02, sH * 0.9, sH * 0.30, 0, 0, TAU); ctx.fill();
  });

  /* 잔디 결 */
  var gs = Math.max(40, sH * 0.40);
  ctx.strokeStyle = 'rgba(96,142,104,0.20)';
  ctx.lineWidth = Math.max(1.3, sH * 0.011);
  ctx.beginPath();
  eachSlot(gs, 0.92, function(x, n){
    for (var j = 0; j < 3; j++){
      var gy = horizonY + sH * (0.20 + j * 0.20) + hR(n, j + 3, -0.03, 0.03) * sH;
      var gx = x + hR(n, j + 7, -gs * 0.34, gs * 0.34);
      rec('tuft', n * 10 + j, gx, 0.92, j);
      ctx.moveTo(gx, gy);
      ctx.quadraticCurveTo(gx + 3, gy - sH * 0.05, gx + 6, gy - sH * 0.075);
    }
  });
  ctx.stroke();

  var hz = ctx.createLinearGradient(0, horizonY, 0, horizonY + H * 0.09);
  hz.addColorStop(0, 'rgba(255,188,120,0.16)');
  hz.addColorStop(1, 'rgba(255,188,120,0)');
  ctx.fillStyle = hz;
  ctx.fillRect(0, horizonY, W, H * 0.09);
}

/* ---------- FIELD: 무지개 구름 ---------- */
function drawFieldSky(){
  var gg = ctx.createLinearGradient(0, horizonY, 0, groundY);
  gg.addColorStop(0, '#e9d8f6');
  gg.addColorStop(0.45, '#f4e2f8');
  gg.addColorStop(1, '#fbe9f8');
  ctx.fillStyle = gg;
  ctx.fillRect(0, horizonY, W, groundY - horizonY + 2);

  var cs = Math.max(70, sH * 0.66);
  eachSlot(cs, 0.55, function(x, n){
    var r = cs * hR(n, 171, 0.30, 0.62);
    var y = horizonY + sH * hR(n, 173, 0.10, 0.55);
    rec('cloudField', n, x, 0.55, r);
    drawCloudTint(x, y, r, 'rgba(255,255,255,0.52)', 0.75);
  });

  var ss = Math.max(44, sH * 0.42);
  eachSlot(ss, 0.85, function(x, n){
    var y = horizonY + sH * hR(n, 175, 0.15, 0.85);
    var a = 0.18 + 0.32 * Math.abs(Math.sin(world.time * 1.5 + n));
    rec('fieldSpark', n, x, 0.85, 1);
    ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(x, y, Math.max(1, sH * 0.012), 0, TAU); ctx.fill();
  });
}

/* ---------- FAR DECOR: 노을 해변 (야자수 실루엣) ---------- */
function drawFarBeach(){
  var base = groundY - sH * 0.01;
  var spacing = Math.max(150, sH * 2.15);
  eachSlot(spacing, 0.5, function(x, n){
    var slot = ((n % 4) + 4) % 4;
    var fx = x + spacing * hR(n, 17, 0.10, 0.55);
    rec('farBeach', n, fx, 0.5, slot);
    if (slot === 1){
      /* 해변 파라솔 실루엣 */
      var ph = sH * 0.86;
      ctx.strokeStyle = 'rgba(64,48,70,0.9)';
      ctx.lineWidth = Math.max(2, sH * 0.018);
      ctx.beginPath(); ctx.moveTo(fx, base); ctx.lineTo(fx, base - ph); ctx.stroke();
      ctx.fillStyle = 'rgba(214,132,120,0.55)';
      ctx.beginPath();
      ctx.moveTo(fx - ph * 0.42, base - ph * 0.78);
      ctx.lineTo(fx + ph * 0.42, base - ph * 0.78);
      ctx.quadraticCurveTo(fx, base - ph * 1.02, fx - ph * 0.42, base - ph * 0.78);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,226,206,0.45)';
      ctx.lineWidth = Math.max(1.4, sH * 0.012);
      for (var s2 = -1; s2 <= 1; s2 += 2){
        ctx.beginPath();
        ctx.moveTo(fx + s2 * ph * 0.20, base - ph * 0.98);
        ctx.lineTo(fx + s2 * ph * 0.36, base - ph * 0.79);
        ctx.stroke();
      }
    } else if (slot === 3){
      drawPalm(fx, base, sH * hR(n, 23, 0.80, 1.05), n);
    } else {
      /* 낮은 모래 언덕 */
      var r = sH * hR(n, 121, 0.16, 0.30);
      ctx.fillStyle = 'rgba(238,206,160,0.75)';
      ctx.beginPath(); ctx.ellipse(fx, base, r * 1.8, r * 0.55, 0, Math.PI, TAU); ctx.fill();
    }
  });
  /* 풀숲 대신 모래 언덕 결 */
  var ds = Math.max(46, sH * 0.46);
  eachSlot(ds, 0.92, function(x, n){
    var r = ds * hR(n, 127, 0.22, 0.50);
    rec('dune2', n, x, 0.92, r);
    ctx.fillStyle = 'rgba(233,201,156,0.55)';
    ctx.beginPath(); ctx.ellipse(x, groundY - sH * 0.02, r, r * 0.34, 0, Math.PI, TAU); ctx.fill();
  });
}

/* ---------- FAR DECOR: 별빛 도심 (빌딩 + 가로등) ---------- */
function drawFarNight(){
  var base = groundY - sH * 0.01;
  var bs = Math.max(110, sH * 1.02);
  eachSlot(bs, 0.28, function(x, n){
    var bw = bs * hR(n, 131, 0.55, 1.05);
    var bh = sH * hR(n, 133, 0.75, 2.35);
    rec('building', n, x, 0.28, bh);
    drawBuilding(x, base, bw, bh, n);
  });
  /* 가까운 가로등 */
  var spacing = Math.max(190, sH * 1.95);
  eachSlot(spacing, 0.48, function(x, n){
    var fx = x + spacing * hR(n, 17, 0.10, 0.62);
    rec('farMidNight', n, fx, 0.48, n % 3);
    if (n % 3 === 0) drawLamp(fx, base, sH * 0.92);
    else if (n % 3 === 1){
      /* 낮은 담장 */
      ctx.fillStyle = 'rgba(42,50,66,0.95)';
      ctx.fillRect(fx - sH * 0.4, base - sH * 0.20, sH * 0.8, sH * 0.20);
      ctx.fillStyle = 'rgba(96,110,132,0.5)';
      ctx.fillRect(fx - sH * 0.4, base - sH * 0.21, sH * 0.8, sH * 0.02);
    } else {
      /* 관목 */
      var r = sH * 0.20;
      ctx.fillStyle = '#24382a';
      ctx.beginPath(); ctx.arc(fx, base - r * 0.8, r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(78,132,88,0.45)';
      ctx.beginPath(); ctx.arc(fx - r * 0.3, base - r * 1.15, r * 0.5, 0, TAU); ctx.fill();
    }
  });
  /* 반딧불 */
  var fs2 = Math.max(70, sH * 0.62);
  eachSlot(fs2, 0.7, function(x, n){

    rec('firefly', n, x, 0.7, 1);
    var fg = ctx.createRadialGradient(x, y, 1, x, y, Math.max(3, sH * 0.045));
    fg.addColorStop(0, 'rgba(255,238,150,' + a.toFixed(2) + ')');
    fg.addColorStop(1, 'rgba(255,238,150,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(x, y, Math.max(3, sH * 0.045), 0, TAU); ctx.fill();
  });
}

/* ---------- FAR DECOR: 무지개 구름 (구름 언덕 + 구슬) ---------- */
function drawFarSky(){
  var base = groundY - sH * 0.01;

/* ---------- PATH: 노을 해변 모래길 ---------- */
function drawPathBeach(){
  var pathTop = groundY - sH * 0.09;
  var pg = ctx.createLinearGradient(0, pathTop, 0, H);
  pg.addColorStop(0, '#fbeccd');
  pg.addColorStop(0.35, '#f6e0b8');
  pg.addColorStop(1, '#eccf9f');
  ctx.fillStyle = pg;
  ctx.fillRect(0, pathTop, W, H - pathTop);

  ctx.fillStyle = 'rgba(255,252,240,0.85)';
  ctx.fillRect(0, pathTop - sH * 0.022, W, sH * 0.022);

  /* 조약돌 + 조개 */
  var ps2 = Math.max(58, sH * 0.60);
  eachSlot(ps2, 1.0, function(px2, n){
    var yy = groundY + sH * hR(n, 37, 0.12, 0.55);
    rec('stones', n, px2, 1.0, yy);
    ctx.fillStyle = 'rgba(255,250,232,0.55)';
    ctx.beginPath(); ctx.ellipse(px2 + sH * 0.1, yy, sH * 0.05, sH * 0.015, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(196,158,112,0.30)';
    ctx.beginPath(); ctx.ellipse(px2 + sH * 0.34, yy + sH * 0.10, sH * 0.038, sH * 0.012, 0, 0, TAU); ctx.fill();
    if (n % 4 === 1){
      /* 불가사리 */
      ctx.save();
      ctx.translate(px2 + sH * 0.62, yy + sH * 0.02);
      ctx.fillStyle = 'rgba(236,140,110,0.65)';
      ctx.beginPath();
      for (var i = 0; i < 10; i++){
        var ang = -Math.PI / 2 + i * TAU / 10, rr = (i % 2 ? sH * 0.016 : sH * 0.034);
        var xx = Math.cos(ang) * rr, yy2 = Math.sin(ang) * rr * 0.6;
        if (i === 0) ctx.moveTo(xx, yy2); else ctx.lineTo(xx, yy2);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  });

  var fgs = Math.max(30, sH * 0.26);
  ctx.strokeStyle = 'rgba(226,196,150,0.75)';
  ctx.lineWidth = Math.max(2, sH * 0.016);
  ctx.beginPath();
  eachSlot(fgs, 1.25, function(gx2, n){
    var hh = sH * hR(n, 41, 0.07, 0.16);
    rec('fgGrass', n, gx2, 1.25, hh);
    ctx.moveTo(gx2, H + 6);
    ctx.quadraticCurveTo(gx2 - 3, H - hh * 0.6, gx2 - 8, H - hh);
    ctx.moveTo(gx2 + 7, H + 6);
    ctx.quadraticCurveTo(gx2 + 10, H - hh * 0.55, gx2 + 16, H - hh * 0.8);
  });
  ctx.stroke();
}

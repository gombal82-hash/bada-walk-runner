<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8fd0f2">
<title>바다 산책길 점프 러너</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:#8fd0f2;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;touch-action:none;
  }
  #stage{position:fixed;inset:0;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:calc(14px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
    background:radial-gradient(120% 90% at 50% 38%,rgba(255,247,225,.26),rgba(38,42,30,.58));
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    transition:opacity .28s ease, transform .28s ease;z-index:5;
  }
  .overlay.hidden{opacity:0;pointer-events:none;transform:scale(1.02);}
  .card{
    width:min(94vw,384px);max-height:94vh;overflow:auto;
    background:linear-gradient(180deg,rgba(255,252,242,.975),rgba(255,241,216,.96));
    border-radius:28px;padding:20px 20px 18px;text-align:center;
    box-shadow:0 26px 60px -18px rgba(35,30,12,.55),0 0 0 1px rgba(255,255,255,.7) inset;
    border:1px solid rgba(255,255,255,.8);
  }
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#ab8942;margin-bottom:7px;}
  h1{margin:0 0 2px;font-size:clamp(25px,7.8vw,33px);line-height:1.12;font-weight:900;color:#2f2a1c;letter-spacing:-.025em;}
  h1 span{background:linear-gradient(100deg,#e0703a,#e8a33a 62%,#c2512f);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #heroImg{
    display:block;height:clamp(128px,36vw,186px);width:auto;margin:4px auto 0;
    filter:drop-shadow(0 12px 16px rgba(70,55,25,.26));
    animation:bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-8px) rotate(1.2deg)}}
  .hint{margin:2px 0 15px;font-size:12.5px;line-height:1.75;color:#7d7156;font-weight:700;word-break:keep-all;}
  .hint b{color:#c2512f;}
  .hint i{font-style:normal;color:#b9a97f;}
  button{font-family:inherit;border:0;cursor:pointer;font-weight:800;-webkit-appearance:none;appearance:none;}
  .primary{
    display:block;width:100%;padding:15px 18px;border-radius:18px;font-size:17px;letter-spacing:-.01em;
    color:#fff8ef;background:linear-gradient(180deg,#f08a45,#d75f2e 70%,#c8512a);
    box-shadow:0 10px 20px -8px rgba(200,81,42,.85),0 1px 0 rgba(255,255,255,.45) inset;
    transition:transform .09s ease, box-shadow .12s ease;
  }
  .primary:active{transform:translateY(2px) scale(.988);box-shadow:0 4px 10px -6px rgba(200,81,42,.9);}
  .best{margin-top:12px;font-size:12.5px;color:#8a7c5d;font-weight:700;}
  .best b{color:#3a3324;font-size:14.5px;}
  .scoreBig{
    font-size:clamp(50px,15vw,70px);font-weight:900;line-height:1;color:#2f2a1c;letter-spacing:-.045em;
    margin:2px 0 8px;text-shadow:0 3px 0 rgba(255,255,255,.6);
  }
  .scoreRow{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:#8a7c5d;font-weight:700;margin-bottom:16px;}
  .scoreRow b{color:#3a3324;}
  .newbest{
    background:linear-gradient(180deg,#ffd58a,#f0a63c);color:#6a3c12;border-radius:999px;
    padding:4px 10px;font-size:11px;font-weight:900;
    box-shadow:0 4px 10px -5px rgba(190,120,20,.9);
  }
  .hidden{display:none !important;}
  #muteBtn{
    position:absolute;z-index:6;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));
    width:40px;height:40px;border-radius:50%;font-size:18px;line-height:1;
    color:#3d3521;background:rgba(255,252,240,.72);
    box-shadow:0 6px 14px -6px rgba(40,30,10,.5),0 0 0 1px rgba(255,255,255,.7) inset;
    display:flex;align-items:center;justify-content:center;
  }
  #muteBtn:active{transform:scale(.94);}

  /* short screens (landscape phones): keep the title card fully on screen */
  @media (max-height: 540px){
    .card{width:min(78vw,540px);padding:14px 18px 13px;border-radius:22px;}
    .eyebrow{display:none;}
    h1{font-size:22px;margin-bottom:2px;}
    #heroImg{height:88px;margin:0 auto;}
    .hint{font-size:11px;line-height:1.5;margin:0 0 9px;}
    .hint br{display:none;}
    .hint i{display:block;}
    .primary{padding:11px 16px;font-size:14.5px;border-radius:14px;}
    .best{margin-top:7px;font-size:11px;}
    .scoreBig{font-size:44px;margin:0 0 4px;}
    .scoreRow{margin-bottom:10px;font-size:12px;}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <button id="muteBtn" aria-label="소리 켜기/끄기">🔊</button>

  <div class="overlay" id="startScreen">
    <div class="card">
      <div class="eyebrow">산책길에서 만난 꼬마 영웅</div>
      <h1>바다 산책길<br><span>점프 러너</span></h1>
      <img id="heroImg" alt="바다">
      <p class="hint">
        화면을 <b>톡</b> 누르면 점프<br>
        공중에서 한 번 더 누르면 <b>더블 점프</b><br>
        <i>악마 간식을 먹으면 꼬마 악마 피버!</i>
      </p>
      <button id="startBtn" class="primary">달리기 시작</button>
      <div class="best">최고 점수 <b id="startBest">0</b></div>
    </div>
  </div>

  <div class="overlay hidden" id="overScreen">
    <div class="card">
      <div class="eyebrow">산책 끝!</div>
      <div class="scoreBig" id="overScore">0</div>
      <div class="scoreRow">
        <span>최고 <b id="overBest">0</b></span>
        <span id="newBestTag" class="newbest hidden">새 기록!</span>
      </div>
      <button id="againBtn" class="primary">한 번 더 달리기</button>
    </div>
  </div>
</div>

/* ---------- helpers ---------- */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function rand(a, b){ return a + Math.random() * (b - a); }
function irand(a, b){ return Math.floor(rand(a, b + 1)); }
function lerp(a, b, t){ return a + (b - a) * t; }
function pick(a){ return a[(Math.random() * a.length) | 0]; }
function fmt(n){ return Math.round(n).toLocaleString('ko-KR'); }

/* ---------- canvas & layout ---------- */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d', { alpha: false });
var W = 360, H = 640, DPR = 1;
var horizonY = 330, groundY = 490, sH = 130, speedK = 1;

function layout(){
  W = Math.max(240, window.innerWidth);
  H = Math.max(320, window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  sH = clamp(H * 0.3, 84, 178);
  groundY = H * 0.80;
  horizonY = H * 0.575;
  speedK = clamp(W / 470, 0.8, 1.5);

  var p = world.player;
  p.x = Math.max(W * 0.225, 76);
  if (p.onGround) p.y = groundY;
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', function(){ setTimeout(layout, 160); });

/* ---------- sprites ---------- */
var sprites = { run: null, devil: null };
function loadSprites(cb){
  var keys = ['run', 'devil'], n = 0;
  keys.forEach(function(k){
    var im = new Image();
    im.onload = done;
    im.onerror = done;
    im.src = SPR[k];
    sprites[k] = im;
  });
  function done(){ if (++n === keys.length) cb(); }
}

  var ac = null, master = null, noise = null, muted = false;
  try { muted = localStorage.getItem('badaRunnerMuted') === '1'; } catch(e){}

  function ensure(){
    if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.7;
      master.connect(ac.destination);
      var len = Math.floor(ac.sampleRate * 0.4);
      noise = ac.createBuffer(1, len, ac.sampleRate);
      var d = noise.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch(e){ ac = null; }
    return ac;
  }

  function tone(o){
    var c = ensure(); if (!c || muted) return;
    var t0 = c.currentTime + (o.delay || 0), dur = o.dur || 0.15;
    var g = c.createGain(), osc = c.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, t0);
    if (o.f1 && osc.frequency.exponentialRampToValueAtTime){
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t0 + dur);
    }
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.18, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }

  function hiss(o){
    var c = ensure(); if (!c || muted) return;
    var t0 = c.currentTime + (o.delay || 0), dur = o.dur || 0.25;
    var src = c.createBufferSource(); src.buffer = noise;
    var f = c.createBiquadFilter();
    f.type = o.filter || 'bandpass';
    f.frequency.setValueAtTime(o.f0 || 900, t0);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(60, o.f1), t0 + dur);
    f.Q.value = o.q || 1.1;
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.16, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  }

  return {
    unlock: function(){ ensure(); },
    isMuted: function(){ return muted; },
    toggle: function(){
      muted = !muted;
      try { localStorage.setItem('badaRunnerMuted', muted ? '1' : '0'); } catch(e){}
      if (!muted) ensure();
      return muted;
    },
    jump: function(){
      tone({ type: 'square', f0: 380, f1: 720, dur: 0.12, gain: 0.085 });
      hiss({ f0: 1500, f1: 2800, dur: 0.07, gain: 0.045, filter: 'highpass' });
    },
    dbljump: function(){
      tone({ type: 'triangle', f0: 620, f1: 1180, dur: 0.16, gain: 0.12 });
      tone({ type: 'sine', f0: 1240, f1: 1720, dur: 0.14, gain: 0.06, delay: 0.04 });
    },
    pickup: function(step){
      var base = 880 * Math.pow(1.0595, Math.min(step || 0, 10));
      tone({ type: 'sine', f0: base, dur: 0.075, gain: 0.13 });
      tone({ type: 'sine', f0: base * 1.5, dur: 0.10, gain: 0.09, delay: 0.055 });
    },
    golden: function(){
      tone({ type: 'triangle', f0: 784, dur: 0.11, gain: 0.13 });
      tone({ type: 'triangle', f0: 1046, dur: 0.12, gain: 0.12, delay: 0.07 });
      tone({ type: 'sine', f0: 1568, dur: 0.22, gain: 0.10, delay: 0.14 });
    },
    fever: function(){
      tone({ type: 'sawtooth', f0: 420, f1: 92, dur: 0.55, gain: 0.14 });
      tone({ type: 'square', f0: 210, f1: 60, dur: 0.6, gain: 0.07, delay: 0.04 });
      hiss({ f0: 2600, f1: 400, dur: 0.5, gain: 0.09 });
    },
    smash: function(){
      hiss({ f0: 1800, f1: 320, dur: 0.18, gain: 0.12 });
      tone({ type: 'square', f0: 260, f1: 120, dur: 0.12, gain: 0.06 });
    },
    hit: function(){
      hiss({ f0: 700, f1: 120, dur: 0.32, gain: 0.19, filter: 'lowpass', q: 0.7 });
      tone({ type: 'sine', f0: 180, f1: 62, dur: 0.30, gain: 0.18 });
    },
    over: function(){
      tone({ type: 'triangle', f0: 523, dur: 0.16, gain: 0.12 });
      tone({ type: 'triangle', f0: 392, dur: 0.18, gain: 0.12, delay: 0.15 });
      tone({ type: 'triangle', f0: 262, dur: 0.36, gain: 0.14, delay: 0.32 });
    }
  };
})();

/* ---------- world ---------- */
var world = {
  mode: 'ready',
  time: 0,
  score: 0,
  best: 0,
  lives: 3,
  combo: 0,
  comboT: 0,
  fever: 0,
  feverMax: 6,
  invuln: 0,
  shake: 0,
  dist: 0,
  speed: 340,
  spawnT: 1.3,
  itemT: 2.4,
  devilT: 14,
  squash: 0,
  flash: 0,
  god: false,
  hint: 0,
  prints: [],
  hitLog: [],
  objects: [],
  parts: [],
  pops: [],
  player: { x: 90, y: 0, vy: 0, onGround: true, jumps: 0, dead: false }
};
try { world.best = parseInt(localStorage.getItem('badaRunnerBest') || '0', 10) || 0; } catch(e){}

function resetGame(){
  world.time = 0;
  world.score = 0;
  world.lives = 3;
  world.combo = 0;
  world.comboT = 0;
  world.fever = 0;
  world.invuln = 0;
  world.shake = 0;
  world.dist = 0;
  world.speed = 330 * speedK;
  world.spawnT = 2.0;
  world.itemT = 1.9;
  world.devilT = 12;
  world.squash = 0;
  world.flash = 0;
  world.hint = 4.5;
  world.prints.length = 0;
  world.hitLog.length = 0;
  world.objects.length = 0;
  world.parts.length = 0;
  world.pops.length = 0;
  var p = world.player;
  p.y = groundY; p.vy = 0; p.onGround = true; p.jumps = 0; p.dead = false;
  p.x = Math.max(W * 0.225, 76);
}

/* ---------- input ---------- */
function press(){
  Sound.unlock();
  if (world.mode === 'ready') { startGame(); return; }
  if (world.mode === 'over') { if (world.time > 0.6) startGame(); return; }
  jump();
}

function jump(){
  var p = world.player;
  if (p.dead) return;
  if (p.jumps < 2) {
    if (p.jumps === 0) {
      p.vy = -5.0 * sH;
      Sound.jump();
      dust(p.x, p.y, 6, 0.55);
      world.squash = -0.5;
    } else {
      p.vy = -4.4 * sH;
      Sound.dbljump();
      world.squash = -0.65;
      burst(p.x, p.y - sH * 0.5, 12, ['#fff3c4', '#ffd166', '#ffb703']);
    }
    p.jumps++;
    p.onGround = false;
  }
}

function onTap(e){
  if (e.target && e.target.closest && e.target.closest('button')) return;
  if (e.cancelable) e.preventDefault();
  press();
}
window.addEventListener('pointerdown', onTap, { passive: false });
if (!window.PointerEvent) {
  window.addEventListener('touchstart', onTap, { passive: false });
  window.addEventListener('mousedown', onTap, { passive: false });
}

window.addEventListener('keydown', function(e){
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.key === ' ') {
    e.preventDefault();
    press();
  }
});
document.addEventListener('contextmenu', function(e){
  if (e.target && e.target.id === 'game') e.preventDefault();
});

/* ---------- particles ---------- */
function addPart(o){ if (world.parts.length < 340) world.parts.push(o); }

function burst(x, y, n, colors){
  for (var i = 0; i < n; i++){
    var a = rand(0, TAU), sp = rand(0.6, 2.4) * sH;
    addPart({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - sH * 0.6,
      life: rand(0.35, 0.72), max: 0.75, r: rand(2, 4.6) * (sH / 150),
      c: pick(colors), grav: 1.7, kind: 'dot', rot: rand(0, TAU), vr: rand(-9, 9)
    });
  }
}

function dust(x, y, n, power){
  for (var i = 0; i < n; i++){
    addPart({
      x: x + rand(-sH * 0.15, sH * 0.12), y: y - rand(0, sH * 0.04),
      vx: rand(-1.3, -0.1) * sH * power, vy: rand(-0.75, -0.05) * sH * power,
      life: rand(0.3, 0.55), max: 0.55, r: rand(2.4, 5) * (sH / 150),
      c: 'rgba(236,220,188,0.75)', grav: 0.7, kind: 'smoke', rot: 0, vr: 0
    });
  }
}

function flame(x, y){
  addPart({
    x: x + rand(-sH * 0.22, sH * 0.12), y: y - rand(0, sH * 0.85),
    vx: rand(-1.4, -0.6) * sH, vy: rand(-0.9, -0.2) * sH,
    life: rand(0.2, 0.42), max: 0.42, r: rand(2.5, 5.5) * (sH / 150),
    c: pick(['rgba(255,150,60,0.75)', 'rgba(255,196,90,0.7)', 'rgba(232,70,40,0.7)']),
    grav: -0.25, kind: 'smoke', rot: 0, vr: 0
  });
}

function pop(x, y, text, color){
  world.pops.push({ x: x, y: y, text: text, c: color || '#3a3324', life: 0.85, max: 0.85, vy: -1.05 * sH });
}

/* ---------- spawning ---------- */
function addItem(kind, x, y){
  world.objects.push({
    type: 'item', kind: kind, x: x, y: y,
    w: sH * (kind === 'gold' ? 0.30 : kind === 'devil' ? 0.38 : 0.29),
    h: sH * (kind === 'gold' ? 0.30 : kind === 'devil' ? 0.38 : 0.24),
    seed: Math.random() * 100, dead: false
  });
}

function spawnObstacle(){
  var t = world.time;
  var kinds = ['puddle', 'leaf'];
  if (t > 7) kinds.push('hydrant');
  if (t > 15) kinds.push('bush');
  if (t > 26) kinds.push('hydrant', 'bush');

  var kind = pick(kinds);
  var x = W + sH * 0.9;
  var w, h;
  if (kind === 'puddle') { w = sH * (0.58 + rand(0, 0.2)); h = sH * 0.17; }
  else if (kind === 'leaf') { w = sH * 0.64; h = sH * 0.30; }
  else if (kind === 'hydrant') { w = sH * 0.38; h = sH * 0.50; }
  else { w = sH * 0.74; h = sH * 0.52; }

  world.objects.push({ type: 'obs', kind: kind, x: x, w: w, h: h, seed: Math.random() * 100, dead: false });

  if (t > 12 && Math.random() < 0.22) {
    var gap = sH * (1.55 + Math.random() * 0.5);
    var k2 = pick(['leaf', 'hydrant']);
    world.objects.push({
      type: 'obs', kind: k2, x: x + gap + w * 0.5,
      w: k2 === 'leaf' ? sH * 0.6 : sH * 0.4,
      h: k2 === 'leaf' ? sH * 0.28 : sH * 0.54,
      seed: Math.random() * 100, dead: false
    });
  }

  if (Math.random() < 0.72) {
    var n = irand(1, 3);
    var arcH = sH * rand(0.82, 1.2);
    for (var i = 0; i < n; i++){
      addItem('bone', x + (i - (n - 1) / 2) * sH * 0.5,
        groundY - arcH - Math.sin((i / Math.max(1, n - 1)) * Math.PI) * sH * 0.26);
    }
    if (Math.random() < 0.16){
      addItem('gold', x + rand(-sH * 0.4, sH * 0.4), groundY - arcH - sH * (0.5 + Math.random() * 0.35));
    }
  }
}

function spawnItemRow(){
  var y = groundY - sH * rand(0.72, 1.15);
  var n = irand(2, 4);
  var kind = Math.random() < 0.22 ? 'gold' : 'bone';
  for (var i = 0; i < n; i++){
    addItem(kind, W + sH * 0.9 + i * sH * 0.54, y - Math.sin(i / Math.max(1, n - 1) * Math.PI) * sH * 0.2);
  }
}

/* ---------- flow ---------- */
function startGame(){
  resetGame();
  world.mode = 'playing';
  hide(startScreen);
  hide(overScreen);
  Sound.unlock();
}

function gameOver(){
  var p = world.player;
  p.dead = true;
  world.mode = 'over';
  world.time = 0;
  Sound.over();
  var isNew = world.score > world.best;
  if (isNew){
    world.best = Math.round(world.score);
    try { localStorage.setItem('badaRunnerBest', String(world.best)); } catch(e){}
  }
  document.getElementById('overScore').textContent = fmt(world.score);
  document.getElementById('overBest').textContent = fmt(world.best);
  document.getElementById('newBestTag').classList.toggle('hidden', !isNew);
  document.getElementById('overScore').style.color = isNew ? '#c2512f' : '#2f2a1c';
  show(overScreen);
  burst(p.x, p.y - sH * 0.5, 16, ['#ffd166', '#ff8a5c', '#fff1c9']);
  world.shake = 15;
}

var startScreen, overScreen;
function show(el){ el.classList.remove('hidden'); }
function hide(el){ el.classList.add('hidden'); }

/* ---------- update ---------- */
function update(dt){
  var p = world.player;

  world.dist += (world.mode === 'playing' ? world.speed : 120 * speedK) * dt;

  if (world.mode === 'playing') {
    world.time += dt;
    world.speed = (325 + Math.min(world.time, 95) * 2.9) * speedK;
    world.score += dt * world.speed * 0.055 * (world.fever > 0 ? 2 : 1);

    if (world.fever > 0) {
      world.fever -= dt;
      if (Math.random() < 0.8) flame(p.x - sH * 0.1, p.y);
      if (world.fever <= 0) {
        world.fever = 0;
        burst(p.x, p.y - sH * 0.5, 14, ['#ffb703', '#ff6b35', '#fff3c4']);
        Sound.pickup(3);
      }
    }
    if (world.invuln > 0) world.invuln -= dt;
    if (world.comboT > 0) { world.comboT -= dt; if (world.comboT <= 0) world.combo = 0; }
    if (world.hint > 0) world.hint -= dt;

    // physics
    var g = 11.6 * sH;
    if (!p.onGround) {
      p.vy += g * dt;
      p.y += p.vy * dt;
      if (p.y >= groundY) {
        p.y = groundY; p.vy = 0; p.onGround = true; p.jumps = 0;
        world.squash = 0.5;
        dust(p.x, groundY, 5, 0.45);
      }
    }
    world.squash *= Math.pow(0.0016, dt);

    // running dust
    if (p.onGround && Math.random() < dt * 14) dust(p.x - sH * 0.2, p.y, 1, 0.32);

    // paw prints on the path
    if (Math.random() < dt * 4) {
      world.prints.push({ x: W + sH * 0.2, y: groundY + sH * rand(0.1, 0.3), s: sH * rand(0.05, 0.07), side: Math.random() < 0.5 ? -1 : 1, a: 0.16 });
      if (world.prints.length > 26) world.prints.shift();
    }
    for (var pi = world.prints.length - 1; pi >= 0; pi--) {
      var pr = world.prints[pi];
      pr.x -= world.speed * dt;
      if (pr.x < -sH * 0.3) world.prints.splice(pi, 1);
    }

    // spawning
    world.spawnT -= dt;
    if (world.spawnT <= 0) {
      spawnObstacle();
      var baseGap = lerp(1.34, 0.74, clamp(world.time / 80, 0, 1));
      var reaction = (W * 0.6) / world.speed;
      world.spawnT = Math.max(baseGap, reaction) * rand(0.95, 1.2);
    }

    world.itemT -= dt;
    if (world.itemT <= 0) { spawnItemRow(); world.itemT = rand(3.2, 5.6); }

    world.devilT -= dt;
    if (world.devilT <= 0 && world.fever <= 0) {
      addItem('devil', W + sH * 0.9, groundY - sH * rand(0.95, 1.35));
      world.devilT = rand(16, 23);
    }

    // objects
    var move = world.speed * dt * (world.fever > 0 ? 1.22 : 1);
    var i, o;
    for (i = 0; i < world.objects.length; i++) {
      o = world.objects[i];
      o.x -= move;
      if (o.x < -sH * 2.2) o.dead = true;
    }

    // collisions
    var pb = { l: p.x - sH * 0.19, r: p.x + sH * 0.19, t: p.y - sH * 0.84, b: p.y - sH * 0.04 };

    for (i = 0; i < world.objects.length; i++) {
      o = world.objects[i];
      if (o.dead) continue;

      if (o.type === 'item') {
        var reach = sH * 0.40 + Math.max(o.w, o.h) * 0.35;
        if (Math.abs(o.x - p.x) < reach && o.y > pb.t - reach * 0.9 && o.y < pb.b + reach * 0.6) {
          collect(o);
        }
        continue;
      }

      var hw2 = o.kind === 'puddle' ? 0.36 : 0.42;
      var ol = o.x - o.w * hw2, orr = o.x + o.w * hw2;
      var ot = groundY - o.h, ob = groundY + sH * 0.03;
      if (pb.r > ol && pb.l < orr && pb.b > ot && pb.t < ob) {
        if (world.fever > 0) smash(o);
        else if (world.invuln <= 0) hurt(o);
      }
    }
    world.objects = world.objects.filter(function(x){ return !x.dead; });
    updateParts(dt);
  } else {
    updateParts(dt);
    p.y = groundY;
    world.squash *= Math.pow(0.0016, dt);
    if (world.mode === 'over') world.time += dt;
  }

  if (world.shake > 0) world.shake = Math.max(0, world.shake - dt * 46);
  if (world.flash > 0) world.flash = Math.max(0, world.flash - dt * 2.4);
}

function updateParts(dt){
  var i, q;
  for (i = world.parts.length - 1; i >= 0; i--) {
    q = world.parts[i];
    q.life -= dt;
    if (q.life <= 0) { world.parts.splice(i, 1); continue; }
    q.vy += q.grav * sH * dt;
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    q.rot += q.vr * dt;
    if (q.kind === 'smoke') q.r += dt * sH * 0.07;
  }
  for (i = world.pops.length - 1; i >= 0; i--) {
    q = world.pops[i];
    q.life -= dt;
    if (q.life <= 0) { world.pops.splice(i, 1); continue; }
    q.y += q.vy * dt;
    q.vy *= 0.94;
  }
}

function comboMult(){ return Math.min(5, 1 + Math.floor(world.combo / 4)); }

function collect(o){
  o.dead = true;
  if (o.kind === 'devil') { startFever(o.x, o.y); return; }
  world.combo++;
  world.comboT = 3.6;
  var mult = comboMult();
  var gain = (o.kind === 'gold' ? 50 : 10) * mult;
  world.score += gain;
  if (o.kind === 'gold') {
    Sound.golden();
    burst(o.x, o.y, 14, ['#ffe89a', '#ffc93c', '#fff8dc']);
    pop(o.x, o.y - sH * 0.1, '+' + gain, '#c98a12');
    world.flash = 0.5;
  } else {
    Sound.pickup(world.combo);
    burst(o.x, o.y, 6, ['#fff4d6', '#ffd9a0', '#f7c873']);
    pop(o.x, o.y - sH * 0.08, '+' + gain, '#8a6a2a');
  }
  if (mult > 1) pop(o.x + sH * 0.24, o.y - sH * 0.3, 'x' + mult, '#e0703a');
}

function startFever(x, y){
  world.fever = world.feverMax;
  world.invuln = 0;
  world.score += 20;
  world.shake = 13;
  world.flash = 0.85;
  Sound.fever();
  burst(x, y, 24, ['#ff4d3d', '#ff8a3d', '#ffd166', '#7a1f1f']);
  pop(x, y - sH * 0.18, '피버!', '#d63a22');
}

function smash(o){
  o.dead = true;
  world.score += 25;
  world.shake = Math.max(world.shake, 7);
  Sound.smash();
  var colors = o.kind === 'puddle' ? ['#8fd3ff', '#c9ecff', '#5fa8d3']
    : o.kind === 'hydrant' ? ['#e8563f', '#f0a08a', '#c9c2b6']
    : o.kind === 'bush' ? ['#4f8a3d', '#7cb342', '#2f5e28']
    : ['#d98324', '#e8b04b', '#a85a1f'];
  burst(o.x, groundY - o.h * 0.5, 15, colors);
  pop(o.x, groundY - o.h - sH * 0.08, '+25', '#d63a22');
}

function hurt(o){
  var p = world.player;
  if (world.god) return;
  world.hitLog.push({ t: +world.time.toFixed(2), kind: o.kind, w: Math.round(o.w), h: Math.round(o.h),
    px: Math.round(p.x), ox: Math.round(o.x), py: Math.round(p.y), ground: Math.round(groundY) });
  world.lives--;
  world.combo = 0;
  world.invuln = 1.5;
  world.shake = 20;
  world.flash = 0.65;
  Sound.hit();
  dust(p.x, groundY, 9, 0.85);
  burst(p.x, p.y - sH * 0.45, 11, ['#ffd166', '#ff8a5c', '#ffffff']);
  if (world.lives <= 0) gameOver();
  else pop(p.x, p.y - sH * 0.92, '앗!', '#c2512f');
  void o;
}

/* =================================================================
   RENDER
   ================================================================= */
function render(){
  var shakeX = 0, shakeY = 0;
  if (world.shake > 0.2) {
    shakeX = rand(-world.shake, world.shake) * 0.45;
    shakeY = rand(-world.shake, world.shake) * 0.45;
  }
  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawSky();
  drawHills();
  drawGrassField();
  drawFar();
  drawPath();
  drawPrints();
  drawParticles(false);

  var i;
  for (i = 0; i < world.objects.length; i++) {
    if (world.objects[i].type === 'obs') drawObstacle(world.objects[i]);
  }
  for (i = 0; i < world.objects.length; i++) {
    if (world.objects[i].type === 'item' && !world.objects[i].dead) drawItemShadow(world.objects[i]);
  }

  drawPlayer();

  for (i = 0; i < world.objects.length; i++) {
    if (world.objects[i].type === 'item' && !world.objects[i].dead) drawItem(world.objects[i]);
  }

  drawParticles(true);
  drawPops();
  ctx.restore();

  drawHud();
  drawVignette();
}

/* ---------- sky ---------- */
function drawSky(){
  var g = ctx.createLinearGradient(0, 0, 0, horizonY + H * 0.18);
  g.addColorStop(0, '#6fc2ec');
  g.addColorStop(0.35, '#a9ddf5');
  g.addColorStop(0.68, '#ffeacb');
  g.addColorStop(1, '#ffe4c0');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, horizonY + H * 0.2);

  var sx = W * 0.77, sy = H * 0.155, sr = Math.min(W, H) * 0.085;
  var sg = ctx.createRadialGradient(sx, sy, sr * 0.2, sx, sy, sr * 3.4);
  sg.addColorStop(0, 'rgba(255,248,214,0.95)');
  sg.addColorStop(0.34, 'rgba(255,238,180,0.38)');
  sg.addColorStop(1, 'rgba(255,238,180,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, sr * 3.4, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,253,238,0.95)';
  ctx.beginPath(); ctx.arc(sx, sy, sr * 0.6, 0, TAU); ctx.fill();

  var cl = [[0.10, 0.10, 1.0], [0.40, 0.055, 0.7], [0.66, 0.13, 0.85], [0.9, 0.05, 0.6]];
  var span = W + 280;
  for (var i = 0; i < cl.length; i++) {
    var bx = ((cl[i][0] * W - world.dist * 0.04 - i * 50) % span + span) % span - 140;
    drawCloud(bx, H * cl[i][1], Math.min(W, H) * 0.10 * cl[i][2]);
  }

  // kite
  var kt = (world.dist * 0.012 + W * 0.12) % (W + 260) - 130;
  var ky = H * 0.30 + Math.sin(world.time * 0.9) * 10;
  ctx.save();
  ctx.translate(kt, ky);
  ctx.rotate(Math.sin(world.time * 0.7) * 0.12);
  ctx.fillStyle = '#f2a03d';
  ctx.beginPath();
  ctx.moveTo(0, -18); ctx.lineTo(13, 0); ctx.lineTo(0, 20); ctx.lineTo(-13, 0);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e4663a';
  ctx.beginPath();
  ctx.moveTo(0, -18); ctx.lineTo(13, 0); ctx.lineTo(0, 0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(90,70,40,0.45)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, 20);
  ctx.quadraticCurveTo(6 + Math.sin(world.time * 3) * 6, 44, -4 + Math.sin(world.time * 3) * 8, 70);
  ctx.stroke();
  ctx.restore();

  // birds
  for (var b = 0; b < 3; b++) {
    var t = world.time * 0.25 + b * 1.7;
    var bxp = ((W * 0.2 + t * 26 - world.dist * 0.02) % (W + 160) + W + 160) % (W + 160) - 80;
    var byp = H * (0.17 + b * 0.035) + Math.sin(t * 2) * 6;
    ctx.strokeStyle = 'rgba(70,86,96,0.42)';
    ctx.lineWidth = Math.max(1.4, sH * 0.014);
    ctx.beginPath();
    ctx.moveTo(bxp - 7, byp);
    ctx.quadraticCurveTo(bxp - 3, byp - 5, bxp, byp);
    ctx.quadraticCurveTo(bxp + 3, byp - 5, bxp + 7, byp);
    ctx.stroke();
  }
}

function drawCloud(x, y, r){
  ctx.save();
  ctx.globalAlpha = 0.84;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.arc(x + r * 0.95, y + r * 0.14, r * 0.76, 0, TAU);
  ctx.arc(x - r * 0.92, y + r * 0.18, r * 0.64, 0, TAU);
  ctx.arc(x + r * 0.28, y - r * 0.46, r * 0.68, 0, TAU);
  ctx.fill();
  ctx.restore();
}

/* ---------- distance ---------- */
function drawHills(){
  drawHillLayer(horizonY + H * 0.012, H * 0.075, '#b6dfc0', 0.07, 560);
  drawHillLayer(horizonY + H * 0.05, H * 0.055, '#9bd39c', 0.14, 400);
}

function drawFar(){
  var base = groundY - sH * 0.02;

  // ---- back row of soft trees (atmospheric, light) ----
  var bs = Math.max(170, sH * 1.35);
  var bo = (world.dist * 0.18) % bs;
  ctx.save();
  ctx.globalAlpha = 0.8;
  for (var bx = -bo - bs; bx < W + bs * 2; bx += bs) {
    var bi = Math.round((bx + bo) / bs);
    drawFarTree(bx + (bi % 2) * bs * 0.4, base - sH * 0.04, sH * (1.0 + ((bi * 7) % 5) / 14), false);
  }
  ctx.restore();

  // ---- mid row: trees and lamp posts standing on the verge ----
  var spacing = Math.max(260, sH * 2.15);
  var off = (world.dist * 0.4) % spacing;
  for (var x = -off - spacing; x < W + spacing * 2; x += spacing) {
    var idx = Math.round((x + off) / spacing);
    var fx = x + spacing * 0.4;
    var deep = base - sH * (0.03 + (((idx * 5) % 3)) * 0.05);
    if (((idx % 4) + 4) % 4 === 0) drawLamp(fx, base, sH * 0.95);
    else if (((idx % 4) + 4) % 4 === 2) drawBushPatch(fx, base, sH * 0.5);
    else drawFarTree(fx, deep, sH * (1.05 + ((idx * 11) % 5) / 16), true);
  }

  // ---- hedge along the path edge ----
  var hs = Math.max(46, sH * 0.36);
  var ho = (world.dist * 0.92) % hs;
  for (var hx = -ho - hs; hx < W + hs; hx += hs) {
    var hi = Math.round((hx + ho) / hs);
    var hr = hs * (0.42 + ((hi * 13) % 7) / 18);
    var hy = groundY - sH * 0.02;
    ctx.fillStyle = '#3a7439';
    ctx.beginPath(); ctx.arc(hx, hy - hr * 0.55, hr, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4b8b45';
    ctx.beginPath(); ctx.arc(hx - hr * 0.18, hy - hr * 0.85, hr * 0.72, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(126,186,110,0.55)';
    ctx.beginPath(); ctx.arc(hx - hr * 0.34, hy - hr * 1.05, hr * 0.3, 0, TAU); ctx.fill();
  }
}

function drawFarTree(x, baseY, h, dark){
  var trunkW = Math.max(3, h * 0.055);
  ctx.fillStyle = dark ? '#7d6145' : '#a2866a';
  ctx.fillRect(x - trunkW / 2, baseY - h * 0.5, trunkW, h * 0.5);
  var r = h * 0.31, cy = baseY - h * 0.64;
  ctx.save();
  var blobs = [[x, cy, r], [x - r * 0.78, cy + r * 0.38, r * 0.72], [x + r * 0.78, cy + r * 0.32, r * 0.68]];
  ctx.fillStyle = dark ? '#4b8c4b' : '#8cc98c';
  ctx.strokeStyle = dark ? 'rgba(28,66,34,0.3)' : 'rgba(60,110,70,0.16)';
  ctx.lineWidth = Math.max(1.4, h * 0.011);
  for (var bi2 = 0; bi2 < blobs.length; bi2++) {
    ctx.beginPath();
    ctx.arc(blobs[bi2][0], blobs[bi2][1], blobs[bi2][2], 0, TAU);
    ctx.fill();
    ctx.stroke();
  }
  ctx.fillStyle = dark ? '#65a95f' : '#a9dca6';
  ctx.beginPath(); ctx.arc(x - r * 0.30, cy - r * 0.32, r * 0.60, 0, TAU); ctx.fill();
  ctx.fillStyle = dark ? '#79bb6f' : '#bfe7ba';
  ctx.beginPath(); ctx.arc(x - r * 0.48, cy - r * 0.5, r * 0.28, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawBushPatch(x, baseY, h){
  for (var i = 0; i < 3; i++){
    var bx = x + (i - 1) * h * 0.5;
    var r = h * (0.34 + (i % 2) * 0.1);
    var g = ctx.createRadialGradient(bx - r * 0.3, baseY - h * 0.4 - r * 0.3, r * 0.15, bx, baseY - h * 0.4, r);
    g.addColorStop(0, '#79bd6c');
    g.addColorStop(1, '#428040');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(bx, baseY - h * 0.4, r, 0, TAU); ctx.fill();
  }
}

function drawLamp(x, baseY, h){
  var poleW = Math.max(2, h * 0.045);
  ctx.fillStyle = '#6f7a72';
  ctx.fillRect(x - poleW / 2, baseY - h, poleW, h);
  ctx.fillStyle = '#7f8a81';
  ctx.beginPath();
  ctx.ellipse(x, baseY, poleW * 2.4, poleW * 1.1, 0, 0, TAU);
  ctx.fill();
  // lamp head: small lantern with a warm glow
  var lw2 = h * 0.085, lh2 = h * 0.10;
  var lg = ctx.createRadialGradient(x, baseY - h - lh2 * 1.1, 1, x, baseY - h - lh2 * 1.1, h * 0.42);
  lg.addColorStop(0, 'rgba(255,231,155,0.55)');
  lg.addColorStop(1, 'rgba(255,231,155,0)');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.arc(x, baseY - h - lh2 * 1.1, h * 0.42, 0, TAU); ctx.fill();
  ctx.fillStyle = '#4d574f';
  ctx.beginPath();
  ctx.moveTo(x - lw2, baseY - h - lh2 * 2);
  ctx.lineTo(x, baseY - h - lh2 * 2.9);
  ctx.lineTo(x + lw2, baseY - h - lh2 * 2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5c665e';
  roundRect(x - lw2, baseY - h - lh2 * 2, lw2 * 2, lh2 * 1.5, lw2 * 0.5);
  ctx.fill();
  ctx.fillStyle = '#fff4c9';
  ctx.beginPath(); ctx.arc(x, baseY - h - lh2 * 1.25, lw2 * 0.72, 0, TAU); ctx.fill();
}

function drawHillLayer(baseY, amp, color, par, wave){
  var off = (world.dist * par) % wave;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (var x = 0; x <= W + 8; x += 8) {
    var t = (x + off) / wave * TAU;
    var y = baseY - Math.sin(t) * amp - Math.sin(t * 2.3 + 1.1) * amp * 0.32;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}

/* ---------- ground ---------- */
function drawGrassField(){
  var gg = ctx.createLinearGradient(0, horizonY, 0, groundY);
  gg.addColorStop(0, '#86c47c');
  gg.addColorStop(0.35, '#74b96c');
  gg.addColorStop(1, '#5aa257');
  ctx.fillStyle = gg;
  ctx.fillRect(0, horizonY, W, groundY - horizonY + 2);

  // mown stripes
  var sw = Math.max(70, sH * 0.8);
  var soff = (world.dist * 0.55) % (sw * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.055)';
  for (var sx2 = -soff; sx2 < W + sw * 2; sx2 += sw * 2) {
    ctx.fillRect(sx2, horizonY, sw, groundY - horizonY);
  }

  var hz = ctx.createLinearGradient(0, horizonY, 0, horizonY + H * 0.10);
  hz.addColorStop(0, 'rgba(255,247,224,0.34)');
  hz.addColorStop(1, 'rgba(255,247,224,0)');
  ctx.fillStyle = hz;
  ctx.fillRect(0, horizonY, W, H * 0.10);

  // grass tufts in the verge
  var gs = Math.max(46, sH * 0.4);
  var go = (world.dist * 0.9) % gs;
  ctx.strokeStyle = 'rgba(46,110,52,0.22)';
  ctx.lineWidth = Math.max(1.5, sH * 0.012);
  ctx.beginPath();
  for (var gy = horizonY + sH * 0.18; gy < groundY - 2; gy += sH * 0.2) {
    for (var gx = -go + ((gy * 11) % gs); gx < W + gs; gx += gs) {
      ctx.moveTo(gx, gy);
      ctx.quadraticCurveTo(gx + 3, gy - sH * 0.05, gx + 6, gy - sH * 0.08);
    }
  }
  ctx.stroke();
}

function drawPath(){
  // path
  var pg = ctx.createLinearGradient(0, groundY, 0, H);
  pg.addColorStop(0, '#f2ddb4');
  pg.addColorStop(0.3, '#e9cd9c');
  pg.addColorStop(1, '#d3b07c');
  ctx.fillStyle = pg;
  ctx.fillRect(0, groundY, W, H - groundY);

  // grass lip over the path
  ctx.fillStyle = '#5ea85a';
  ctx.fillRect(0, groundY - sH * 0.055, W, sH * 0.055);
  ctx.fillStyle = '#79c06e';
  ctx.fillRect(0, groundY - sH * 0.055, W, sH * 0.02);

  // edge tufts
  var es = Math.max(26, sH * 0.24);
  var eo = (world.dist * 1.02) % es;
  for (var ex = -eo; ex < W + es; ex += es) {
    var ei = Math.round((ex + eo) / es);
    var eh = sH * (0.07 + ((ei * 17) % 7) / 62);
    ctx.strokeStyle = 'rgba(64,140,64,0.85)';
    ctx.lineWidth = Math.max(1.6, sH * 0.014);
    ctx.beginPath();
    ctx.moveTo(ex, groundY + 1);
    ctx.quadraticCurveTo(ex - 2, groundY - eh * 0.7, ex - 5, groundY - eh);
    ctx.moveTo(ex + 4, groundY + 1);
    ctx.quadraticCurveTo(ex + 6, groundY - eh * 0.6, ex + 10, groundY - eh * 0.75);
    ctx.stroke();
  }

  // path texture: soft stones
  var ps = Math.max(60, sH * 0.62);
  var po = (world.dist * 1.0) % ps;
  for (var px2 = -po; px2 < W + ps; px2 += ps) {
    var n = Math.round((px2 + po) / ps);
    var yy = groundY + sH * (0.18 + ((n * 13) % 9) / 26);
    ctx.fillStyle = 'rgba(255,248,228,0.34)';
    ctx.beginPath();
    ctx.ellipse(px2 + sH * 0.1, yy, sH * 0.055, sH * 0.016, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(168,136,92,0.28)';
    ctx.beginPath();
    ctx.ellipse(px2 + sH * 0.32, yy + sH * 0.09, sH * 0.04, sH * 0.013, 0, 0, TAU);
    ctx.fill();
  }

  // foreground grass
  var fgs = Math.max(30, sH * 0.26);
  var fgo = (world.dist * 1.25) % fgs;
  for (var gx2 = -fgo; gx2 < W + fgs; gx2 += fgs) {
    var idx2 = Math.round((gx2 + fgo) / fgs);
    var hh = sH * (0.1 + ((idx2 * 29) % 5) / 46);
    ctx.strokeStyle = 'rgba(52,120,58,0.78)';
    ctx.lineWidth = Math.max(2, sH * 0.018);
    ctx.beginPath();
    ctx.moveTo(gx2, H + 6);
    ctx.quadraticCurveTo(gx2 - 3, H - hh * 0.6, gx2 - 8, H - hh);
    ctx.moveTo(gx2 + 7, H + 6);
    ctx.quadraticCurveTo(gx2 + 10, H - hh * 0.55, gx2 + 16, H - hh * 0.8);
    ctx.stroke();
  }
}

function drawPrints(){
  ctx.save();
  for (var i = 0; i < world.prints.length; i++) {
    var p = world.prints[i];
    var s = p.s;
    var a = p.a * clamp(p.x / (sH * 2), 0, 1) * clamp((W - p.x) / (sH * 2), 0, 1);
    ctx.fillStyle = 'rgba(150,118,74,' + a.toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, s * 0.62, s * 0.48, 0, 0, TAU);
    ctx.fill();
    for (var t = 0; t < 4; t++) {
      var ang = -Math.PI * 0.5 + (t - 1.5) * 0.42;
      ctx.beginPath();
      ctx.ellipse(p.x + Math.cos(ang) * s * 0.95 + p.side * s * 0.1,
                  p.y + Math.sin(ang) * s * 0.95, s * 0.22, s * 0.28, ang, 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();
}

/* ---------- obstacles ---------- */
function drawObstacle(o){
  var x = o.x;
  if (o.kind === 'puddle') {
    var w = o.w, h = o.h;
    ctx.save();
    ctx.fillStyle = 'rgba(120,95,55,0.18)';
    ctx.beginPath(); ctx.ellipse(x, groundY + h * 0.24, w * 0.62, h * 0.6, 0, 0, TAU); ctx.fill();
    var g = ctx.createRadialGradient(x, groundY + h * 0.1, h * 0.1, x, groundY + h * 0.1, w * 0.62);
    g.addColorStop(0, 'rgba(176,228,255,0.96)');
    g.addColorStop(0.55, 'rgba(116,192,238,0.94)');
    g.addColorStop(1, 'rgba(84,152,200,0.55)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, groundY + h * 0.12, w * 0.6, h * 0.7, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = Math.max(1.4, sH * 0.011);
    ctx.beginPath();
    ctx.ellipse(x - w * 0.1, groundY + h * 0.02, w * 0.2, h * 0.10, -0.2, Math.PI * 1.05, Math.PI * 1.8);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x + w * 0.2, groundY + h * 0.1, w * 0.1, h * 0.05, 0.2, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
    ctx.restore();
    return;
  }

  if (o.kind === 'leaf') {
    var lw = o.w, lh = o.h;
    ctx.save();
    ctx.fillStyle = 'rgba(110,70,25,0.2)';
    ctx.beginPath(); ctx.ellipse(x, groundY + 1, lw * 0.55, lh * 0.16, 0, 0, TAU); ctx.fill();
    var leafCols = ['#d98b32', '#c8721f', '#e8a94a', '#b7631f', '#e3b04b'];
    for (var i = 0; i < 11; i++) {
      var a = (i / 10) * Math.PI;
      var lx = x + Math.cos(a + Math.PI) * lw * (0.44 - Math.abs(Math.sin(a)) * 0.12) + Math.sin(o.seed + i) * lw * 0.06;
      var ly = groundY - Math.abs(Math.sin(a)) * lh * 0.9 - lh * 0.04;
      var lr = lw * (0.15 + ((i * 7) % 4) / 44);
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(Math.sin(i * 2.1 + o.seed) * 1.1);
      ctx.fillStyle = leafCols[i % leafCols.length];
      ctx.beginPath();
      ctx.moveTo(-lr, 0);
      ctx.quadraticCurveTo(-lr * 0.2, -lr * 0.85, lr, 0);
      ctx.quadraticCurveTo(-lr * 0.2, lr * 0.85, -lr, 0);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(110,60,15,0.3)';
      ctx.lineWidth = Math.max(0.8, lr * 0.1);
      ctx.beginPath(); ctx.moveTo(-lr * 0.8, 0); ctx.lineTo(lr * 0.85, 0); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    return;
  }

  if (o.kind === 'hydrant') {
    var hw = o.w, hh = o.h, top = groundY - hh;
    ctx.save();
    ctx.fillStyle = 'rgba(120,95,55,0.22)';
    ctx.beginPath(); ctx.ellipse(x, groundY + 2, hw * 0.66, hh * 0.09, 0, 0, TAU); ctx.fill();
    var bg = ctx.createLinearGradient(x - hw / 2, 0, x + hw / 2, 0);
    bg.addColorStop(0, '#b83527');
    bg.addColorStop(0.4, '#ef5c3f');
    bg.addColorStop(1, '#9c271b');
    ctx.fillStyle = bg;
    roundRect(x - hw * 0.34, top + hh * 0.22, hw * 0.68, hh * 0.70, hw * 0.2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x, top + hh * 0.24, hw * 0.31, hh * 0.19, 0, Math.PI, TAU);
    ctx.fill();
    ctx.fillStyle = '#e14a34';
    roundRect(x - hw * 0.53, top + hh * 0.40, hw * 0.22, hh * 0.15, hw * 0.08); ctx.fill();
    roundRect(x + hw * 0.31, top + hh * 0.40, hw * 0.22, hh * 0.15, hw * 0.08); ctx.fill();
    ctx.fillStyle = '#ffd9a0';
    ctx.beginPath(); ctx.ellipse(x, top + hh * 0.05, hw * 0.10, hh * 0.06, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    roundRect(x - hw * 0.22, top + hh * 0.30, hw * 0.10, hh * 0.44, hw * 0.05); ctx.fill();
    ctx.fillStyle = '#8a2317';
    roundRect(x - hw * 0.4, groundY - hh * 0.1, hw * 0.8, hh * 0.11, hw * 0.05); ctx.fill();
    ctx.restore();
    return;
  }

  var bw = o.w, bh = o.h;
  ctx.save();
  ctx.fillStyle = 'rgba(55,105,48,0.22)';
  ctx.beginPath(); ctx.ellipse(x, groundY + 2, bw * 0.56, bh * 0.12, 0, 0, TAU); ctx.fill();
  var blobs = [[-0.28, 0.28, 0.34], [0, 0.42, 0.4], [0.28, 0.26, 0.32], [0.12, 0.2, 0.26], [-0.14, 0.18, 0.24]];
  for (var b = 0; b < blobs.length; b++) {
    var bx = x + bw * blobs[b][0], by = groundY - bh * blobs[b][1], br = bw * blobs[b][2];
    var gg2 = ctx.createRadialGradient(bx - br * 0.3, by - br * 0.4, br * 0.15, bx, by, br);
    gg2.addColorStop(0, '#82c66d');
    gg2.addColorStop(0.7, '#4b8f3e');
    gg2.addColorStop(1, '#2f6a2a');
    ctx.fillStyle = gg2;
    ctx.beginPath(); ctx.arc(bx, by, br, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = '#ffe066';
  for (var f = 0; f < 4; f++) {
    ctx.beginPath();
    ctx.arc(x + Math.sin(o.seed + f * 2.7) * bw * 0.34, groundY - bh * (0.42 + (f % 3) * 0.16), Math.max(1.6, sH * 0.016), 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r){
  var rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

/* ---------- items ---------- */
function itemBob(o){ return Math.sin(world.time * 3 + o.seed) * sH * 0.032; }

function drawItemShadow(o){
  var alt = clamp((groundY - o.y) / (sH * 1.8), 0, 1);
  ctx.fillStyle = 'rgba(120,95,55,' + (0.14 * (1 - alt) + 0.03).toFixed(3) + ')';
  ctx.beginPath();
  ctx.ellipse(o.x, groundY + 2, o.w * 0.5 * (1 - alt * 0.45), o.h * 0.16, 0, 0, TAU);
  ctx.fill();
}

function drawItem(o){
  var x = o.x, y = o.y + itemBob(o);

  if (o.kind === 'bone') {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(o.seed + world.time * 2) * 0.14);
    var s = o.w * 0.5;
    var bg = ctx.createLinearGradient(0, -s * 0.6, 0, s * 0.6);
    bg.addColorStop(0, '#fffdf3');
    bg.addColorStop(0.55, '#f4e5c6');
    bg.addColorStop(1, '#d9bf92');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(-s * 0.62, -s * 0.3, s * 0.3, 0, TAU);
    ctx.arc(-s * 0.62, s * 0.3, s * 0.3, 0, TAU);
    ctx.arc(s * 0.62, -s * 0.3, s * 0.3, 0, TAU);
    ctx.arc(s * 0.62, s * 0.3, s * 0.3, 0, TAU);
    ctx.fill();
    roundRect(-s * 0.66, -s * 0.28, s * 1.32, s * 0.56, s * 0.2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    ctx.beginPath(); ctx.ellipse(-s * 0.3, -s * 0.12, s * 0.26, s * 0.085, -0.2, 0, TAU); ctx.fill();
    ctx.restore();
    return;
  }

  if (o.kind === 'gold') {
    var pulse = 1 + Math.sin(world.time * 4 + o.seed) * 0.06;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(pulse, pulse);
    var r = o.w * 0.5;
    var gl = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 2.2);
    gl.addColorStop(0, 'rgba(255,232,140,0.5)');
    gl.addColorStop(1, 'rgba(255,220,100,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(0, 0, r * 2.2, 0, TAU); ctx.fill();
    var g2 = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
    g2.addColorStop(0, '#fff8d6');
    g2.addColorStop(0.45, '#ffd354');
    g2.addColorStop(1, '#dd9610');
    ctx.fillStyle = g2;
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var ang = (i / 10) * TAU - Math.PI / 2, rr = (i % 2 === 0) ? r : r * 0.56;
      var px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(150,90,10,0.3)';
    ctx.lineWidth = Math.max(1, sH * 0.008);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.ellipse(-r * 0.22, -r * 0.3, r * 0.2, r * 0.11, -0.5, 0, TAU); ctx.fill();
    ctx.restore();
    return;
  }

  // devil trident treat
  ctx.save();
  ctx.translate(x, y);
  var s2 = o.w * 0.5;
  var aura = 0.42 + Math.sin(world.time * 6 + o.seed) * 0.12;
  var ag = ctx.createRadialGradient(0, 0, s2 * 0.2, 0, 0, s2 * 2.1);
  ag.addColorStop(0, 'rgba(255,90,60,' + aura.toFixed(2) + ')');
  ag.addColorStop(0.45, 'rgba(215,45,25,' + (aura * 0.4).toFixed(2) + ')');
  ag.addColorStop(1, 'rgba(200,30,20,0)');
  ctx.fillStyle = ag;
  ctx.beginPath(); ctx.arc(0, 0, s2 * 2.1, 0, TAU); ctx.fill();

  ctx.rotate(Math.sin(world.time * 2.2 + o.seed) * 0.1);
  ctx.strokeStyle = '#d8341f';
  ctx.lineWidth = Math.max(2, s2 * 0.24);
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, s2 * 0.9); ctx.lineTo(0, -s2 * 0.3); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-s2 * 0.72, -s2 * 0.02);
  ctx.quadraticCurveTo(-s2 * 0.68, -s2 * 0.9, 0, -s2 * 0.32);
  ctx.quadraticCurveTo(s2 * 0.68, -s2 * 0.9, s2 * 0.72, -s2 * 0.02);
  ctx.stroke();
  ctx.fillStyle = '#ff6a4a';
  [[-s2 * 0.72, -s2 * 0.02], [0, -s2 * 0.86], [s2 * 0.72, -s2 * 0.02]].forEach(function(pt){
    ctx.beginPath();
    ctx.moveTo(pt[0], pt[1] - s2 * 0.2);
    ctx.lineTo(pt[0] + s2 * 0.15, pt[1] + s2 * 0.1);
    ctx.lineTo(pt[0] - s2 * 0.15, pt[1] + s2 * 0.1);
    ctx.closePath(); ctx.fill();
  });
  ctx.restore();
}

/* ---------- player ---------- */
function drawPlayer(){
  var p = world.player;
  var img = world.fever > 0 ? sprites.devil : sprites.run;
  var h = sH;
  var alt = groundY - p.y;

  var fade = clamp(1 - alt / (sH * 2.1), 0, 1);
  ctx.fillStyle = 'rgba(105,80,40,' + (0.22 * fade + 0.02).toFixed(3) + ')';
  ctx.beginPath();
  ctx.ellipse(p.x, groundY + sH * 0.012, sH * 0.33 * (0.62 + fade * 0.38), sH * 0.07, 0, 0, TAU);
  ctx.fill();

  if (!img || !img.complete || !img.naturalWidth) {
    ctx.fillStyle = '#2c2a24';
    ctx.beginPath(); ctx.arc(p.x, p.y - h * 0.45, h * 0.3, 0, TAU); ctx.fill();
    return;
  }

  var runPhase = world.dist / (sH * 0.85);
  var bob = p.onGround ? Math.abs(Math.sin(runPhase)) * sH * 0.03 : 0;
  var tilt = p.onGround ? Math.sin(runPhase) * 0.022 : clamp(p.vy / (sH * 9), -0.09, 0.13);
  var sq = world.squash;
  var sx = 1 + sq * 0.28, sy = 1 - sq * 0.28;

  var glow = ctx.createRadialGradient(p.x, p.y - h * 0.45, h * 0.1, p.x, p.y - h * 0.45, h * 0.95);
  glow.addColorStop(0, 'rgba(255,250,225,0.17)');
  glow.addColorStop(1, 'rgba(255,250,225,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(p.x, p.y - h * 0.45, h * 0.95, 0, TAU); ctx.fill();

  if (world.fever > 0) {
    var pl = 0.7 + Math.sin(world.time * 12) * 0.22;
    var hh = h * 1.05;
    var ag = ctx.createRadialGradient(p.x, p.y - h * 0.48, h * 0.05, p.x, p.y - h * 0.48, hh);
    ag.addColorStop(0, 'rgba(255,110,60,' + (0.4 * pl).toFixed(2) + ')');
    ag.addColorStop(0.55, 'rgba(220,45,25,' + (0.2 * pl).toFixed(2) + ')');
    ag.addColorStop(1, 'rgba(180,20,10,0)');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(p.x, p.y - h * 0.48, hh, 0, TAU); ctx.fill();
  }

  ctx.save();
  if (world.invuln > 0 && Math.floor(world.invuln * 12) % 2 === 0) ctx.globalAlpha = 0.45;
  ctx.translate(p.x, p.y - bob);
  ctx.rotate(tilt);
  ctx.scale(sx, sy);
  var w = h * (img.width / img.height);
  ctx.drawImage(img, -w / 2, -h, w, h);
  ctx.restore();
}

/* ---------- particles ---------- */
function drawParticles(front){
  for (var i = 0; i < world.parts.length; i++) {
    var q = world.parts[i];
    if ((q.kind === 'dot') !== front) continue;
    var a = clamp(q.life / q.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = a * (q.kind === 'smoke' ? 0.5 : 0.95);
    ctx.fillStyle = q.c;
    if (q.kind === 'smoke') {
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (1.5 - a * 0.4), 0, TAU); ctx.fill();
    } else {
      ctx.translate(q.x, q.y);
      ctx.rotate(q.rot);
      ctx.beginPath(); ctx.ellipse(0, 0, q.r, q.r * 0.6, 0, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

function drawPops(){
  for (var i = 0; i < world.pops.length; i++) {
    var q = world.pops[i];
    var a = clamp(q.life / q.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = Math.min(1, a * 1.6);
    ctx.font = '900 ' + Math.round(sH * 0.17) + 'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = Math.max(3, sH * 0.03);
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.strokeText(q.text, q.x, q.y);
    ctx.fillStyle = q.c;
    ctx.fillText(q.text, q.x, q.y);
    ctx.restore();
  }
}

/* ---------- hud ---------- */
function drawHud(){
  if (world.mode === 'ready') return;
  var pad = Math.max(14, W * 0.045);
  var scoreSize = Math.round(clamp(W * 0.085, 26, 40));
  var topY = Math.max(52, H * 0.078) + scoreSize * 0.5;

  ctx.save();
  ctx.textAlign = 'left';

  // score
  ctx.font = '900 ' + scoreSize + 'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText(fmt(world.score), pad + 2, topY + 2.5);
  ctx.fillStyle = '#3a3324';
  ctx.fillText(fmt(world.score), pad, topY);

  // best
  var smallSize = Math.round(clamp(W * 0.032, 11, 14));
  var bestY = topY + Math.round(scoreSize * 0.62);
  ctx.font = '700 ' + smallSize + 'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  ctx.fillStyle = 'rgba(58,51,36,0.6)';
  ctx.fillText('최고 ' + fmt(world.best), pad, bestY);

  var stackY = bestY + 4;

  // combo
  if (world.combo > 1 && world.comboT > 0) {
    var combSize = Math.round(clamp(W * 0.042, 13, 19));
    ctx.globalAlpha = clamp(world.comboT / 1.1, 0, 1);
    ctx.font = '900 ' + combSize + 'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    ctx.fillStyle = '#d95f2e';
    ctx.fillText('콤보 ' + world.combo + (comboMult() > 1 ? '  x' + comboMult() : ''), pad, stackY + combSize);
    ctx.globalAlpha = 1;
    stackY += combSize + 4;
  }

  // fever bar
  if (world.fever > 0) {
    var bw = Math.min(W * 0.4, 200), bh = Math.max(8, sH * 0.055);
    var by = stackY + (world.combo > 1 ? 4 : 12);
    ctx.fillStyle = 'rgba(60,40,20,0.2)';
    roundRect(pad, by, bw, bh, bh / 2); ctx.fill();
    var fg = ctx.createLinearGradient(pad, 0, pad + bw, 0);
    fg.addColorStop(0, '#ffc23d');
    fg.addColorStop(0.6, '#ff6b35');
    fg.addColorStop(1, '#d63a22');
    ctx.fillStyle = fg;
    roundRect(pad, by, Math.max(bh, bw * clamp(world.fever / world.feverMax, 0, 1)), bh, bh / 2); ctx.fill();
    ctx.font = '900 ' + Math.round(clamp(W * 0.027, 10, 12)) + 'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    ctx.fillStyle = '#b83a1e';
    ctx.fillText('꼬마 악마 피버!', pad + bw + 7, by + bh - 1);
  }

  // hearts (below the mute button)
  var hs = clamp(W * 0.05, 15, 22);
  var hy = Math.max(72, H * 0.11);
  for (var i = 0; i < 3; i++) {
    drawHeart(W - pad - hs * 0.55 - i * (hs * 1.3), hy, hs * 0.48, i < world.lives);
  }

  // first-run hint
  if (world.mode === 'playing' && world.hint > 0 && world.player.onGround) {
    ctx.globalAlpha = clamp(world.hint / 1.1, 0, 1) * 0.92;
    ctx.textAlign = 'center';
    ctx.font = '800 ' + Math.round(clamp(W * 0.038, 12, 16)) + 'px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    var txt = '톡 = 점프 · 한 번 더 = 더블 점프';
    var tw = ctx.measureText(txt).width;
    var hy2 = H * 0.33;
    ctx.fillStyle = 'rgba(255,252,240,0.88)';
    roundRect(W / 2 - tw / 2 - 13, hy2 - 17, tw + 26, 32, 16);
    ctx.fill();
    ctx.fillStyle = '#6b5f42';
    ctx.fillText(txt, W / 2, hy2 + 5);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }
  ctx.restore();
}

function drawHeart(cx, cy, r, filled){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();
  ctx.moveTo(0, r * 0.78);
  ctx.bezierCurveTo(-r * 1.55, -r * 0.34, -r * 0.66, -r * 1.4, 0, -r * 0.44);
  ctx.bezierCurveTo(r * 0.66, -r * 1.4, r * 1.55, -r * 0.34, 0, r * 0.78);
  ctx.closePath();
  if (filled) {
    var g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, '#ff8f74');
    g.addColorStop(1, '#df4128');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,75,45,0.3)';
  }
  ctx.lineWidth = Math.max(1.1, r * 0.16);
  ctx.stroke();
  ctx.restore();
}

function drawVignette(){
  if (world.fever > 0) {
    var a = 0.26 + Math.sin(world.time * 9) * 0.05;
    var g = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.3, W / 2, H * 0.45, Math.max(W, H) * 0.78);
    g.addColorStop(0, 'rgba(200,20,10,0)');
    g.addColorStop(1, 'rgba(190,20,10,' + a.toFixed(2) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  if (world.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,240,' + (world.flash * 0.3).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- loop ---------- */
var last = 0;
function frame(ts){
  if (!last) last = ts;
  var dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ---------- ui ---------- */
startScreen = document.getElementById('startScreen');
overScreen = document.getElementById('overScreen');
var muteBtn = document.getElementById('muteBtn');

document.getElementById('startBtn').addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
document.getElementById('againBtn').addEventListener('click', function(e){ e.stopPropagation(); startGame(); });
muteBtn.addEventListener('click', function(e){
  e.stopPropagation();
  muteBtn.textContent = Sound.toggle() ? '🔇' : '🔊';
});
muteBtn.textContent = Sound.isMuted() ? '🔇' : '🔊';
document.getElementById('startBest').textContent = fmt(world.best);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) last = 0; });

/* ---------- dev hook ---------- */
window.__bada = {
  world: world,
  startFever: startFever,
  addItem: addItem,
  jump: jump,
  start: startGame
};

/* ---------- boot ---------- */
layout();
resetGame();
loadSprites(function(){
  var hero = document.getElementById('heroImg');
  if (sprites.run && sprites.run.naturalWidth) hero.src = sprites.run.src;
  else hero.style.display = 'none';
  requestAnimationFrame(frame);
});

})();
</script>
</body>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>bada runner · live check</title>
<style>
  html,body{margin:0;padding:0;background:#1b1e24;}
  #f{border:0;display:block;position:fixed;left:0;top:0;background:#000;}
</style>
</head>
<body>
<script>
  var q = (location.search.match(/s=(\d+)x(\d+)/) || []);
  var w = parseInt(q[1] || '844', 10), h = parseInt(q[2] || '390', 10);
  var f = document.createElement('iframe');
  f.id = 'f';
  f.width = w; f.height = h;
  f.style.width = w + 'px'; f.style.height = h + 'px';
  f.src = './index.html?v=' + Date.now();
  document.body.appendChild(f);
  window.__frame = f;
</script>
</body>
</html>
